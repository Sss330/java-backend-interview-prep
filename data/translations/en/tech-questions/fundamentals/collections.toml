[[questions]]
id = 37
question = "How are Iterable and the enhanced for loop related?"
answer = """
`Iterable` defines `iterator()`, allowing an object to supply an iterator over its elements. For an `Iterable`, the enhanced `for` loop is syntactic sugar for iteration:

```java
List<String> list = List.of("a", "b", "c");

// Enhanced for loop
for (String item : list) {
    System.out.println(item);
}

// Equivalent iterator-based loop
Iterator<String> iterator = list.iterator();
while (iterator.hasNext()) {
    String item = iterator.next();
    System.out.println(item);
}
```

Enhanced `for` loops also support **arrays**, which do not implement `Iterable`.

**Can you remove elements while iterating over a collection?**

For an ordinary mutable collection with a fail-fast iterator, use the iterator's own `remove()` method when supported. Structural modification through the collection itself can cause `ConcurrentModificationException`.

```java
List<String> list = new ArrayList<>(List.of("a", "b", "c"));
Iterator<String> iterator = list.iterator();

while (iterator.hasNext()) {
    String item = iterator.next();
    if ("b".equals(item)) {
        iterator.remove(); // Remove through the iterator
    }
}

System.out.println(list); // [a, c]
```

Avoid changing the list directly while its iterator is in use:

```java
for (String item : list) {
    if ("a".equals(item)) {
        list.remove(item); // Can trigger ConcurrentModificationException
    }
}
```

**Fail-fast vs. snapshot and weakly consistent iterators**

Fail-fast iterators, such as those of `ArrayList`, `HashSet`, and `HashMap`, detect structural modifications on a best-effort basis, often by tracking `modCount`. They help detect bugs; they do not make a collection thread-safe. The exception can also occur within a single thread.

The informal term **fail-safe** often refers to iterators that tolerate concurrent modifications, but these do not all work in the same way:

- `CopyOnWriteArrayList` iterators traverse a snapshot. Later writes do not change that snapshot, and the iterator does not support removal.
- `ConcurrentHashMap` iterators are weakly consistent. They may reflect updates made during iteration, do not require a full snapshot, and do not throw `ConcurrentModificationException`.

| Criterion | Fail-fast | Snapshot / weakly consistent |
| --- | --- | --- |
| Examples | ArrayList, HashSet, HashMap | CopyOnWriteArrayList, ConcurrentHashMap |
| Concurrent structural changes | May throw ConcurrentModificationException | Tolerated according to implementation semantics |
| Mechanism | Detect unexpected structural changes | Traverse a snapshot or tolerate concurrent updates |
| Performance | Depends on collection and workload | Copy-on-write makes writes expensive; concurrent maps use a different strategy |

Choose a collection according to the required concurrency guarantees and read/write workload.
"""
source_hash = "6bcb281c92c5bd919bd3087d2ca01326d85396bac999f610070fd2abcfbb1b3e"

[[questions]]
id = 38
question = "What are the Map implementations, and why is Map a separate interface?"
answer = """
`Map` stores **key-value pairs**, whereas `Collection` models individual elements. Its operations and uniqueness rules therefore require a separate interface.

| Implementation | Characteristics |
| --- | --- |
| HashMap | Fast key lookup, no guaranteed order, permits a null key |
| LinkedHashMap | Preserves insertion order by default; can use access order |
| TreeMap | Sorts keys using a red-black tree |
| ConcurrentHashMap | Thread-safe operations and weakly consistent iterators |
| WeakHashMap | Weak references to keys allow entries to disappear after garbage collection |

`WeakHashMap` can be useful for associations whose lifetime should follow their keys, but it is not a general-purpose cache policy.
"""
source_hash = "28cff723e4e8a2da43a1a19875b11897317e63ccf6658c904bf9ca48e5fd4f84"

[[questions]]
id = 39
question = "Which collection should you use for unique, sorted values?"
answer = """
`TreeSet` stores elements in natural order or according to a supplied comparator. It treats elements as duplicates when their comparison result is zero.
"""
source_hash = "b2e406974d0bee0d3b915f5710d227411611d3438cfdf3093600a1a4d52e967c"

[[questions]]
id = 40
question = "What is Hashtable?"
answer = """
`Hashtable` is a legacy hash-table implementation in `java.util` that stores key-value pairs.

1. **Synchronization:** its methods are synchronized. Compound operations may still require additional coordination.
2. **No null keys or values:** attempts to use them result in `NullPointerException`.
3. **Modern alternatives:** `HashMap` is commonly used without concurrent access, and `ConcurrentHashMap` is commonly used for concurrent access.
"""
source_hash = "bef988968fdf80911e6e028a6136de0fb5de0f1f4b4fb6b0f0eb5cff7b71c3dd"

[[questions]]
id = 41
question = "How do Arrays.asList() and List.of() differ?"
answer = """
| Criterion | Arrays.asList() | List.of() |
| --- | --- | --- |
| Mutability | Fixed size; elements can be replaced with set() | Unmodifiable; elements cannot be added, removed, or replaced |
| Null elements | Allowed | Rejected |
| Backing storage | Backed by the supplied array | Does not expose a mutable backing array |
| Runtime type | Commonly java.util.Arrays$ArrayList | An internal unmodifiable list implementation; the exact class is not an API guarantee |
| Unsupported operations | Size-changing operations throw UnsupportedOperationException | Mutating operations throw UnsupportedOperationException |
| Use case | View an array as a list while allowing element replacement | Create an unmodifiable list |

An unmodifiable list can still contain mutable objects; the restriction applies to the list itself.
"""
source_hash = "50f92d99423efd3da9a824966bd4dffe5211292b24bf3a999d2c3f2c9e587785"

[[questions]]
id = 42
question = "What is LinkedHashMap?"
answer = """
`LinkedHashMap` combines a hash table with a doubly linked list of entries. By default, iteration follows insertion order. A constructor option enables access order, which can be used as the basis of an **LRU cache** when combined with an eviction policy, such as overriding `removeEldestEntry()`.
"""
source_hash = "36a596c49dc662ff1516cd3e0af9a07ec67d80be1f84f5a525f9960067361f50"

[[questions]]
id = 43
question = "What are the time complexities of tree data structure operations?"
answer = """
| Operation | Unordered tree | Unbalanced binary search tree | Balanced binary search tree | B-tree |
| --- | --- | --- | --- | --- |
| Search | O(n) | O(h): average O(log n), worst O(n) | O(log n) | O(log n) |
| Insert by key | Depends on placement rules; locating a position may take O(n) | O(h): average O(log n), worst O(n) | O(log n) | O(log n) |
| Delete by key | Depends on representation; locating a node may take O(n) | O(h): average O(log n), worst O(n) | O(log n) | O(log n) |

Here `h` is the tree height. The logarithmic average for an unbalanced BST assumes a suitable distribution of insertions; ordered insertions can produce a chain. A balanced tree maintains logarithmic height. B-tree bounds assume a fixed node capacity; their high branching factor reduces the number of node accesses.
"""
source_hash = "d3fa2c38009823e70497047f2007c4c8657b8e48b27e675b162312e4f35fd0ba"
