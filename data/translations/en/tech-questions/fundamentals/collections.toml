question = "What are the time complexities of Deque operations?"
answer = """
For `LinkedList`, insertion and removal at either end take **O(1)**. For `ArrayDeque`, these operations take **O(1) amortized**, because insertion may grow the array. Searching for or removing an arbitrary value takes **O(n)**. The `Deque` interface itself does not prescribe one implementation or complexity.
"""
