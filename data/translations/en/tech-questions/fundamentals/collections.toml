question = "What are the time complexities of Queue operations?"
answer = """
They depend on the implementation. For common linked or array-based queues, `offer()`, `poll()`, and `peek()` are O(1), with amortized O(1) insertion when an array grows. For `PriorityQueue`, `offer()` and `poll()` are **O(log n)**, while `peek()` is **O(1)**.
"""
