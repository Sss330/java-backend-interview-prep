question = "What is Queue?"
answer = """
`Queue` is an interface for holding elements before processing. Queues commonly follow **FIFO** (First In, First Out), but the ordering depends on the implementation. For example, `PriorityQueue` retrieves elements according to priority rather than insertion order.
"""
source_hash = "a07cccb0e74259978e6b3669c23d57915a083b659d97fe058bde425bfbd7ef6c"

[[questions]]
