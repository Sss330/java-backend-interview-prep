question = "What is Deque?"
answer = """
`Deque` means **double-ended queue**. Elements can be added, inspected, or removed at either end. It can therefore act as both a **FIFO** queue and a **LIFO** stack.

**What does double-ended mean?**

Both the front and the back of the queue support insertion and removal.
"""
