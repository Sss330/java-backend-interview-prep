question = "HashMap vs. TreeMap"
answer = """
| Criterion | HashMap | TreeMap |
| --- | --- | --- |
| Data structure | Hash table | Red-black tree |
| `put()` / `get()` | Expected O(1), with amortized insertion | O(log n) |
