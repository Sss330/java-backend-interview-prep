[[questions]]
id = 34
question = "What methods does Object provide?"
answer = """
Object is the base class for all objects in Java. Any class one way or another inherits from `Object`, and, accordingly, inherits its methods (11 pieces):
- `equals()` - determines whether one object is equal to another.
- `hashCode()` - Returns the hash code associated with the caller.
- `toString()` - returns a character string describing the object.
- `getClass()` - Gets the class of the object at runtime.
- `clone()` - creates a new object, no different from the one being cloned.
- `finalize()` - called before deleting an unused object.

As well as methods for multithreading:
- `notify()` - Resumes execution of the thread waiting for the caller.
- `notifyAll()` - Resumes execution of all threads waiting on the caller.
- `wait()`, `wait(long timeout)`, `wait(long timeout, int nanos)` - awaits another thread of execution.

---
***finalize() method***

`finalize()` is a method in the `Object` class that is called before the object is destroyed by the garbage collector (GC). Labeled as `@Deprecated` with Java 9 with the possibility of further removal.

**Modern alternative:**  
Java 9+: use `Cleaner` or `try-with-resources`.

"""
source_hash = "4d7cb091db16c79eda8bb337b5c835a74311a2c3b31f058a67eb62a9199f1b9a"

[[questions]]
id = 35
question = "What is serialization and why is it needed?"
answer = "Serialization is a mechanism for converting objects into a byte string. In Java, it is implemented through the Serializable token interface. Needed to compactly save the state of an object, transmit it over a network, and read this state"
source_hash = "eac7225bad791801d9830cddd66409ec36403e558842fe6631c41a5c8da6ee88"

[[questions]]
id = 36
question = "What are the main differences between Java versions?"
answer = """
- **Java 8** - lambda expressions, Stream API, Optional API, new Date and Time API, `default` methods in interfaces
- **Java 9** - modular system (JPMS), improvements to Stream API and methods `Optional.ifPresentOrElse`, factory methods for collections (`List.of`)
- **Java 10** - local typing (`var`), GC improvements, API for creating immutable collections (`List.copyOf, Set.copyOf, Map.copyOf`)
- **Java 11** - support for `var` in lambdas, new HTTP client
- **Java 17** - `record`, `sealed` classes, improvements in GC and performance, pattern matching for `instanceof`
- **Java 21** - virtual threads, pattern matching for `switch`, support for sealed hierarchies for `record`, improvements in GC
- **Java 23** - `flexible constructor`, javadoc comments in markdown format, ZGC improvements
- **Java 25** - JIT improvements, `scoped values` instead of `ThreadLocal`, `structurred concurrency`, `stable value` instead of singleton"""
source_hash = "b4e72b64f8490ba6b9e60e5afb08b1040ca11b9fa2c17cdc565c90f5eb1da9d5"

