question = "What are the JVM, JRE, JDK, and JIT compiler?"
answer = """
**JVM (Java Virtual Machine)** is a Java virtual machine that executes bytecode.
**JRE (Java Runtime Environment)** - JVM + a set of standard libraries required to run Java applications:
- java.lang - String, System, Object
- java.io - InputStream, OutputStream
- java.util - collections (List, Set, Map)
**JDK (Java Development Kit)** - developer kit, includes JRE + compiler and other tools
