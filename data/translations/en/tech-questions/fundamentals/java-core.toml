[[questions]]
id = 32
question = "In what order do constructors and initialization blocks run across a class hierarchy?"
answer = """
1. Static blocks on the parent
2. Static block at the subclass
3. Non-static block on parent
4. Parent constructor
5. Non-static blocks at the subclass
6. Subclass constructor

"""
