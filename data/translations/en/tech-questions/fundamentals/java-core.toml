[[questions]]
id = 7
question = "What are the advantages and disadvantages of Java?"
answer = """
***Pros:***
- **Object-oriented programming** The data structure becomes an object that can be manipulated, creating relationships between different objects.

- **A high-level language with simple syntax and a smooth learning curve.** Java syntax is based on C++, so Java is similar to C. However, Java's syntax is simpler, allowing beginners to learn faster and use code more efficiently to achieve specific results.
- **The standard for enterprise computing.** Enterprise applications have been Java's main strength since the 90s, when organizations began looking for reliable non-C programming tools.
- **Security** Thanks to the absence of pointers and the Security Manager (a security policy in which you can specify access rules, you can run Java applications in a sandbox).
- **Platform independent** You can create a Java application on Windows, compile it to bytecode, and run it on any other platform that supports the Java Virtual Machine (JVM). Thus, the JVM serves as an abstraction layer between the code and the hardware.
- **A language for distributed programming and comfortable remote collaboration.** A Java-specific distributed computing methodology is called Remote Method Invocation (RMI). RMI allows you to take full advantage of Java: security, platform independence, and object-oriented programming for distributed computing. In addition, Java also supports socket programming and the CORBA distribution methodology for exchanging objects between programs written in different languages.
- **Automatic Memory Management** (Debatable: Pro or Cons) Java developers don't have to manually write memory management code thanks to Automatic Memory Management (AMM).
- **Multi-threading** A thread is the smallest unit of processing in programming. To make the most of CPU time, Java allows threads to run simultaneously, which is called multithreading.
- **Stability and Community.** The Java developer community is second to none. About 45% of StackOverflow 2018 survey respondents use Java.

***Cons:***
- Paid commercial use (since 2019)
- Verbose code

"""
source_hash = "b90ce9c446ae873235eed3e78488acd09ee44e60154d0eabf6ec73e5126972a8"

