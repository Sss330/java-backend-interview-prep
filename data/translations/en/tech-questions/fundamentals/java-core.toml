[[questions]]
id = 10
question = "What is a garbage collector?"
answer = """
**The garbage collector** is a mechanism in the JVM that is responsible for managing objects in memory. The programmer allocates memory for objects; the collector searches for and clears memory of unused objects (objects to which there are no direct or indirect references).

| **Java Version** | **GC by default** | **Notes**                                             |
| --------------- | ------------------- | ---------------------------------------------------------- |
| Java 8          | Parallel GC         | Optimized for throughput.                  |
| Java 9          | G1                  | G1 became the default collector, replacing Parallel GC.       |
| Java 10         | G1                  | Improvements in G1, including parallel full garbage collection. |
| Java 11         | G1                  | ZGC and Shenandoah (experimental) introduced.              |
| Java 12         | G1                  | Improvements to G1, including reclaiming unused memory.     |
| Java 13         | G1                  | Improvements to ZGC and Shenandoah.                              |
| Java 14         | G1                  | ZGC and Shenandoah became stable.                        |
| Java 15         | G1                  | ZGC has become cross-platform.                               |
| Java 16         | G1                  | Improvements to ZGC and Shenandoah.                              |
| Java 17         | G1                  | CMS has been permanently removed.                                   |
| Java 21         | G1                  | Introduced Generational ZGC, improvements to G1, ZGC and Shenandoah. |

**When to use other GCs?**
- **ZGC** - for applications with huge heaps (terabytes) and minimal latency requirements (less than 10 ms).
- **Shenandoah** - for applications with low latency and large heaps.
- **Parallel GC** - for applications where throughput is important, not low latency.
- **Serial GC** - for single threaded applications or applications with small heaps."""
source_hash = "9554bf78346468acc9b249700e75f2f0043f632413a46cd2569eb561dda7b042"

[[questions]]
id = 11
question = "How does GC work?"
answer = """
1. Finding unreachable objects - checks if there are references to the object.
2. Cleanup - if an object is unreachable, its memory is freed.
3. Memory refresh - freed memory becomes available for new objects.

Basic GC algorithms:
- Mark-and-Sweep - marks used objects and removes unused ones.
- Generational GC - divides memory into young, older and permanent generations to optimize performance."""
source_hash = "75838f4ab61292bcecd30b89b89ca068233a2605f33f9d2a800c143274847077"

[[questions]]
id = 12
question = "Which garbage collectors do you know?"
answer = """
- **Serial GC** is a simple single-threaded garbage collector that is well suited for small applications and small memory footprints.
- **Parallel GC (Throughput GC)** is a multi-threaded collector that focuses on maximum application performance.
- **CMS (Concurrent Mark Sweep)** - A low latency sweeper that attempted to do some work in parallel with the application, but is now deprecated.
- **G1 GC (Garbage First)** is a versatile picker that balances speed with predictable pauses.
- **ZGC** is a modern collector for applications where ultra-low latency, typically within milliseconds, is important.
- **Shenandoah** - a low-latency collector, similar in purpose to ZGC, also tries to minimize application pauses.
- **Epsilon GC** is a special collector that does not free memory at all and is used mainly for tests and benchmarks."""
source_hash = "25442368af3e0b95390687a644df532de3d05758fc75902f99e895f8a6fa0e60"

[[questions]]
id = 13
question = "What are the JVM memory areas, including the stack and heap?"
answer = """
{{< figure src="/java-backend-interview-prep/jvm_memory_structure.png" title="JVM memory structure according to the specification" >}}

Let's sort it out from the point of view. specifications and implementations in the HotSpot JVM. 

**Native memory** is all the memory that the JVM process receives directly from the operating system. It has a heap inside, all other areas are in native memory.

**Heap** (heap) - used to allocate memory for objects and classes. Creation of a new object also occurs on the heap. Any object created on the heap has global access and can be referenced from anywhere in the application. Managed by the garbage collector.
In implementation, HotSpot is divided into:
- **Young Generation** - for recently created objects
    - **Eden Space** - newly created objects go here, GC takes place here most often
    - **Survivor Space** - divided into two (S1, S2), from Eden the “surviving” objects go to S1, those that survived several garbage collections in S1 go to S2
- **Old Generation** - for long-lived objects
- **(before Java 8) Perm Generation** - storage of static objects, size limited

**Method Area** (**MetaSpace** for HotSpot) - Stores class structure such as class metadata, constant pool, static variables and method code. Available to all threads in the JVM. In Java 8, **MetaSpace** replaced PermGen (which was part of the heap) and, unlike it, its size increases automatically and has no explicit limit

**Stack Area** is the Thread Stack storage area. The stack is created when a thread starts and is accessible only from its own thread. The stack stores frames (those lines in the lower left corner in debug mode in IntelliJ) that are created when a method is called and deleted when it exits. Frames are stored on the stack using the LIFO principle (last in, first out)


{{< figure src="/java-backend-interview-prep/ide_stackframes.png" title="" >}}

The frame contains all the local variables required to execute the methods. All local variables of primitive types are completely stored on the stack, local variables that reference an object are also stored on the stack, but the object itself is stored on the heap

**Registers (PC Registers)** - each thread has its own register, it stores the address of the current bytecode instruction and allows the JVM to continue executing the thread after switches

**Native Method Stack** is a memory area that stores stacks for calling native methods, that is, methods written in other programming languages such as C or C++

In addition to the specification, HotSpot has 
- **Code Cache** - stores code optimized by the JIT compiler for fast execution, used during the JVM “warm-up” process. Separate area in native memory
- **Shared Libs** are native libraries connected by the JVM (libc, libjvm.so, JNI libraries)"""
source_hash = "aafa08ff51c89aae9a7543bd9a55c9dc9271650c50cc6808460ac1f0a8970e59"

