[[questions]]
id = 3
question = "What types of object references exist in Java?"
answer = """
Types of references in Java:
- **Strong reference** - the object will not be deleted by the garbage collector as long as there is at least one strong reference to it `Object a = new Object()`
- **Soft reference** - used for caching. The object referenced by the soft reference will only be garbage collected when there is out of memory
  `SoftReference<MyObject> softRef = new SoftReference<>(new MyObject())`
- **Weak reference** - the object it refers to may be deleted the next time the garbage collector is called
  `WeakReference<MyObject> weakRef = new WeakReference<>(new MyObject())`
- **Phantom reference** - used to track when an object has been removed from memory. A phantom reference does not allow you to access an object directly, it only signals that the object will soon be deleted 
  `PhantomReference<MyObject> phantomRef = new PhantomReference<>(new MyObject(), referenceQueue)`"""
source_hash = "368a23ba3ce3e8a50d8c049e74b734655ca9147b615504f3be4997958d25e4b8"

