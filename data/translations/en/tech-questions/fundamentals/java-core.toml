[[questions]]
id = 23
question = "What is a constructor?"
answer = """
**Constructor** is a specialized method of a class designed to initialize an instance of that class.

**The default constructor** is a parameterless constructor that is automatically created by the compiler if no other constructors have been declared.

**Why are private constructors needed?**
A private constructor prevents the creation of an instance of a class outside of the methods of the class itself. Needed to implement patterns `singleton`
```java
public class Singleton {
    // Static field for storing a single instance of a class
    private static Singleton instance;

    // Private constructor to prevent instantiation from outside
    private Singleton() {}

    // Public method for accessing a single instance of a class
    public static Singleton getInstance() {
        if (instance == null) {
            instance = new Singleton();
        }
        return instance;
    }
}
```

**What is the difference between a default constructor, a copy constructor, and a constructor with parameters?**
- Default constructor - no parameters, default
- Copy constructor - accepts an object of the same type, copies its fields
- Constructor with parameters - takes as input parameters for the configuration of the object when created
"""
source_hash = "da11f44d99a4c66dbbeef400af39db55e2eea20405d8c2728a5eea7bb1b5bcc7"

[[questions]]
id = 24
question = "What are the access modifiers? Which ones apply to classes?"
answer = """
- `private` - access only from the class in which it is declared
- `default` - the component is available to any other class in the same package
- `protected` - the component is available to all classes inside the package, as well as to all descendant classes outside the package
- `public` - access to the component from anywhere in the program

{{< figure src="/java-backend-interview-prep/java_access_modifiers.png" title="" >}}

`protected` and `private` in the context of classes only apply to inner (nested) classes, because there is no point in other `protected` classes - `default` visibility does the same thing, and the `private` outer class could not be accessed from any other class."""
source_hash = "a0bbd610880ee2a8a834aedfe019cb03ad1fd613c46f71386883bfc1a7aa9c7b"

[[questions]]
id = 25
question = "What does static mean?"
answer = """
- `static` variable - a variable that belongs to a class, not an object
- `static` class is a nested class that can only access static fields of the wrapper class
- `static` method is a method that belongs to a class, not an object. Static methods only access other static methods and variables

---
***Can a static method be overridden?***

You cannot override static methods.
If we declare the same method in a descendant class, then we will only “hide” the superclass method instead of overriding it. This is called method hiding.

> *Note* You can overload, but you cannot override. In the case of static methods, this is not overriding, but hiding.

---
***Can non-static methods overload static ones?***

Yes. The end result is two different methods. 
A static one will belong to a class and will be accessible through its name, while a non-static one will belong to a specific object and will be accessible through a method call on that object.

---
***Can classes be static?***

Yes, nested classes

"""
source_hash = "6cd217d098533c469ac02a84090b48ed4eb9145788974c8b6fb242967a5038de"

