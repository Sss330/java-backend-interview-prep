[[questions]]
id = 45
question = "What is an annotation? Why is it needed? How to create your own annotation?"
answer = """
An annotation is a mechanism for marking classes, methods and fields with additional information for the compiler, development tools and frameworks

**Basic Annotations in Java**  

|Annotation|Description|
|---|---|
|`@Override`|Checks that a method overrides a superclass method.|
|`@Deprecated`|Marks a method/class as obsolete so that it will not be used in the future.|
|`@SuppressWarnings`|Suppresses certain compiler warnings.|
|`@FunctionalInterface`|Indicates that the interface is functional (with one abstract method).|
|`@SafeVarargs`|Suppresses warnings about unsafe operations with variable-length arguments (varargs).|
|`@Native`|Used for constants intended to interact with native code.|

**Annotation metadata (`Retention`, `Target`)**  
When we create our annotation, it is important to understand how it will be used. This is specified using **meta annotations**:

|Annotation|Description|
|---|---|
|`@Retention`|Determines at what lifecycle stage the annotation is available (SOURCE, CLASS, RUNTIME).|
|`@Target`|Indicates what the annotation can be applied to (methods, fields, classes, etc.).|
|`@Documented`|Includes annotation in Javadoc.|
|`@Inherited`|Whether the annotation is inherited by subclasses.|
|`@Repeatable`|Allows you to apply the same annotation multiple times.|

**How to create your own annotation?**
```java
import java.lang.annotation.*;

@Retention(RetentionPolicy.RUNTIME)
@Target(ElementType.METHOD)
@interface MyAnnotation {
    String value();
    int count() default 1;
}

class Example {
    @MyAnnotation(value = "Hello", count = 3)
    public void test() {
        System.out.println("Method with annotation");
    }
}
```

**Reading annotation using reflection**
```java
import java.lang.reflect.Method;

public class Main {
    public static void main(String[] args) throws Exception {
        Method method = Example.class.getMethod("test");
        MyAnnotation annotation = method.getAnnotation(MyAnnotation.class);
        System.out.println("value: " + annotation.value());  // "Hello"
        System.out.println("count: " + annotation.count());  // 3
    }
}
```

**Where are annotations used in real projects?**
Lombok, JUnit, Spring
"""
source_hash = "422ce2d9738c790fda3ec9e3fdf21806629ae93a15258e679f101e62b3a5dda6"

[[questions]]
id = 46
question = "Method overriding and overloading"
answer = """
**Method overriding** is the replacement of the implementation of a method of a parent class in a descendant class. Rules
- the method must have exactly the same name, return type, and arguments;
- a method in a parent class should not be private;
- must occur in the inherited class;
- annotation `@Override` is recommended (not required, but helps to avoid errors).

**Method overloading** is the creation of several methods in a class with the same name but different signatures. Rules:
- the method names are the same;
- the difference is in the number, types, or order of arguments (any combination of these methods);
- the return type can be anything, but is not used to differentiate overloading."""
source_hash = "80b398e4345c790d90221f1ecfd764bf4c6daae25b5d07d34f7a76273002ca98"

[[questions]]
id = 47
question = "How does ClassLoader work in Java?"
answer = """
ClassLoader is a special JVM component designed to load classes into memory during program execution. Loads classes, respecting the hierarchy and the principle of delegation.

Bootloader hierarchy:
1. Bootstrap - loads base classes (`java.lang.*`, `java.util.*`)
2. Platform (Extension to Java 9) - loads platform modules
3. Application/System - loads classes from classpath
4. Custom - implementation dependent

The principle of delegation - before loading a class, the loader contacts its superior in the hierarchy and asks if it has already loaded such a class, so as not to load the class twice."""
source_hash = "ac75d85240ce9f4846ec1caa2f64bcf49545687647c13ec97bdf0a69de73cb71"

[[questions]]
