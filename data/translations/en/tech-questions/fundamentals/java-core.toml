question = "What is an anonymous class?"
answer = """
An anonymous class is a class without a name, the implementation of which is described in-place at the time of creation
```java
Runnable r = new Runnable() {
    @Override
    public void run() {
        System.out.println("Hello!");
    }
};
```

**Requirements for variables referenced inside an anonymous class**
Variables used inside an anonymous class must be **effectively final** (not changed after initialization)
