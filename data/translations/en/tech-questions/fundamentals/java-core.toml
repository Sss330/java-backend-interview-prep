question = "How do equals() and == differ?"
answer = """
The `==` operator compares references to objects.
The `equals()` method compares objects by content if overridden correctly, because by default (inherited from `Object`) the method implementation is reduced to
```java
public boolean equals(Object obj) {  
\treturn (this == obj);  
}
```"""
