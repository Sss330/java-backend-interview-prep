[[questions]]
id = 30
question = "What are interfaces?"
answer = """
An interface is a special abstract type that describes the behavior (contract) that classes must implement
- Interface methods - public abstract
- Fields - public static final

---
***What default/default modifiers do fields and interface methods have?***

Default methods are methods in the interface that have a body and are marked `default`. Classes that implement such an interface may not override the method and use the code from the interface.

Starting with Java 8, interfaces are allowed to host implementations of default methods `default` and static methods `static`.

By default, all methods in the interface actually have the `public` modifier. However, starting with Java 9, we can also define methods with the `private` modifier in an interface. They can be static or non-static, but must have an implementation (i.e., a method body).

The interface can also contain fields. In this case they are automatically public `public`, static `static` and immutable `final`.

---
***Can one interface be inherited from another? From the other two?***

Yes

---
***Why do we need interface markers?***

Marker interfaces are interfaces without methods used to provide meta information about a class.

**Examples:**

`Serializable` - indicates that the object can be serialized.  
`Cloneable` - allows the creation of copies of an object via clone().  

**Pros:**  
✅ Easy to implement.  
✅ Used in the standard Java library (Serializable, Cloneable).  
✅ Allows you to use instanceof for type checking.  

**Cons:**  
❌ Implicit logic - it's hard to understand what the interface is doing.  
❌ Difficult to maintain if new functionality needs to be added.  
❌ You cannot control the correct use (for example, Cloneable does not guarantee the correct implementation of clone()).

---
***Pros and cons of default methods***

**`default` methods** allow you to add method implementations to interfaces without having to change existing class implementations.

**Example:**

```java
interface Animal {
    default void makeSound() {
        System.out.println("Some sound...");
    }
}
class Dog implements Animal {}
public class Main {
    public static void main(String[] args) {
        Dog dog = new Dog();
        dog.makeSound(); // Will display "Some sound..."
    }
}
```

**Pros:**  
✅ Allows you to add new methods to interfaces without breaking existing code.  
✅ Reduce code duplication in classes that implement the interface.  
✅ You can provide a basic implementation of the method.

**Cons:**  
❌ Can complicate the class hierarchy if used too actively.  
❌ `default` method conflicts if several interfaces contain a method with the same signature.    
❌ Violates the Single Responsibility Principle (SRP) because the interface begins to contain logic.

---
***Pros and cons of multiple implementation***

Multiple implementation means that a class can implement multiple interfaces.

**Example:**

```java
interface A {
    default void show() {
        System.out.println("A");
    }
}
interface B {
    default void show() {
        System.out.println("B");
    }
}
class C implements A, B {
    @Override
    public void show() {  // Resolving the conflict
        A.super.show();
    }
}
```

**Pros:**  
✅ Avoids problems associated with multiple inheritance (diamond problem).  
✅ Code reuse via `default` methods.  
✅ Flexibility - you can combine the behavior of different interfaces.

**Cons:**  
❌ `default` method conflicts if several interfaces contain a method with the same signature.  
❌ It may be difficult to debug and support the code.  
❌ You cannot use `super` to call the interface constructor.

"""
source_hash = "3726a1d901acc374489a70c062bfe640174ab1b7e508c652c2e50abfeac2ca46"

[[questions]]
id = 31
question = "How do interfaces and abstract classes differ?"
answer = """
- Abstract classes are used when there is an “is a” relationship, and the interface can be implemented by classes that are not at all related to each other
- You can inherit only one class, but implement as many interfaces as you like

| **Criterion**                          | **Abstract class**                                           | **Interface**                                                                                   |
| ------------------------------------- | --------------------------------------------------------------- | ----------------------------------------------------------------------------------------------- |
| **When to use**                | If there is common logic that subclasses can override | To define contracts that implement classes                                            |
| **Default access modifiers** | `protected`, `default`                                          | All methods `public`                                                                             |
| **Availability of constructor**              | Yes                                                              | No                                                                                             |
| **Inheritance/Implementation**           | A class can inherit only one abstract class           | A class can implement multiple interfaces                                                   |
| **Methods with implementation**              | May contain methods with implementation                            | May contain `default` and `static` (with Java 8), and with Java 9<br>and `private` methods with implementation |
"""
