[[questions]]
id = 1
question = "Describe the equals() and hashCode() contracts."
answer = """
***Contract:***

- If `hashCode()` of two objects returns different values, then they cannot be equal
- If `equals()` of objects is true, then the hash codes must be equal
- After overriding `equals()`, always override `hashCode()`
- If objects have the same `hashCode()`, then they are not necessarily `equals()` 
- Each call to `hashCode()` for the same object must return the same hash code

***equals() properties:***
 The `equals()` method implements an equality (equivalence) relation, which has the following properties:
  - **Reflexivity**. The object must be equal to itself (`x.equals(x) == true`)
  - **Symmetrical**. Any two objects must have the same opinion regarding their equality or inequality (`x.equals(y) == true` and `y.equals(x) == true`)
  - **Transitivity**. If one object is equal to the second, and the second is equal to the third, then the first object must also be equal to the third (`x.equals(y) == true` and `y.equals(z) == true` and `x.equals(z) == true`)
  - **Consistency**. If two objects are equal, they must always be equal until one of them (or both of them) is changed
  - For any non-null reference to the value `x`, the expression `x.equals(null)` must return `false`.

  ***hashCode() properties:***
  - **Consistency**. Each call to `hashCode()` for the same object within the same program must return the same value if the object fields involved in hash code calculation have not changed
  - **Equality and hash code.** If two objects are equal according to the `equals()` method, their hash codes must also be equal. However, the opposite is not necessary - objects with the same hash code may not be equal
  - **Distribution**. Implementation `hashCode()`, which returns a different hash code for unequal objects, allows you to increase the efficiency of working with hash data structures (such as HashMap or HashSet) by distributing objects across different hash table buckets

"""
source_hash = "684f174f1eec3237d6702dedef266c65f747d5e9f13a40984666b18d0908f5d1"

[[questions]]
id = 2
question = "What is a collision?"
answer = """
A collision occurs when different objects have the same hash codes

---
 ***What happens if you override equals() without overriding hashCode()?***
- An object that is `equals()` equal to an existing key in the HashMap may not be found if their hashes are different. This is due to the fact that HashMap first uses `hashCode()` to find the bucket, and only then compares objects by `equals()`.
- If you try to delete a key that is equal to another key by `equals()`, but has a different `hashCode()`, the deletion may not work.

"""
