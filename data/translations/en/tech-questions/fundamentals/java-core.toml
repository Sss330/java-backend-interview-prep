[[questions]]
id = 33
question = "What are initialization blocks, and why are they used?"
answer = """
There are static and non-static initialization blocks.  
**Static initialization block** is used to initialize the static data of a class. It is executed only once when the class is loaded into memory.  
**Non-static initialization block**, also known as an instance initialization block, is used to initialize instance variables of a class. It is executed every time a new instance of the class is created.

"""
