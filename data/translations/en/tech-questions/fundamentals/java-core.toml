[[questions]]
id = 27
question = "What can an overriding method change, including modifiers and declared exceptions?"
answer = """
According to the Java specification, a signature consists of a method name, a list of parameters and their types (the order of the types is important). This does not include the return value, access modifier, or enumeration of exceptions thrown.

Therefore, nothing can be changed in the signature itself when redefining methods.
You can:
- expand access level
- narrow the return type
- do not throw exceptions that were declared in the parent class
- add new exceptions that are inheritors of the parent, or those that inherit from RuntimeException"""
