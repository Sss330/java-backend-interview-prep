[[questions]]
id = 18
question = "What is the string pool?"
answer = """
A string pool is a special area of the heap where string objects are stored. Serves primarily to optimize work with string literals. When you declare a literal (string in double quotes) the pool searches for this string:
- If there is no such string in the pool ⇒ a string is created and a reference is returned
- If yes ⇒ the reference of the found string is returned  

Strings created using `new String()` are not placed in the string pool and are stored on the heap like other objects.

---
***What does the intern() method do in the String class?***
- Places a string into the string pool

"""
