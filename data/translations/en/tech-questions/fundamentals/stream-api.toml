[[questions]]
id = 9
question = "What does Collectors provide, and which methods do you know?"
answer = """
The Collectors class provides a number of static methods for creating collections, such as lists, sets, maps, and others, from elements of a Stream. These methods are widely used for data aggregation in streams. Basic methods:
- `toList()` - collects stream elements into a list
- `toSet()` - collects stream elements into a set (Set)
- `toMap()` - collects stream elements into a Map using keys and values that are specified by functions
- `joining()` - concatenates stream elements into one line using the specified delimiter and prefix/suffix
- `counting()` - counts the number of elements in the stream
- `summarizingInt()` - collects statistics on numeric values (for example, sum, average, maximum and minimum value)
- `averagingInt()` - calculates the average of numeric elements
- `partitioningBy()` - divides the stream elements into two groups according to a given predicate
- `groupingBy()` - groups stream elements according to a given classifier
- `reducing()` - performs reduction of stream elements using a specified binary operator
- `toCollection(Supplier<C>)` - converts a stream into a collection

**Which Collector will you use to group elements in a Map?**
- `toMap()` - collects stream elements into a Map using keys and values that are specified by functions, e.g.
```java
List<String> strings = Arrays.asList("cat", "dog", "fish", "ant", "elephant");
Map<String, Integer> mappedByLength = strings.stream()
                                .collect(Collectors.toMap(s -> s, String::length));
                                
// mappedByLength = {ant=3, cat=3, fish=4, dog=3, elephant=8}
```

- `groupingBy()` - groups stream elements according to a given classifier, for example
  ```java
  List<String> strings = Arrays.asList("cat", "dog", "fish", "ant", "elephant");
  Map<Integer, List<String>> groupedByLength = strings.stream()
        .collect(Collectors.groupingBy(String::length));
       
// groupedByLength = {3=[cat, dog, ant], 4=[fish], 8=[elephant]}
  ```
"""
source_hash = "ed5b125fa12ec5db8c76112888e2289884c1c5617e48504c9de301e00721c296"

