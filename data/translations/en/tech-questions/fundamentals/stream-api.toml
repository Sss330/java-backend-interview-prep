[[questions]]
id = 4
question = "What types of Stream API operations exist?"
answer = """
Intermediate and terminal
- An intermediate method is a method that does NOT start execution and returns an object of type Stream
- A terminal method is a method that starts execution of a chain and returns an object of a type other than Stream. There can only be one and it must be the last in the chain. After calling it, you can no longer work with the chain

**Can Stream be reused after a terminal method?**
No. After the terminal method is executed, the stream is closed, and any subsequent attempt to call methods will cause `IllegalStateException`

**Using Stream without a terminal method?**
Without a terminal operation, intermediate operations do not process the elements. This is **lazy evaluation**: execution is deferred until a terminal operation consumes the stream.
"""
source_hash = "d94a59db59e25e4ffa56cd6c944e98abe9964848d6ad699768598a1417efd913"

[[questions]]
id = 5
question = "What are intermediate stream operations? Give examples."
answer = """
*Intermediate method* - a method that returns a Stream. There are:

**Method peek()**
The `peek(Consumer<T> action)` method is used for intermediate processing of stream elements. It allows you to perform an action on each element of the stream without changing the elements themselves. The main use is for debugging or logging data before performing the final operation.
_Important:_ the `peek()` method does not change the stream and is most often used for side effects (for example, displaying information about each element).
```java
List<Integer> numbers = Arrays.asList(1, 2, 3, 4, 5);
List<Integer> result = numbers.stream()
    .peek(n -> System.out.println("Processing: " + n))
    ...
    .collect(Collectors.toList());
```

**map() method**
The `map(Function<T, R> mapper)` method is used to transform each element of the stream using a function. It takes an input element and returns a new element that matches the result of the applied function
```java
List<Integer> numbers = Arrays.asList(1, 2, 3);
List<Integer> squares = numbers.stream()
    .map(n -> n * n)
    .collect(Collectors.toList());
System.out.println(squares); // [1, 4, 9]
```

**flatMap() method**
The `flatMap(Function<T, Stream<R>> mapper)` method is used to transform each element of a stream into another stream, and then “flatten” the resulting streams into one flat stream. This is especially useful for working with collections within collections
```java
List<List<Integer>> numbers = Arrays.asList(
    Arrays.asList(1, 2),
    Arrays.asList(3, 4),
    Arrays.asList(5)
);
List<Integer> flatNumbers = numbers.stream()
    .flatMap(List::stream)
    .collect(Collectors.toList());
System.out.println(flatNumbers); // [1, 2, 3, 4, 5]
```

**filter() method**
The `filter(Predicate<T> predicate)` method is used to filter stream elements based on a condition (predicate). It skips elements that do not satisfy the condition
```java
List<Integer> numbers = Arrays.asList(1, 2, 3, 4, 5);
List<Integer> evenNumbers = numbers.stream()
    .filter(n -> n % 2 == 0)
    .collect(Collectors.toList());
System.out.println(evenNumbers); // [2, 4]
```

**limit() method**
The `limit(long maxSize)` method returns a stream consisting of no more than the specified number of elements. This is useful for limiting the size of the stream
```java
List<Integer> numbers = Arrays.asList(1, 2, 3, 4, 5);
List<Integer> limited = numbers.stream()
    .limit(3)
    .collect(Collectors.toList());
System.out.println(limited); // [1, 2, 3]
```

**Skip() method**
The `skip(long n)` method skips the specified number of elements and returns a stream of the remaining elements
```java
List<Integer> numbers = Arrays.asList(1, 2, 3, 4, 5);
List<Integer> skipped = numbers.stream()
    .skip(2)
    .collect(Collectors.toList());
System.out.println(skipped); // [3, 4, 5]
```

**Concat() method**
Method `concat(Stream<T> a, Stream<T> b)` combines two streams into one
```java
List<String> listOne = List.of("Apple", "Banana", "Cherry");
List<String> listTwo = List.of("Orange", "Peach", "Plum");
Stream<String> combinedStream = Stream.concat(listOne.stream(), listTwo.stream());
        combinedStream.forEach(System.out::println);
```

**sorted() method**
Method `sorted()` | `sorted(Comparator<T> comparator)` sorts stream items. By default, elements are sorted in their natural order, but you can specify a comparator for custom sorting
```java
List<String> names = Arrays.asList("John", "Anna", "Tom");
List<String> sortedNames = names.stream()
    .sorted()
    .collect(Collectors.toList());
System.out.println(sortedNames); // [Anna, John, Tom]
```

**The distinct() method**
The `distinct()` method returns a stream that contains only unique elements (no duplicates)
```java
List<Integer> numbers = Arrays.asList(1, 2, 2, 3);
List<Integer> uniqueNumbers = numbers.stream()
    .distinct()
    .collect(Collectors.toList());
System.out.println(uniqueNumbers); // [1, 2, 3]
```

If the stream is sorted and has the appropriate characteristic (it is added by `sorted()`, for example, the stream itself cannot find out about the sorting of the data), then when calling `distinct()` a more efficient algorithm is used: it will no longer collect the HashSet and look for the presence of duplicate objects, but simply compare each next one with the previous one. Those. `sorted().distinct()` can theoretically speed up method execution if the input data is already sorted. _Note_: `sorted()` for sorted data works very quickly, this is a cheap operation
"""
source_hash = "28f58254a74c8cce5e645cfc8ea18bb75cfffab6f6a99fc4be4f5ba0bc4b4423"

[[questions]]
id = 6
question = "What are terminal stream operations? Give examples."
answer = """
*Terminal methods* terminate work with the stream; after they are called, further operations are impossible. Basic terminal methods:

**collect() method**
The `collect(Collector<T, A, R> collector)` method is used to convert a stream to a collection or other data type. Most commonly used to collect elements into a list, set, or string
```java
List<Integer> numbers = Arrays.asList(1, 2, 3, 4, 5);
List<Integer> collectedList = numbers.stream()
    .collect(Collectors.toList());
System.out.println(collectedList); // [1, 2, 3, 4, 5]
```

**forEach() method**
Method `forEach(Consumer<T> action)` performs an action on each element of the stream
```java
List<String> words = List.of("hi", "hi", "goodbye", "ok", "dog", "cat", "dog");
words.stream()
\t\t\t\t.forEach(System.out::println);
```

**reduce() method**
The `reduce(BinaryOperator<T> accumulator)` method reduces (aggregates) stream elements to a single value using the accumulator function. For example, to calculate the sum or product of all elements
```java
List<Integer> numbers = Arrays.asList(1, 2, 3, 4, 5);
int sum = numbers.stream()
    .reduce(0, Integer::sum); // 0 — initial value
System.out.println(sum); // 15
```

**count() method**
Method `count()` Returns the number of elements in the stream
```java
List<Integer> numbers = List.of(1, 2, 3, 4, 10, 1298, 27);
long counted = numbers.stream()
        .filter(n -> n % 2 == 0)
        .count(); // Counted even numbers
```

**min() method**
The `min(Comparator<T> comparator)` method returns the minimum element of a stream according to a given comparator (Optional)
```java
List<Integer> numbers = List.of(1, 2, 3, 4, 10, 1298, 27);
Optional<Integer> min = numbers.stream()
\t\t\t\t.min(Integer::compareTo);
```

**max() method**
Method `max(Comparator<T> comparator)` Returns the maximum element of a stream according to a given comparator (Optional)

```java
List<Integer> numbers = List.of(1, 2, 3, 4, 10, 1298, 27);
Optional<Integer> max = numbers.stream()
        .max(Integer::compareTo);
```

**findFirst() method**
Method `findFirst()` returns the first element of the stream (Optional)
```java
List<Integer> numbers = List.of(1,2,3,4,5,6,10,120,130);
Optional<Integer> first = numbers.stream()
        .filter(n -> n > 10)
        .findFirst();
```

**findAny() method**
Method `findAny()` returns any element of the stream (Optional), useful in parallel streams
```java
List<String> names = List.of("hello java", "goodBye");
Optional<String> name = names.stream()
        .filter(s -> s.contains("java"))
        .findAny();
```

**anyMatch() method**
The `anyMatch(Predicate<T> predicate)` method returns true if at least one element matches the condition
```java
List<Integer> nums = List.of(1,2,3,4,5,6);
boolean is = nums.stream()
        .anyMatch(n -> n % 2 == 0); //Will return true
```

**allMatch() method**
The `allMatch(Predicate<T> predicate)` method returns true if all elements match the condition
```java
List<Integer> nums = List.of(-1,2,3,4,5,6);
boolean is = nums.stream()
        .allMatch(n -> n > 0); //Will return false
```

**noneMatch() method**
Method `noneMatch(Predicate<T> predicate)` returns true if no element matches the condition
```java
List<Integer> nums = List.of(1,3,3,5,5,7);
boolean is = nums.stream()
        .noneMatch(n -> n % 2 == 0); //Will return true 
```
"""
