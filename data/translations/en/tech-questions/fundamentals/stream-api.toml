[[questions]]
id = 1
question = "What is the Stream API, and what are streams used for?"
answer = """
A stream represents a sequence of elements that can be processed through a pipeline of operations.
The Stream API is a way to concisely process data streams (filtering, sorting, type conversion) in a declarative style, introduced in Java 8.

**What types of data can it work with?**
- **Objects** - `Stream<T>`, where `T` is any reference type (for example, `String`, `Integer`, custom classes)
- **Primitives** - there are specialized streams:
    - **IntStream** for working with `int`
    - **LongStream** for working with `long`
    - **DoubleStream** for working with `double`
    For other primitives, streams are not provided; they need to be packaged in wrapper objects (for example, `Byte` for `byte`)

**Problem with primitives in streams?**
Working with primitives through `Stream<T>` leads to **autoboxing and unboxing**. This leads to the following problems:
1. **Performance overhead** - Boxing and unboxing add overhead.
2. **Memory increase** - objects are created instead of primitives (for example, `Integer`, `Double`)
Specialized streams (**IntStream, LongStream, DoubleStream**) operate directly on primitive values without autoboxing.
"""
source_hash = "94ce9e75335351f7bdd29d41558258e5aef90bab2602212633de5c9e6547facc"

