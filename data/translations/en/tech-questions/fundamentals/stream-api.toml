question = "What are IntStream and DoubleStream?"
answer = """
IntStream, LongStream, and DoubleStream specialize streams for the primitive types int, long, and double, avoiding boxing for their elements.

Additional terminal operations include `sum()` and `average()`. The intermediate operation `mapToObj()` converts a primitive stream into a stream of objects.
"""
