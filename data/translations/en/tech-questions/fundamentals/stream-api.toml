[[questions]]
id = 11
question = "How do parallel() and parallelStream() differ?"
answer = """
Both methods give the same result, but the difference is in the way they are called:
- `list.stream().parallel()` is useful if you first need to configure the stream (for example, add filtering), and then switch it to parallel mode
- `list.parallelStream()` is used if you immediately need a parallel stream

| Method                 | Description                                          |
| --------------------- | ------------------------------------------------- |
| `stream().parallel()` | Converts an existing stream into a parallel one |
| `parallelStream()`    | Immediately creates a parallel stream from the collection     |"""
source_hash = "fed0ddadf989aa00c7235d260a4718ea18e9844f6b577f3049255637dc040720"

[[questions]]
id = 12
question = "What are Consumer, Function, and Supplier used for?"
answer = """
Java 8 introduced **functional interfaces** from the `java.util.function` package, which are used in **lambda expressions** and **Stream API**. Important among them are:

|Functional interface|Input data|Return value|Application|
|---|---|---|---|
|`Consumer<T>`|Accepts `T`|Returns nothing (`void`)|Used when you want to perform an action but not return a result.|
|`Function<T, R>`|Accepts `T`|Returns `R`|Converts one data type to another.|
|`Supplier<T>`|Does not accept arguments|Returns `T`|Used to generate values.|

**`Consumer<T>` - consumer**  

`Consumer<T>` is used when you want to perform an operation on an object, but **not return anything**.

**Example: Printing a list of items**

```java
import java.util.Arrays;
import java.util.List;
import java.util.function.Consumer;

public class ConsumerExample {
    public static void main(String[] args) {
        List<String> names = Arrays.asList("Alice", "Bob", "Charlie");

        Consumer<String> printName = name -> System.out.println("Hello, " + name);
        names.forEach(printName);
    }
}
```

**Conclusion:**

```
Hello, Alice
Hello, Bob
Hello, Charlie
```

💡 **Where is it used?**

- In `forEach()` collections
- Logging (`Logger::info`)
- Working with files (`Files.lines().forEach(...)`)

**`Function<T, R>` - converter**

`Function<T, R>` accepts an object of type `T` and returns an object of type `R`.

**Example: converting a string to its length**

```java
import java.util.function.Function;

public class FunctionExample {
    public static void main(String[] args) {
        Function<String, Integer> lengthFunction = str -> str.length();

        System.out.println(lengthFunction.apply("Java")); // 4
        System.out.println(lengthFunction.apply("Functional Interfaces")); // 21
    }
}
```

💡 **Where is it used?**

- Converting data to `Stream API`
- Object mapping (`List<String>` → `List<Integer>`)
- Filtering and sorting

**`Supplier<T>` - supplier**  

`Supplier<T>` does not accept anything, but **generates a result**.

**Example: random number generation**

```java
import java.util.function.Supplier;
import java.util.Random;

public class SupplierExample {
    public static void main(String[] args) {
        Supplier<Integer> randomSupplier = () -> new Random().nextInt(100);

        System.out.println(randomSupplier.get()); // For example, 42
        System.out.println(randomSupplier.get()); // For example, 87
    }
}
```

💡 **Where is it used?**

- Lazy initialization
- Random Data Generation
- Factory Methods

"""
source_hash = "b91488383da472568e49f39f5afaf8c1c5bb1f4b2a56962146235f4a2c3aece6"

[[questions]]
id = 13
question = "What are parallel streams?"
answer = """
Parallel streams allow you to divide data processing into several threads using `ForkJoinPool`. This can speed up suitable CPU-intensive workloads, but parallel execution also adds overhead. Threads are taken from the pool `ForkJoinPool.commonPool`

**When to use parallel streams?**
- there is a lot of data (millions of records)
- CPU-intensive operations (such as complex calculations)
- no dependencies between elements (for example, summing numbers)

**When NOT to use?**  
- the collection is small (concurrency will create overhead).  
- encounter order matters: use order-preserving operations where required; forEach does not guarantee encounter order.  
- there are side effects (`forEach()` in `parallelStream` may work unpredictably).
"""
source_hash = "6cfcaaa74ac79a7a2d68d0a6884d8dbb3579043fa120d5285147537428178be6"

[[questions]]
id = 14
question = "How do findAny() and findFirst() differ?"
answer = """
| Criterion               | `findAny()`                                         | `findFirst()`                                                  |
| ---------------------- | --------------------------------------------------- | -------------------------------------------------------------- |
| **What returns**     | Any stream element (if any)                    | First stream element (if any)                              |
| **Order**            | Doesn't guarantee order                              | Guarantees that it will return exactly the first element in the stream order |
| **Parallel stream** | Can work faster (no need to follow order) | Can work slower (must maintain order)            |
| **When to use** | If it doesn’t matter which element to get                | If you need to get exactly the first element in order            |
| **Example**             | `stream.parallel().findAny()`                       | `stream.parallel().findFirst()`                                |
"""
source_hash = "555dc1d19cecaf232c462af131a160dc6b40efb6087d7e2655883938431e24bc"
