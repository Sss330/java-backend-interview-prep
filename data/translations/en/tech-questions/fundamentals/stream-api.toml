question = "What is the difference between the map() and flatMap() methods?"
answer = """
- `map()` applies the function to each element of the stream and returns a new stream with the results
- `flatMap()` applies the function to nested structures (when a stream element is a collection or another stream) and combines all received streams into one (flattens)"""
