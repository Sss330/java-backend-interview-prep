[[questions]]
id = 14
question = "How do atomic classes and volatile differ, and when should each be used?"
answer = """
`Atomic` classes (AtomicInteger, AtomicLong, etc.) provide the ability to perform non-atomic operations on primitives (increment, decrement, compare and replace) atomically. They use Compare-And-Swap (CAS) mechanisms to provide safe operation on variables in a multi-threaded environment without explicit synchronization. Can increase performance due to the lack of explicit synchronization and CAS implementation at the processor architecture level

`volatile` is a keyword that ensures that the value of a variable is always read from main memory and not from the thread cache. Each thread will see the actual value of the `volatile` variable, but if two threads change the variable at the same time, problems may arise

**When to use what?**
- `volatile` - when it is sufficient to guarantee only the visibility of changes (for example, for completion or status flags)
- `Atomic` - when atomicity is required (incrementing, comparing and setting values)

**Comparison** `volatile` **and** `Atomic`

|**Characteristics**|`volatile`|`Atomic`|
|---|---|---|
|Visibility Guarantee|Yes|Yes|
|Atomic operations|No|Yes|
|Usage|For simple read/write|For complex operations (increment, CAS)|
|Example of suitable cases|Flags (`boolean isRunning`)|Counters (`AtomicInteger.incrementAndGet`)|
|Productivity|Higher because operations are simpler|Slightly lower due to synchronization mechanisms|
"""
source_hash = "351819a50918bdbb16b6325f170fe35d1ca4cca195849d4a681543d1ef58f4a3"

