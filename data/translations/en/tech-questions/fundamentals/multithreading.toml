[[questions]]
id = 28
question = "Which memory areas are shared between threads?"
answer = """
In Java, memory is divided into several areas that are managed by the JVM and can affect multi-threaded programming. The main ones:
1. **Heap** - shared memory for all threads, objects are stored here
2. **Stack (thread stack)** - a separate area for each thread, where local variables and method calls are stored, as well as references to objects
3. **Metaspace** - area for storing information about classes
4. **Thread Working Memory** - cache of each thread, which may differ from the data in main memory

**Example problem:**  
If one thread modifies an object in `Heap` and another reads old data from `Thread Working Memory`, a data race may occur.

**How to avoid?**
- use `volatile` to make changes in one thread visible to others
- use `synchronized` and `Lock` for atomic operations
"""
