question = "What is a monitor? How is it implemented in Java?"
answer = """
Monitor is a synchronization mechanism in Java. Every object that inherits from Object implicitly has a monitor. When a thread acquires a monitor (via the `synchronized` block), then other threads cannot interact with this object until the monitor is released by the capturing thread
"""
