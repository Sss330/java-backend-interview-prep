[[questions]]
id = 24
question = "What are compare-and-swap (CAS) operations?"
answer = """
**CAS (Compare And Swap)** is an atomic operation that is used to control multi-threaded access to data without using locks
1. **Working principle:**
    - Checks if the current value matches the expected value
    - If yes, then the value is updated
    - If not, the operation is repeated
2. **Stages:**
    - Comparing the current value with the expected value
    - Update value if they match
3. **Features:**
    - Provides high performance as it does not require locking
    - Used in `Atomic` classes and thread-safe collections (`ConcurrentHashMap`)

Example of CAS operation
```java
AtomicInteger atomicInteger = new AtomicInteger(0);
int expectedValue = 0;
int newValue = 1;

// CAS-operation
boolean result = atomicInteger.compareAndSet(expectedValue, newValue);
System.out.println(result); // true, if the value is updated
```
"""
source_hash = "17b538868eb1c862419c4008a5fc4de747de7d653fc73f16c84a3e52c54b47ed"

