[[questions]]
id = 30
question = "What is the happens-before relationship?"
answer = """
The concept of "happens before" describes the relationships between various operations in a multi-threaded program. In Java, it is defined in the Java Memory Model (JMM) specification. Basic rules
1. **Program order**. In one thread, all operations are performed in the order in which they are written in the code. This means that if the same thread executes operation A first and then operation B, then operation A will always complete before operation B begins.
2. **Monitor lock**. Unlocking a monitor in one thread occurs before the same monitor is subsequently locked in another thread. This rule ensures that critical sections of code protected by synchronization are executed sequentially and do not overlap.
3. **Interaction through volatile variables**. Writing to a volatile variable occurs before the subsequent reading of this variable by another thread. This makes changes made by one thread visible to other threads.
4. **Creating and terminating threads**. Thread creation occurs before it begins executing, and thread termination occurs before another thread detects its termination. This rule helps manage the lifecycle of threads and their interactions.
5. **Data transfer via `join()`**. Calling the `Thread.join()` method on one thread occurs before that thread terminates. This allows one thread to wait for another thread to complete before continuing execution.

These rules help developers understand how operations on different threads interact with each other and how to avoid problems with visibility and data synchronization. Correct application of these rules allows you to create reliable and efficient multi-threaded applications.
"""
source_hash = "92991072660fa0356d6ca62585bfe83f5aed7dd7aa36f8356e6eb39d39fb5c89"

[[questions]]
id = 31
question = "ForkJoinPool vs FixedThreadPool"
