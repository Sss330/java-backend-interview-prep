[[questions]]
id = 21
question = "What does the java.util.concurrent package provide?"
answer = """
The `java.util.concurrent` package provides a set of tools for working with multithreading. Main components:
1. **Executor and ExecutorService** - used to manage threads and execute tasks. ExecutorService allows you to manage a thread pool
2. **Synchronized collections** are thread-safe collections such as:
    - `ConcurrentHashMap`
    - `CopyOnWriteArrayList`
    - `BlockingQueue`
3. **Locks** - a more flexible alternative to synchronized blocks:
    - `ReentrantLock` - provides explicit lock management + reentrant
    - `ReadWriteLock` - separates read and write locks
4. **Synchronizers** - objects for coordinating threads:
    - `Semaphore` - limit the number of simultaneously running threads
    - `CountDownLatch` - literally “countdown latch” - stopping threads until the internal counter reaches zero
    - `CyclicBarrier` - synchronization of several threads (inverse to a semaphore, stops execution until a certain number of threads arrive at a point)
    - `Exchanger` - data exchange between **two** threads
5. **Future and CompletableFuture**
    - `Future` - used to obtain the result of an asynchronous task
    - `CompletableFuture` is a convenient way to build asynchronous chains from results, supports a declarative programming style
"""
source_hash = "6f67269b9c1f7422d6193b1fd82e7104d31ad2aac694334479678c05bd49ae7d"

