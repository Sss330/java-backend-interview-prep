[[questions]]
id = 18
question = "Collections.synchronizedMap vs ConcurrentHashMap"
answer = """

|Characteristics|`Collections.synchronizedMap`|`ConcurrentHashMap`|
|---|---|---|
|Lock|One common monitor for the entire card: each method is wrapped in `synchronized`.|Java 8+: A single cart is blocked (CAS for an empty cart, `synchronized` on its first node). Before Java 8 - blocking by segments.|
|Reading|Executed under general blocking.|Usually without blocking; node fields use `volatile`.|
|Productivity|Slower with competition: only one thread is working with the card at any time.|Higher with contention: Threads running different buckets interfere less with each other.|
|Iteration|The bypass must be synchronized manually (`synchronized (map)`), otherwise `ConcurrentModificationException` is possible.|Iterators `weakly consistent`: do not throw `ConcurrentModificationException`, but may not reflect changes made during traversal.|
|Compound Operations|Requires manual synchronization to ensure atomicity.|Supports atomic methods `putIfAbsent`, `computeIfAbsent`, `compute`, `merge`.|
|`null`|Allowed if the wrapped `Map` supports it.|Disabled for keys and values (`NullPointerException`).|
|`size()`|Returns the exact number of elements at the time of the call.|If parallel changes are made, the result may not be accurate.|
|Application|When you need a thread-safe wrapper over a specific implementation (`LinkedHashMap`, `TreeMap`).|For multi-threaded access with high contention.|"""
