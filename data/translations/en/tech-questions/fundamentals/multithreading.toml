[[questions]]
id = 5
question = "What is synchronization? What synchronization methods are there in Java?"
answer = """
Synchronization (threads) is a mechanism for coordinating the access of multiple threads to prevent Race Conditions and ensure memory consistency. Achieved through locks and scopes

**System Synchronization**
In Java, the `synchronized(obj)` operator binds a block of code to a specific thread, capturing the monitor of the `obj` object and preventing other threads from accessing it at that moment. If this thread must wait for some conditions to be met, then it must call the `wait()` method on `obj` - the thread’s work is suspended (it “falls asleep”), it releases the captured monitor.
Another thread can call the `notify()` method on the same object, having previously captured its monitor, as a result of which the thread waiting on `obj` “wakes up” and continues its execution

**IMPORTANT**:
- the `wait()` and `notify()` methods are not synchronized, so they can only be called inside the `synchronized` block. Otherwise, `IllegalMonitorException: current thread is not owner` will be thrown at runtime
- after calling `notify()`, the sleeping thread “wakes up” no earlier than the thread that called `notify()` exits the synchronized block (i.e. only after it releases the monitor)
```java
public class Counter {
    private int count;
    public synchronized void increment() { 
        count++;
    }
}

equivalent

public class Counter {
    private int count;
    public void increment() { 
\t\t    synchronized (this) {
\t        count++;
        }
    }
}
```

Features of `syncronized` depending on the location of the ad:
- code block - you must explicitly specify the synchronization object in parentheses
- non-static method - synchronization on an instance (`this`)
- static method - synchronization on a class object (`ClassName.class`), i.e. synchronization occurs at the class level and is distributed to all instances

**Method `Thread.join()`**
The thread that called this method will wait until the object on which this method was called finishes its execution.
```java
public static void main(String[] args) {
        SimpleThread simpleThread = new SimpleThread();
        simpleThread.start();
        try {
            simpleThread.join(); //Until this thread completes its work, we will not go further
        } catch (InterruptedException e) {
            throw new RuntimeException(e);
        }
        System.out.println(Thread.currentThread().getName());
    }
```

**Classes from the package `java.util.concurrent`**
`ReentrantLock`, `Semaphore`, `CyclicBarrier`. The concept of this approach is to use atomic operations and variables

[An article on Habré about types of synchronizers java.util.concurrent](https://habr.com/ru/articles/277669/)
"""
source_hash = "9552b33c13285848f745cc966b2accc67c45c9cd04441a596ff7c2a70aca0d23"

[[questions]]
id = 6
question = "What is FutureTask?"
answer = """
`Future` is an interface that reflects the result of asynchronous task execution and provides methods for working with asynchronous results. Used in combination with `ExecutorService` or other asynchronous APIs

`FutureTask` is a base implementation of the `Future` interface. Allows you to perform a task asynchronously and then get its result or handle exceptions. If the task has not yet completed, attempting to retrieve the result will pause (block) execution until the task completes
Implements the `RunnableFuture` interface, which combines the functionality of the `Runnable` and `Future` interfaces
"""
source_hash = "1587bc5c15117c9dfc9dbad056995e0debbf5d6fc5e009d5f9aecadbc4526200"

[[questions]]
id = 7
question = "What is CompletableFuture?"
answer = """
`CompletableFuture` is an extended implementation of the `Future` interface that adds the ability to functional programming and work with multiple asynchronous tasks

**Comparison of `FutureTask`, `Future` and `CompletableFuture`**

|**Feature**|**FutureTask**|**CompletableFuture**|
|---|---|---|
|Asynchronous execution|Yes|Yes|
|Getting the result|`get()`|`get()` / `join()` - block|
|Cancel a task|Yes|Yes|
|Task composition|No|Yes (`thenCombine`, `allOf`, `anyOf`)|
|Functional style|No|Yes|
|Difficulty|Simple|Advanced functionality|

1. `Future` - interface for asynchronous operations, with basic methods (`get`, `cancel`)
2. `FutureTask` - a combination of `Runnable` and `Future`, used to perform asynchronous tasks manually
3. `CompletableFuture` is a modern and powerful tool for asynchronous programming with support for composition and functional style
"""
source_hash = "b1f1aada7af130282b3508372a81755b08e9fd51b58d094b1b18b8dc231f97e8"

