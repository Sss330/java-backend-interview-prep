[[questions]]
id = 16
question = "What does volatile do?"
answer = """
The **`volatile`** keyword ensures that changes to a variable by one thread are **immediately visible to other threads**. This prevents the problem of caching variables in threads.

- **When to use?**  
    Used for variables that:
    - can be changed by multiple threads;
    - are read frequently, but synchronization of complex operations is not required.

**Limitations `volatile`:**  
1. Does not ensure atomicity of operations (for example, `count++` is still unsafe).
2. Used for simple flags or variables where read/write guarantee is sufficient.

"""
