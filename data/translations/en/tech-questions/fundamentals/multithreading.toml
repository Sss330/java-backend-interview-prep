[[questions]]
id = 19
question = "How can threads be created and started in Java?"
answer = """
There are several ways to start a thread in Java:

**Inheritance from the Thread class**
The `Thread` class already implements the `Runnable` interface. We can inherit from it and override the `run()` method
```java
public class MyThread extends Thread {
    @Override
    public void run() {
        System.out.println("Thread is running");
    }

    public static void main(String[] args) {
        MyThread thread = new MyThread();
        thread.start(); // Starting a thread
    }
}
```

**Implementation of interface `Runnable`**
A class is created that implements the interface `Runnable`. Then an object of this class is passed to the constructor `Thread`
```java
public class MyRunnable implements Runnable {
    @Override
    public void run() {
        System.out.println("Runnable is running");
    }

    public static void main(String[] args) {
        Thread thread = new Thread(new MyRunnable());
        thread.start(); // Starting a thread
    }
}
```

**Using an anonymous class or lambda expression**
Often used for brevity if the code in the thread is small
```java
public class Main {
    public static void main(String[] args) {
        Thread thread = new Thread(() -> System.out.println("Lambda thread is running"));
        thread.start(); // Starting a thread
    }
}
```

**Using the Callable interface**
`Callable` returns a result and can throw exceptions. Requires `ExecutorService` to complete
```java
public class CallableExample {
    public static void main(String[] args) throws Exception {
        ExecutorService executor = Executors.newSingleThreadExecutor();
        Callable<String> task = () -> "Callable result";

        Future<String> future = executor.submit(task);
        System.out.println(future.get()); // Getting the result

        executor.shutdown();
    }
}
```
"""
source_hash = "ea46a4f70b2a50666d6213ebb7097b5b2b05faff9f12e4a4a54b58eab78ee503"

