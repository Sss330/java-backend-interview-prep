[[questions]]
id = 1
question = "What is multithreading?"
answer = """
The ability of the program to execute several blocks simultaneously

---
**What is a thread?**
A thread is an independent unit of execution of instructions within a single program. Threads allow you to perform multiple tasks simultaneously, taking advantage of the capabilities of multi-core processors

**Main thread characteristics**:
1. A thread runs within a single process and uses its memory
2. Each thread has its own execution
3. Has access to shared memory

**Why do we need threads?**
Threads are needed to implement multitasking, that is, performing several operations simultaneously. This is especially useful for:
1. increased performance on multi-core processors
2. improving the responsiveness of programs (for example, in the application GUI you can perform long operations in a background thread so that the interface does not freeze)
3. asynchronous processing (for example, reading/writing files, working with the network)
"""
