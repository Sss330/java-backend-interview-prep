[[questions]]
id = 9
question = "How can collections be used safely in concurrent code?"
answer = """
- Turn a regular collection into a synchronized one using Collections.synchronized()
    `List<String> list = Collections.synchronizedList(new ArrayList<>())`
- Using Concurrent Collections
    - `CopyOnWriteArrayList`, `CopyOnWriteArraySet`
    - Non-blocking hash tables (`ConcurrentHashMap`, `ConcurrentSkipListMap`, ConcurrentSkipListSet`)`
    - Non-blocking queues (`ConcurrentLinkedQueue` and `ConcurrentLinkedDeque`)

**Why should we use thread-safe collections?**
When multiple threads access the same collection simultaneously, a **race condition** can occur, leading to the following issues:
1. **data corruption** - simultaneous modification may compromise data integrity
2. **exceptions** - for example, `ConcurrentModificationException`, when one thread iterates through a collection and another changes its structure
3. **unpredictable behavior** - the result of the program becomes unstable

**CopyOnWriteCollections. What is this? How does the recording happen?**
These are thread-safe collections (`CopyOnWriteArrayList`, `CopyOnWriteArraySet`). How the recording works:
- When you add an item, a copy of the entire collection is created with the change added
- After the operation completes, the original collection is replaced with a new copy, and all other threads continue to work with the old version until the new one becomes available
_Note: should be used when there are a lot of read operations in the program_

**ConcurrentHashMap. What is this? How does the recording happen?**
This is a thread-safe hash table implementation. How the recording works:
- key hashing - first the hash code of the key is calculated to determine which bucket of the hash table this element will fall into
- bucket blocking - only the bucket to which the element will be added is blocked (if the bucket is empty, then CAS insertion without blocking is applied)
- adding an element - the element is added, the lock on the bucket is removed

_Note_: _in fact, it is not the bucket that is blocked (since this is generally an abstraction), but its first element_
_Note 2: Before Java 8, ConcurrentHashMap divided the internal table into segments (Segment[]). Each segment was a small hash table with a separate lock (ReentrantLock). When a thread wrote data, only the segment containing the desired key was locked. This allowed multiple threads to work on different segments simultaneously. The legacy segment mechanism complicated the architecture and limited concurrency, so it was eliminated._
"""
source_hash = "4c5b71fdd1ae86fef824167559410f3feb4f7066eadc35c02bda8945fd8c0fd2"

