**The Fork/Join framework**, introduced in JDK 7, is a set of classes and interfaces that take advantage of the multiprocessor architecture of modern computers. It is designed to perform tasks that can be recursively broken down into small subtasks that can be solved in parallel
- **Fork stage** - a large task is divided into several smaller subtasks, which in turn are also divided into smaller ones. And so on until the task becomes trivial and can be solved in a consistent way
- **Stage Join** - then (optionally) there is a process of “convolution” - solutions to subtasks are combined in some way until the solution to the entire problem is obtained

Another advantage of this framework is that it uses a **work-stealing** algorithm: threads that have completed their own subtasks can “steal” subtasks from other threads that are still busy

```java
import java.util.concurrent.*;

class SumTask extends RecursiveTask<Integer> {
    private final int[] array;
    private final int start, end;

    SumTask(int[] array, int start, int end) {
        this.array = array;
        this.start = start;
        this.end = end;
    }

    @Override
    protected Integer compute() {
        if (end - start <= 2) {
            return array[start] + array[end - 1]; // Base case
        }

        int mid = (start + end) / 2;
        SumTask leftTask = new SumTask(array, start, mid);
        SumTask rightTask = new SumTask(array, mid, end);

        leftTask.fork();
        return rightTask.compute() + leftTask.join();
    }
}

public class ForkJoinExample {
    public static void main(String[] args) {
        ForkJoinPool pool = new ForkJoinPool();
        int[] numbers = {1, 2, 3, 4, 5, 6, 7, 8};

        int sum = pool.invoke(new SumTask(numbers, 0, numbers.length));
        System.out.println("Amount: " + sum); // 36
    }
}
```

| Property                     | `ForkJoinPool`                                  | `FixedThreadPool`                    |
| ---------------------------- | ----------------------------------------------- | ------------------------------------ |
| **Pool size**              | Automatically configured                     | Fixed number of threads          |
| **Support for work-stealing?** | Yes                                              | No                                  |
| **When to use?**      | Recursively shared tasks (`RecursiveTask`) | Independent (`Runnable`, `Callable`) |

