[[questions]]
id = 26
question = "Why do we need thread pools?"
answer = """
**Thread Pools** are a group of threads that are reused to perform tasks. They are provided by the class `Executors` and implement the interface `ExecutorService`

**Main reasons for use:**
1. **Resource Management:**
    - avoid creating a large number of threads, which can lead to memory shortage
    - limit the maximum number of concurrently executing threads
2. **Performance improvement** - threads are reused, which reduces the cost of creating and destroying them
3. **Task control** - allow you to schedule tasks, add them to the queue or limit execution

```java
ExecutorService executor = Executors.newFixedThreadPool(2);
executor.submit(() -> System.out.println("Task 1"));
executor.submit(() -> System.out.println("Task 2"));
executor.shutdown();
```
"""
source_hash = "b1c8d7d06619ee8596e43a7ac52c251c75b8ead0526127fca5591b49bb0484c2"

