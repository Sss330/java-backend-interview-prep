[[questions]]
id = 1
question = "What are generics? What are they for?"
answer = """
Generics are parameterized types in Java
- What is this? Allows you to create classes, interfaces and methods with types specified as parameters
- Why are they needed? Allows you to use one class for different data types (`List<String>`, `List<Integer>`)

A set of [recommendations](https://docs.oracle.com/javase/tutorial/java/generics/types.html) from Oracle on when to use which notations in generics:
- **E** - element, for elements of parameterized collections;
- **K** - key, for keys of map structures;
- **V** - value, for values of map structures;
- **N** - number, for numbers;
- **T** - type, to denote the type of parameter in arbitrary classes;
- **S, U, V** and so on - are used when there are several parameters in a generic class."""
source_hash = "9d95d8c6a1bcac641049c08f4429b171d204afb5f272b62424c9fdc2767c4091"

