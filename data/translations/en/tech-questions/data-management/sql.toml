[[questions]]
id = 1
question = "What are transactions?"
answer = """
A transaction is a set of logically related requests executed atomically (either all are executed - commit transactions, or rollback of everything - rollback)
"""
source_hash = "ca675dda4431948d3a40049b4f9ad58c6ffdaf241e09cbd09dea7462a9c44f51"

[[questions]]
id = 2
question = "Explain the ACID properties."
answer = """
ACID is a set of properties that guarantee the reliability of a transaction:
- **A**tomicity (atomicity/indivisibility of operations) - all operations within a transaction are either performed completely or not performed at all
- **C**onsistency (data consistency) - after the transaction, the data follows all integrity rules (integrity rules are determined by business logic)
- **I**solation - while a transaction is running, concurrent transactions should not affect its outcome
- **D**urability (durability/survivability) - ensures that committed changes cannot be lost under any failures (server failure, power outage, etc.)
"""
source_hash = "e6d3b2233d9c6885658c067ad6274e96f61fa381a243fc864409568e42ab85d3"

[[questions]]
id = 3
question = "What anomalies can occur with concurrent transactions?"
answer = """
- **Dirty read** - the ability of one transaction to read uncommitted data of another transaction. Transaction A is updating values ​​in the database but has not yet committed them. Transaction B reads this value without knowing that the changes can be rolled back. If transaction A is rolled back, the value read by transaction B was dirty because it does not reflect the final state of the database. Solved by isolation level **read committed** and higher
- **Lost update** - when the same data is simultaneously changed by different transactions, only the changes in the last transaction take effect. Solved by **repeatable read** and higher
- **Non-repeatable read** - occurs when the data itself changes. Those. when, within the same transaction, two readings of the same data over a period of time give two different results. Solved by **repeatable read** and higher
- **Phantom read** - occurs when the volume of data / rows changes. Those. During one transaction, another transaction added several rows to the table and committed the changes. When requesting data again, the first transaction will receive more data (original + “phantom” records from another transaction)

In Postgres, `Repeatable Read` is implemented through MVCC so strictly that phantom reading actually does not occur there (although the SQL standard allows it)

**MVCC** (**Multiversion Concurrency Control**) is a method of managing concurrent access to data in a database, which allows multiple transactions to work with data simultaneously without conflicts. MVCC supports high performance and transaction isolation, minimizing blocking and improving concurrency.
- **Multi-version**:
  MVCC uses a multi-versioning mechanism to manage data changes. Instead of changing data where it is stored, MVCC creates new versions of the data. Each transaction sees the data in the state in which it was at the time the transaction began, and not in the current state.
  When data is written, a new version of the row is created. The new version includes information about which transaction created it and becomes visible to transactions that begin after it was created.
  Because a version indicates which transaction created it and when the data was created or deleted, it is possible to determine which version is available for a particular transaction.
  From time to time, the DBMS cleans up old versions of data that are no longer needed (that is, that are no longer used by any transaction). This is called garbage collection and helps maintain system efficiency.
- **Transaction isolation**:
  Transactions see only the data that was recorded before they began. This prevents dirty reads, non-repeated reads, and phantom reads.
- **No read locks**:
  Reading data does not block writing, and writing does not block reading. This improves system performance because transactions can operate on data in parallel.
- **Conflict Management**:
  Conflicts between transactions, such as two transactions attempting to change the same row, are resolved by committing the transactions. If one of the transactions cannot be committed due to a conflict, it can be rolled back.
"""
source_hash = "f89ad9f4655b2b30052700f4af0e14f720af7604a3bec2d0a4aa14f345f8962f"

[[questions]]
id = 4
question = "Isolation levels (read uncommitted, read committed, repeatable read, serializable)"
answer = """
[Article on Habré about isolation levels](https://habr.com/ru/articles/845522/)

From least strict to most strict:
- Read uncommitted (unprotected reading) - transactions can read data that has not yet been committed by other transactions (use when all transactions are read)
- Read committed (secure read) - transactions can only read data that is already committed by other data (solves lost update and dirty read)
- Repeatable read - within a single transaction, querying data multiple times always returns the same set of data, regardless of changes made by other transactions (addresses lost update, dirty read, and non-repeatable read)
- Serializable is the most stringent isolation level. Transactions are executed as if they were happening sequentially one after another (solves everything, but hurts performance)

**What is the default isolation level in MySQL?**
In MySQL - Repeatable read, in PostgreSQL - Read commited

**Dependence between database speed and isolation level**

| **Insulation level** | **Description**                                                                                 | **Performance Impact**                                                          |
| -------------------- | -------------------------------------------------------------------------------------------- | ------------------------------------------------------------------------------------------ |
| Read Uncommitted     | Transactions can read data that has not yet been committed                                 | Fastest, but data may be inconsistent                                       |
| Read Committed       | Transactions read only committed data                                              | Average performance, balance between speed and consistency                      |
| Repeatable Read      | Ensures that the data read by a transaction does not change until the transaction is completed | Reduces performance due to blocking, but provides higher consistency |
| Serializable         | Highest level of isolation, prevents all types of anomalies                              | Slowest because it uses full locks                                      |
"""
source_hash = "f50632d5965cd5fdb1808e84fce80ee9d2d482af6ffeafe997e6666b06968e55"

[[questions]]
id = 5
question = "Types of JOIN. How does each JOIN work?"
answer = """
An operator that allows you to link data from two tables. There are:
- **(INNER) JOIN** - will return the common value for the left and right tables (can be replaced by WHERE)
- **LEFT (OUTER) JOIN** - will return all values from the left table and all matching values from the right one
- **RIGHT (OUTER) JOIN** - will return all values from the right table and all matching ones from the left
- **FULL (OUTER) JOIN** - will return all records that are present in the tables
- **CROSS JOIN** - will create a Cartesian product of two tables (if the first table has 5 rows and the second has 3, it will return 5 x 3 = 15)
- **NATURAL JOIN** - joins tables by columns with the same names if the values in these columns are the same
- **SELF JOIN** - joins a table to itself
"""
source_hash = "8e598229c3a785c8ebf6a1da533492ae1784330fe25086b6420271df982bd00e"

[[questions]]
id = 6
question = "What is a database index?"
answer = """
Indexes in a database are a tool for optimizing/accelerating queries by creating an ordered set of pointers to table rows. The acceleration occurs due to the fact that the index structure is optimized for search (for example, b-tree). At the same time, the more duplicates in a column, the worse the index performs

**Is there a link to the data in the index or is the data cached in the index itself?**
The index stores **links** to the real data that is in the database table. These links can be presented as:
- **pointers to rows** in the table where the data is stored
- **record identifiers** that allow you to find data in the table

In Postgres, the index stores **links** to the actual data that resides in the database table. For example, in **B-tree**:
- intermediate nodes of the tree contain only **keys** for the search direction
- The leaves of the tree do not store the data itself, but **links to data** in the table (or other indexes)

However, it is possible to create a covering index - an index that includes not only the keys, but also the value of the column(s). Such indexes allow you to retrieve data without accessing the table. Example:
```sql
CREATE INDEX idx_price ON products(price) INCLUDE (name);
-- The index now stores the values price + column name, which allows you to execute the request
SELECT price, name FROM products WHERE price > 50;
-- without referring to the table
```

In MySQL (InnoDB), the behavior of indexes differs depending on their type:
1. PRIMARY KEY (clustered index) - the index contains the data itself
2. A regular (SECONDARY INDEX) index stores references (PRIMARY KEYs) to data

**What are the default indexes in different DBMSs?**
By default, most DBMSs use B-tree

**Search difficulty comparison**

|**Search Type**|**Structure**|**Difficulty**|**When to use?**|
|---|---|---|---|
|**No index**|Complete search|`O(N)`|Small tables|
|**B-Tree index**|Balanced tree|`O(log N)`|Frequent search by ranges|
|**Hash index**|Hash table|`O(1)`|Quick search by `=`|

**How can I add a new index to a large, heavily used table in production without blocking access or pausing the application, and what strategies can be used to minimize the impact on the system?**
- **PostgreSQL** - `CREATE INDEX CONCURRENTLY` / pg_repack / gh-ost
- **MySQL** - `ALTER TABLE … ALGORITHM=INPLACE, LOCK=NONE` / pt-online-schema-change

**How do you determine which index to use in a query filtering on a column with low selectivity (such as gender), and how does selectivity affect the performance of indexes?**
1. **EXPLAIN ANALYZE** will show whether there will be `Index Scan` or `Seq Scan`
2. **pg_stats.n_distinct** gives an estimate of the number of unique values
"""
source_hash = "e0771ad8af7a6cb9b6659b668e14e240771793b065e310ff46aad6fd8b5cd4ee"

[[questions]]
id = 7
question = "Why is having a lot of indexes bad?"
answer = """
- Complicating the scheduler's work - the DBMS may not choose the best index for a query if there are too many of them. Some indexes may be redundant, which not only does not speed up queries, but also increases the load on the system
- Hard disk space utilization - indexes take up additional disk space in proportion to the amount of data and the number of selected columns
- Increased write time - when inserting, updating or deleting data, indexes need to be updated, which slows down write operations
- Increasing management complexity - managing large numbers of indexes becomes complex, including tracking and maintaining them
"""
source_hash = "93252e44d3a80d4d64cf4095f4d136a6e2f9bfd8c3358561f04d7eeca240ea5d"

[[questions]]
id = 8
question = "Pros and cons of indexes"
answer = """
**Pros:**
- Improve performance for select and sorting on specific fields

**Cons:**
- Performance suffers when you need to insert, update, or delete data
- Additional space is required and the larger/longer the key, the larger the index size
"""
source_hash = "d1c9b4a81f421bac6c872f288287dd7021e762e152bbeef7687235cf8b71c96b"

[[questions]]
id = 9
question = "What types of indexes do you know?"
answer = """

| **Index type**                                          | **Description**                                                                                                                                                      | **Usage**                                                                                      |
| -------------------------------------------------------- | ----------------------------------------------------------------------------------------------------------------------------------------------------------------- | ------------------------------------------------------------------------------------------------------ |
| B-tree                                        | Standard index used in most DBMSs. Data is stored in a balanced tree                                                                    | For searching, sorting, range queries                                                           |
| Hash Index                                  | Uses a hash function to find exact matches                                                                                                               | To quickly search by unique values (for example, ID)                                             |
| Composite Index         | An index that includes multiple columns. Speeds up queries that use multiple filters                                                                          | When queries filter on multiple columns simultaneously                                            |
| Index with unique values (Unique Index)           | An index that ensures that the values in a column are unique                                                                                                            | To ensure uniqueness of values (for example, email)                                                |
| Full-Text Index                  | Index for quick text search, including keywords and phrases                                                                                              | Search long text fields, such as articles or documents                                   |
| Bitmap Index                   | Bitmap index for columns with few unique values                                                                                          | For columns with a limited number of unique values, such as gender                                  |
| Incremental (Clustered Index)                           | An index where table data is physically ordered according to the index                                                                                | When it is necessary to store data in index order, for example by ID                                     |
| Functional Index                   | Index based on calculated values or functions on columns                                                                                            | For queries that use functions or expressions in filters                                            |
| Tree-based index (GiST - Generalized Search Tree) | General tree type used for indexing complex data types                                                                                                | For indexing geographic data or other complex types                                          |
| Prefix Index                 | An index created on part of a string, such as the first characters                                                                                                   | For text fields where it is important to index only part of the string (for example, the first few characters) |
| GIN (Generalized Inverted Index)                         | Inverted structure: GIN creates a map that associates values (keys) with row identifiers (TIDs) in which those values occur. B-tree under the hood | Ideal for<br>`JSONB` (operators `@>`, `?`), <br>`ARRAY` (operators `<@`, `@>`, `&&`)<br>             |
| Covering Index                      | Similar to composite, but INCLUDE columns do not participate in search/filtering<br><br>CREATE INDEX idx_users_cover<br>ON users(email)<br>INCLUDE(name, age)              | For a specific set of frequently requested fields that are not included in filtering                        |
"""
source_hash = "9bf9f12dadf405acdc6be6391574acfc8f1cd10321a1590489a26777101fbb60"

[[questions]]
id = 10
question = "How to choose the right index?"
answer = """

| Index type        | When to use                                    | Where available             |
| ------------------ | ----------------------------------------------------- | ------------------------ |
| B-Tree             | Universal, for `=`, `<`, `>`, `ORDER BY`          | Everywhere                    |
| Hash               | Only `=` (search by exact value)                | PostgreSQL, MySQL MEMORY |
| Bitmap             | Column with a small number of unique values (`status`) | Oracle, Postgres ext     |
| Full-text/GIN/GiST | Search by text, JSON, arrays, geo data           | PostgreSQL, MySQL        |
| Clustered          | Primary key, ranges                                | SQL Server, MySQL InnoDB |
| Non-clustered      | Additional indexes                                | SQL Server, MySQL        |
| Partial            | Index only by condition `WHERE`                      | PostgreSQL, SQL Server   |
"""
