[[questions]]
id = 11
question = "What are normalization and denormalization? Describe the normal forms."
answer = """
Normalization is the process of transforming database relationships into a form without redundant information. Redundancy is a situation where the same data is stored in several places in the database. Normalization takes several forms:
- **1NF** (1st normal form). One cell - one value.
- **2NF** (2nd normal form). All non-key columns depend on the entire key.
- **3NF** (3rd normal form). All non-key columns are independent of each other.

Denormalization is the reverse process of normalization. This is usually necessary to improve performance and data retrieval speed by increasing data redundancy (resulting in a reduction in query complexity)
"""
source_hash = "4b3f019b1349bfc7d10e131c275317dec793cf6915de39f0f5b2d3a895fa9b36"

[[questions]]
id = 12
question = "What is a foreign key?"
answer = """
A Foreign Key is a column (or set of columns) in a table that references the primary key (or any UNIQUE column) of another table. Ensures referential integrity.

```sql
CREATE TABLE users (
    id INT PRIMARY KEY
);

CREATE TABLE orders (
    order_id INT PRIMARY KEY,
    user_id INT,
    FOREIGN KEY (user_id) REFERENCES users(id) ON DELETE CASCADE
);
```

**Can Foreign Key be compound?**
Yes, Foreign Key can be Composite Foreign Key

| **Characteristics** | **Primary Key (PK)**                   | **Foreign Key (FK)**                          |
| ------------------ | -------------------------------------- | --------------------------------------------- |
| **Purpose**     | Guarantees uniqueness of strings         | Ensures referential integrity            |
| **Uniqueness**   | Always unique                        | May be repeated                             |
| **NULL?**          | You can't                                 | You can                                         |
| **Quantity**     | One per table (can be composite) | There may be several                          |
| **Removal**       | Cannot be changed without `CASCADE`            | `ON DELETE CASCADE` - will delete dependent records |
"""
source_hash = "9c0db2ee8fe4808e031b93dc9af749a56fa4b2ef79440fe10d186f4a53a9c295"

