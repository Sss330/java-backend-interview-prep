[[questions]]
id = 15
question = "What tools can be used to optimize SQL queries?"
answer = """
- **EXPLAIN** - shows the theoretical query execution plan, which allows you to see how the DBMS **plans** to retrieve data
- **EXPLAIN ANALYZE** - executes the query and shows the **real execution plan**, including the resources spent (time, memory)
- **Indexes** - indexes speed up data access, especially when used in WHERE conditions
- **pg_stat_statements** (for PostgreSQL) - module for collecting query execution statistics

**Your SQL query is normal, but execution still takes a long time. Your actions?**
- **Execution plan optimization** - use EXPLAIN and EXPLAIN ANALYZE to analyze the query execution plan and find problem areas
- **Index Usage** - Check if existing indexes are being used correctly. If necessary, create or change current
- **Query refactoring** - change the query structure if there is a more efficient way to get the same data. For example, joining multiple subqueries or using simpler JOINs
- **Resource limitations** - check for absence of hardware limitations (lack of CPU, memory, disk)
"""
source_hash = "07cccaac01119706d78437c354cb0cd1eb86a00994cd985dafb732ffcdcdf428"

[[questions]]
id = 16
question = "EXPLAIN vs EXPLAIN ANALYZE"
answer = """
EXPLAIN shows the query execution plan before it is actually executed. It displays how the DBMS is going to retrieve the data. This includes:
- what type of scanning will be used (Seq Scan, Index Scan)
- sorting and joining (Nested Loop, Hash Join)
- estimated number of lines and cost of execution at each stage

**Explain analyze. How is it arranged? What to pay attention to?**
EXPLAIN ANALYZE not only shows the execution plan, but also executes the query, outputting the actual execution time of each operation. Useful points:
- **actual time** (Actual Time) - how long the operation took
- **ROWS** - the actual number of rows that passed through each stage
- **LOOPS** - number of times this step was executed (important for nested loops)
```sql
EXPLAIN ANALYZE SELECT * FROM employees WHERE salary > 100000;
```
"""
source_hash = "749b8949be0315d429522a51acf3efefec6f3d13248ed4ed9e14f24784b693d7"

