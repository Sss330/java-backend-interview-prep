[[questions]]
id = 19
question = "What does the LATERAL keyword do?"
answer = """
LATERAL allows you to use data from each row of an external table in a subquery (similar to “for each row”)

**Example:**
Let's say we have a table `users` and for each user we want to take his last 3 transactions from the table `transactions`
```sql
SELECT u.id, u.name, t.*
FROM users u,
LATERAL (
  SELECT *
  FROM transactions t
  WHERE t.user_id = u.id
  ORDER BY t.date DESC
  LIMIT 3
) t;
```
- For each row of the table `users`, a subquery with the constraint (`LIMIT 3`) is executed
- Without `LATERAL`, the subquery could not reference the external table `u`
"""
source_hash = "c56b8d3c5684285d3c23718d5cb01778aebedc5de3da9321466d000082aee20e"

[[questions]]
id = 20
question = "How do window functions and PARTITION BY work?"
answer = """
Window functions allow you to divide a sample into disjoint groups (partitions) along any column and work with them independently

Syntax:
```sql
SELECT <window_function>(<field_tables>)
OVER (
      [PARTITION BY <columns_for_separation>]
      [ORDER BY <columns_for_sorting>]
      [ROWS|RANGE <definition_range_lines>]
)
```
- `PARTITION BY <columns_for_separation>` divides the sample into disjoint subsets, where each subset contains rows with the same values in one or more columns, partitions are formed. Similar to `GROUP BY`, but does not aggregate rows, but allows you to work with them individually within a group
- `ORDER BY <columns_for_sorting>` sets the order of rows within a window, especially important in window ranking functions
- `ROWS|RANGE <row_range_definition>` generates row ranges. Using this parameter, you can specify how many lines to take before and after the current one into the window

**Syntax ROW | RANGE**
```sql
ROWS|RANGE BETWEEN <start of window border> AND <end of window border>
```
- UNBOUNDED PRECEDING - all lines preceding the current one
- N PRECEDING - N lines before the current line
- CURRENT ROW - current row
- N FOLLOWING - N lines after the current line
- UNBOUNDED FOLLOWING - all subsequent lines

**Example:**
Let there be a table `sales` with columns `region`, `salesperson` and `sales`. We want to calculate the amount of sales in each region and rank employees within regions
```sql
SELECT
  region,
  salesperson,
  sales,
  SUM(sales) OVER (PARTITION BY region) AS total_region_sales,
  RANK() OVER (PARTITION BY region ORDER BY sales DESC) AS rank_in_region
FROM sales;
```
- `PARTITION BY region` - grouping by region
- `SUM(sales)` - executed for each row, but only within the region
- `RANK()` - assigns a rank based on sales within each region

{{< figure src="/java-backend-interview-prep/window_functions_sql.png" title="" >}}

"""
source_hash = "3cc56abf12add8ad4894c4c8c3750757fbe33755a01710302de05ff5f67de5cf"

[[questions]]
id = 21
question = "How do GROUP BY, ROLLUP, and CUBE differ?"
answer = """
{{< figure src="/java-backend-interview-prep/cube_rollup_groupby_sql.png" title="" >}}

**CUBE**
Creates all possible combinations of groupings.
```sql
SELECT region, product, SUM(sales)
FROM sales
GROUP BY CUBE(region, product);
```
Result:
- Grouping by `region, product`
- Grouping only by `region`
- Grouping only by `product`
- Total amount for all sales

**ROLLUP**
Creates hierarchical grouping levels (top to bottom)
```sql
SELECT region, product, SUM(sales)
FROM sales
GROUP BY ROLLUP(region, product);
```
Result:
- Grouping by `region, product`
- Grouping only by `region`
- Total amount for all sales

**GROUPING SETS**
Explicitly indicates grouping combinations
```sql
SELECT region, product, SUM(sales)
FROM sales
GROUP BY GROUPING SETS ((region, product), (region), ());
```
The result is identical to `ROLLUP`, but the groups can be set arbitrarily

**`GROUP BY`** is used to group rows into specific columns and apply aggregate functions to each group. This allows you to perform calculations on groups of data, for example, calculating the sum, average, etc.

**Example:**
There is a table `sales` with columns `region` and `revenue`. To find the total income for each region:
```sql
SELECT region, SUM(revenue) AS total_revenue
FROM sales
GROUP BY region;
```
- `region` - grouping column
- `SUM(revenue)` is calculated for each group

If you don't use `GROUP BY`, SQL will treat all rows as one group
"""
source_hash = "5a71533bb8e6b1b6017c9c357b0e0a66b58d6a1400278e943a44f076b45c3c4a"

[[questions]]
id = 22
question = "What are stored procedures?"
answer = """
**A stored procedure** (essentially an analogue of a function in Java) is a set of SQL instructions (PL/pgSQL, PL/Python) created once and stored in the database that performs a specific task. Serves for code reuse and optimization

**Key Features:**
- **Input parameters** - transferring data to the procedure
- **Output parameters** - return result
- **Execution flow control operators** - loops, conditional structures (`IF`, `WHILE`)

**Example of creating and calling a stored procedure:**
```sql
CREATE PROCEDURE CalculateBonus (IN employee_id INT, OUT bonus_amount DECIMAL(10,2))
BEGIN
  SELECT salary * 0.1 INTO bonus_amount
  FROM employees
  WHERE id = employee_id;
END;
```

Call:
```sql
CALL CalculateBonus(101, @bonus);
SELECT @bonus;
```

Benefits:
- reducing traffic between client and server
- better code organization
"""
source_hash = "79e740a2625059b948749f7c882bd0b0801c6ddb8690276907bb1d87af9f2cd6"

[[questions]]
id = 23
question = "How is the SERIALIZABLE isolation level implemented?"
answer = """
Serializable is the strictest transaction isolation level. Ensures that transactions are executed as if they were occurring sequentially (one at a time), even though they are actually occurring in parallel. Uses locks or versioning control (MVCC) to control concurrency
Completely prevents all 4 types of transaction problems

May cause performance degradation due to increased wait time between transactions
```sql
SET TRANSACTION ISOLATION LEVEL SERIALIZABLE;

BEGIN TRANSACTION;

-- First transaction
SELECT SUM(balance) FROM accounts WHERE account_type = 'savings';

-- Second transaction (waiting for the first one to complete)
INSERT INTO accounts (account_type, balance) VALUES ('savings', 500);

COMMIT;
```
"""
source_hash = "074664fc9db139eb66a26163eebe534d40126c406aec583c2b0d487c3d656cae"

[[questions]]
id = 24
question = "How do ordinary views and materialized views differ?"
answer = """
View is a saved SQL query that is used to conveniently (without having to re-write the query) obtain a specific data sample. Does not store data
```sql
CREATE VIEW ActiveUsers AS 
SELECT id, name, email 
FROM users 
 WHERE status = 'active'; 
 
 -- Using a View 
 SELECT * FROM ActiveUsers;
```

Materialized View is a direct selection obtained from some request and stored in memory. It can speed up the execution of complex queries due to the fact that it does not re-read the data. It is not updated automatically (requires `REFRESH`), and therefore the data may not be consistent
```sql
CREATE MATERIALIZED VIEW SalesSummary AS
SELECT region, SUM(revenue) AS total_revenue
FROM sales
GROUP BY region;

-- Data Update
REFRESH MATERIALIZED VIEW SalesSummary;
```
"""
source_hash = "028dc26ba44d80211d73ad97f06eea055425be112cc456b01ffd32690e4183a8"

[[questions]]
id = 25
question = "How can SELECT FOR UPDATE be used to lock rows?"
answer = """
**`SELECT FOR UPDATE`** is used to lock rows in a table that are part of a query until the end of the transaction to prevent other transactions from changing them
```sql
BEGIN;

-- Locking a row with id = 1
SELECT * FROM accounts
WHERE id = 1
FOR UPDATE;

-- Making an update
UPDATE accounts
SET balance = balance - 100
WHERE id = 1;

COMMIT;
```
- In this case, the line with `id = 1` is blocked for other transactions until the current one is completed
- If another transaction tries to lock the same row, it will wait for the current transaction to complete
"""
source_hash = "19a0d155d4b39684349d2eb2fc84f4ec0cbd1ea7a3aec611e3fc2347bdb36e36"

[[questions]]
id = 26
question = "UNION vs UNION ALL"
answer = """
`UNION` and `UNION ALL` combine the results of two or more queries. The difference is that `UNION` searches for and eliminates duplicate rows, while `UNION ALL` does not. As a result, `UNION` may run slower. Both operators require that the number and types of columns in the merged selections be the same
```sql
SELECT city FROM customers
UNION [ALL]
SELECT city FROM suppliers;
```

If both queries return `city = 'New York'`, then the result `UNION` will only appear once. In the case of `UNION ALL` - twice
"""
source_hash = "a6bde6e2c507373a9bc69bbefc1f7f1ed51eca33945041a26e1e76851e1af2e3"

[[questions]]
id = 27
question = "What does DISTINCT do?"
answer = """
`DISTINCT` is an SQL keyword used to select only unique records, i.e. eliminates duplicate rows from the query result
"""
source_hash = "91fad41a26b6bc0751cb78cd2c15af2c64efdefdb0e3e6f57623b1aac48eac02"

[[questions]]
id = 28
question = "What are table expressions?"
answer = """
A common table expression or **CTE (Common Table Expressions)** is a named temporary result set of data that can be accessed in subsequent queries. Implemented via the WITH keyword

```sql
WITH recent_sales AS (
    SELECT * 
    FROM sales 
    WHERE sale_date > '2023-01-01'
)
SELECT * FROM recent_sales WHERE amount > 1000
```
Temporary table `recent_sales` is only available within the current query

CTEs can be materialized or immaterialized. By default, the scheduler decides this based on analysis of CTE usage in subsequent requests. But you can explicitly specify this parameter
```sql
WITH recent_sales AS [NOT] MATERIALIZED (
    SELECT * 
    FROM sales 
    WHERE sale_date > '2023-01-01'
)
```
"""
source_hash = "cd2318a4d3325e8557cb2cbc5db7c11ae5035b6261843032f827cf485ebd3ad0"

[[questions]]
id = 29
question = "Why use a database connection pool such as HikariCP, and what happens when it is exhausted?"
answer = """
Database Connection Pool is a pool of database connections that manages a limited number of connections to reduce the load on the database server and improve performance. Hikari is one of the most popular Connection Pools

**Why do you need a pool?**
- Reduces the overhead of creating/closing connections
- Improves performance of multi-threaded applications

Since opening and closing connections to a database is an expensive operation, it is more profitable to keep a pool of open connections and issue them upon request. Connections that have been idle for a long time are closed.

Moreover, limiting the number of connections in the pool allows you to avoid overloading the database with multiple connections. If there are no free connections, anyone wishing to access the database must wait for one of the pool connections to become free.

**Connection Pool exhaustion** occurs when an application requires more connections than the pool allows. Possible reasons:
- Leaking connections (do not close after use)
- incorrect setting `maxPoolSize`
- excessive application load

Solutions:
1. Close connections via `try-with-resources`
2. Increase `maxPoolSize` if justified
"""
source_hash = "060c5c4acf562f231c8e00c7dec7f824a2420351005a2735c6a071fe2403264a"

[[questions]]
id = 30
question = "How do optimistic and pessimistic locking differ?"
answer = """
Locks (or locks) in a database are a mechanism that controls concurrent access to data to avoid conflicts and errors. There are two types of locks

**Optimistic locking** - when a transaction completes, the current version of the data is checked against the version received at the beginning of the transaction. If they do not match, the transaction is rolled back. Implies that conflicts will occur infrequently
```sql
SELECT version 
FROM orders 
WHERE id = 1;

-- Update if the version has not changed
UPDATE orders
SET status = 'processed', version = version + 1
WHERE id = 1 AND version = 5;
```

**Pessimistic locking** - when a transaction starts, the data being changed is locked for everyone else until the current transaction ends
```sql
SELECT *
FROM orders
WHERE id = 1 
FOR UPDATE;
```

**Comparison**

| **Characteristics**   | **Optimistic locks**         | **Pessimistic locks**   |
| -------------------- | ------------------------------ | ------------------------- |
| Conflicts            | Rare                         | Frequent                    |
| Mechanism             | Checking the Data Version         | Blocking a resource        |
| Productivity   | Higher for rare conflicts     | Lower due to blocking     |
| Handling conflicts | Requires additional code              | Not required              |
| Applicability         | Read takes precedence over write | Highly competitive entry |
"""
source_hash = "6b66fd21fd4410435097eec496b7931ace02480dcd089c6e6b1583503ea532a5"

[[questions]]
id = 31
question = "What types of database constraints exist?"
answer = """
**Constraint** is a rule placed on columns or tables to ensure data integrity and correctness

| **Limitation**               | **Description**                                                                                                                              | **Applicability**                |
| ----------------------------- | ----------------------------------------------------------------------------------------------------------------------------------------- | ------------------------------- |
| NOT NULL                      | This field is required                                                                                                           | Identifiers, key data |
| UNIQUE                        | The values in the field are unique                                                                                                                 | Email, username                 |
| PRIMARY KEY                   | Uniquely identifies a string                                                                                                           | Primary Record ID   |
| FOREIGN KEY                   | Ensures the integrity of relationships between tables                                                                                            | Tables with dependent data    |
| CHECK                         | Sets conditions for values                                                                                                        | Business rules                  |
| DEFAULT                       | Default value                                                                                                                     | Dates, statuses                   |
| EXCLUSION <br>(for postgres) | The generalized case of uniqueness allows you to write custom conditions for comparing two columns that must be met when adding |                                 |

Example EXCLUDE
```sql
CREATE TABLE reservations  
(  
        id serial PRIMARY KEY,  
        room_id INTEGER,  
        booking_status TEXT,  
        start_date TIMESTAMP,  
        end_date TIMESTAMP,  
        EXCLUDE USING GIST (TSRANGE(start_date, end_date) WITH &&)  
);
```
The EXCLUDE USING GIST clause creates an exclusion constraint that ensures that there are no conflicting reservations for the same period. The TSRANGE(start_date, end_date) WITH && condition checks whether date ranges overlap.
"""
source_hash = "fcaa9a3dfd07463ab544a3195975636ed2c4b0703c2788d56b29672c2967dced"

[[questions]]
id = 32
question = "What is a primary key?"
answer = """
**Primary Key (PK)** is a unique identifier for a record in a table. Without it, it is difficult to work effectively with data, especially in large tables
1. **Uniqueness Guarantee** - ensures that no record will be completely duplicated, which means it can be accurately identified
2. **Relationship between tables** - used as a basis for creating foreign keys (FK)
3. **Search acceleration** - PK is automatically indexed, which speeds up data retrieval

**PK indexed?**
Yes, Primary Key is **automatically indexed** by the database. This index includes UNIQUE and NOT NULL restrictions
- Speeds up searching, sorting and filtering by PK
- Guarantees uniqueness of values in the PK column
"""
source_hash = "6122f946852905e524c56c37f9f01e063f4951ae05989b1e70eb2f93ced236b3"

[[questions]]
id = 33
question = "DELETE vs TRUNCATE"
answer = """
- DELETE is a DML statement that removes records from a table that satisfy the WHERE conditions. Maintains logging. Doesn't reset sequences. Slower. It is possible to restore data

- TRUNCATE is a DDL operator that deletes all rows from a table, quickly freeing up occupied memory. Does not log, does not reset sequences. There is no way to recover data


 """
source_hash = "7b7b185f66fdb36002b43fa87484aaecb69c8c16e760a9a59fb52554a3cfd908"
