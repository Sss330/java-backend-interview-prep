[[questions]]
id = 1
question = "What types of databases exist, and when should each be used?"
answer = """

| **Database type**                | **Examples**           | **Main Application**                        |
| ------------------------- | --------------------- | ---------------------------------------------- |
| Relational               | MySQL, PostgreSQL     | Finance, CRM, online stores                |
| Document-oriented | MongoDB, CouchDB      | Flexible data structures, user profiles |
| Key-value             | Redis, DynamoDB       | Caching, sessions                            |
| Search engines                 | Elasticsearch         | Full text search, log search           |
| Column (wide-column)  | Cassandra, HBase      | Analytics, big data                      |
| Graph                  | Neo4j, OrientDB       | Link analysis, social networks                 |
| Time series           | InfluxDB, TimescaleDB | Metrics, IoT                                   |
| Object-oriented  | ObjectDB              | CAD, modeling                             |
| NewSQL                    | CockroachDB           | Scalability, transactions                   |

There is also Clickhouse. It is relational, but column-oriented. Serves for analytics (OLAP).

**OLAP** (Online Analytical Processing) - real-time analytical processing is a type of data processing that allows you to obtain a specific slice of data in real time for subsequent analysis

**OLTP** (Online Transaction Processing) - real-time transaction processing is a type of data processing that involves executing multiple transactions simultaneously, such as online banking, shopping, order entry or text messaging
"""
