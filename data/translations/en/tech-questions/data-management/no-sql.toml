[[questions]]
id = 1
question = "What types of NoSQL databases exist?"
answer = """

| **Type**                       | **Example**      | **Features**                                               | **When to use**                     |
| ----------------------------- | --------------- | ------------------------------------------------------------- | ------------------------------------------ |
| Document-oriented                   | MongoDB         | JSON documents, flexible structure                              | Dynamic, unstructured data   |
| Key-value                 | Redis, DynamoDB | The fastest possible access                                    | Cache, data with unique keys          |
| Column <br>(wide-column) | Cassandra       | Storing columns inside other columns, combining them into groups | Analytics, big data processing        |
| Search engines                     | Elasticsearch   | Inverted index, in fact a document database                      | Full text search, log search       |
| Graph                      | Neo4j           | Nodes and connections                                                  | Modeling complex relationships between data |
"""
