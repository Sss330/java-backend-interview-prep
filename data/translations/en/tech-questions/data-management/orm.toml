[[questions]]
id = 13
question = "What is the N+1 query problem, and how can it be solved?"
answer = """
This is a problem that occurs when lazy loading an entity from the database, when instead of one query including the main entity and all dependent entities, there is one query for the main entity and N queries for dependent entities

**Example:**
There are two related entities: User and Order. Each user can have many orders

Let's say you need to get a list of all users and their orders. The N+1 problem occurs when, instead of making one database query to get all users and their orders, the application first makes 1 query to get all users, and then makes N additional queries - one for each user to get their orders
```java
@Entity
public class User {
    @Id
    private Long id;
    private String name;
    @OneToMany(mappedBy = "user", fetch = FetchType.LAZY)
    private List<Order> orders;
}

@Entity
public class Order {
    @Id
    private Long id;
    private String item;
    @ManyToOne
    @JoinColumn(name = "user_id")
    private User user;
}
```

---
 **How to Avoid the N+1 Problem**
- JOIN FETCH. This is a way to tell Hibernate to load related data along with the main data (like a regular JOIN). Nuances:
    - It is necessary to use `DISTINCT` to avoid duplicates (due to JOIN, a Cartesian product will occur with the collection - for each related entity, a main entity will be added)
    - Doesn't work with pagination (`setFirstResult`, `setMaxResults`) if using `JOIN FETCH` with a collection
```java
@Query("SELECT DISTINCT u FROM User u JOIN FETCH u.orders")
List<User> findAllUsersWithOrders();
```

- Use EntityGraph. We specify what data to load in specific requests without changing the entity (as is the case with greedy loading)
```java
@EntityGraph(attributePaths = {"orders"})
List<User> findAll();
```

- Use **`FetchMode.SUBSELECT`** - loads all collections in one subquery on the first request
    ```java
        @OneToMany(mappedBy = "user", fetch = FetchType.LAZY)
        @Fetch(FetchMode.SUBSELECT)
        private List<Order> orders;
    ```
        Broadcast on
```sql
SELECT * FROM order WHERE user_id IN (SELECT id FROM user) 
```

- Use batch loading - `@BatchSize` allows you to load related entities in batches
        ```java
    private List<Book> books;
    @OneToMany(mappedBy = "user", fetch = FetchType.LAZY)
    @BatchSize(size = 50)
    private List<Order> orders;
    ```
    For 100 orders, Hibernate will execute 2 queries:
```
    SELECT * FROM order WHERE user_id IN (?, ?, ..., ?) // 50 ID
    SELECT * FROM order WHERE user_id IN (?, ?, ..., ?) // Remaining 50 ID
```

- Use `FetchType.EAGER` instead of `FetchType.LAZY`
"""
source_hash = "0b2e4d87332d6053df09596afa606a05a4e5c8893241f27a6d2bf556614d72a0"

[[questions]]
id = 14
question = "What is an entity graph?"
answer = """
Entity Graph is a mechanism in JPA that allows you to control your data loading strategy by determining which related entities should be loaded immediately (eager) and which should be loaded lazily (lazy). This gives flexibility in choosing fields to load depending on the request

**How to create?**
Created by the `@NamedEntityGraph` annotation at the entity level or dynamically via the API

**What's under the hood?**
Entity Graphs work at the SQL query level, adding the necessary JOINs and selecting the necessary fields

**Use of graph name**
```java
EntityManager entityManager = ...;

Map<String, Object> properties = new HashMap<>();
properties.put("javax.persistence.loadgraph", entityManager.getEntityGraph("User.withRoles"));

User user = entityManager.find(User.class, 1L, properties);
```

**Using a dynamic graph**
```java
EntityManager entityManager = ...;

EntityGraph<User> entityGraph = entityManager.createEntityGraph(User.class);
entityGraph.addAttributeNodes("roles");

Map<String, Object> properties = new HashMap<>();
properties.put("javax.persistence.loadgraph", entityGraph);

User user = entityManager.find(User.class, 1L, properties);
```

**Usage in Spring Data JPA**
```java
@Repository
public interface UserRepository extends JpaRepository<User, Long> {

    @EntityGraph(attributePaths = {"roles"})
    User findByName(String name);
}
```"""
source_hash = "a939c8f4f07230a830f18d2353adbe4c25ec75d2d85885c9f9ad56cc5cad1846"

[[questions]]
