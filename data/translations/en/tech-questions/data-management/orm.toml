[[questions]]
id = 9
question = "Describe the entity lifecycle."
answer = """
In Hibernate, an entity can be in one of four states:
- Transient
- Persistent
- Detached
- Removed

{{< figure src="/java-backend-interview-prep/hibernate_entity_life_cycle.png" title="" >}}

**Transient (new)**
The entity has just been created using the new operator, but has not yet been saved to the database
```java
User user = new User(); // the object is not yet associated with the database
user.setName("John");
```

**Persistent/managed (save, persist, update, get)**
When an object is saved to the database via an EntityManager or Session, it becomes persistent. In this state, Hibernate keeps track of the object. Any changes to the object are automatically synchronized with the database
```java
Session session = sessionFactory.openSession();
session.beginTransaction();
session.save(user); // the object is now able persistent
```

**Detached (session closed)**
When the session is closed, the object goes into the detached state. It is still associated with the data in the database, but is no longer synchronized with it
```java
session.close(); //  the object can be used, but changes will not be saved to the database
```

**Removed (delete(obj))**
When an entity is removed from the database, it goes into the removed state. In this state, the object still exists in memory, but has already been removed from the database
```java
session.delete();
```

"""
source_hash = "de1fac2368d503393360b0a31d383b5a705249bf0d485e5494c729c6f03f8a05"

[[questions]]
id = 10
question = "Caching"
answer = """
**Level 1 cache**
- This cache is always enabled and operates at the `Session` level (each session has its own cache and cannot be accessed from another session)
- The cache stores only entities whose status is `persistent`
- Tracked entities (`persistent`) are stored in a map, where the key is the entity ID, and the value is the entity objects themselves
- For repeated queries, Hibernate uses cached data instead of running a new database query
- When the session is closed, the cache is deleted

**Level 2 cache**
- This is an additional cache that must be enabled manually
- Operates at level `SessionFactory`
- Used to cache data between sessions, allowing reuse of data already loaded from the database
- Once `SessionFactory` is closed, all cache associated with it is deleted

**Level 3 cache**
- Caches query results at the SQL query level (caches sample results)
"""
source_hash = "1e7cf7d20aa16a607c0d6c0027ad919e795de36e0532a444098d4207120e5e43"

