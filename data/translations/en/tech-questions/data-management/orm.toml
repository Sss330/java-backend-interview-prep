[[questions]]
id = 21
question = "What does the @Query annotation do?"
answer = """
Annotation `@Query` - an annotation from Spring Data JPA, installed above the repository method (JpaRepository), - allows you to write a JPQL or SQL query.

**JPQL queries** (Java Persistence Query Language)
```java
public interface UserRepository extends JpaRepository<User, Long> {

    // Usage JPQL for data sampling
    @Query("SELECT u FROM User u WHERE u.name = :name")
    List<User> findByName(@Param("name") String name);
}
```

**Native SQL queries**
```java
public interface UserRepository extends JpaRepository<User, Long> {

    // Usage SQL-request
    @Query(value = "SELECT * FROM users WHERE name = :name", nativeQuery = true)
    List<User> findByNameNative(@Param("name") String name);
}
```

**Parameters in requests**
```java
@Query("SELECT u FROM User u WHERE u.name = :name")
List<User> findByName(@Param("name") String name);
```
"""
source_hash = "8dc2b4e88530b255fb9098099c647a139b0d2c090cf739bcd178f63e19e54f5d"

[[questions]]
id = 22
question = "How does Hibernate generate SQL queries?"
answer = """
Hibernate generates SQL queries to perform operations on entities based on configuration and annotations, such as `@Entity`, `@OneToMany`, `@ManyToOne`, and others.

Basic SQL queries include `INSERT`, `SELECT`, `UPDATE`, `DELETE`. Hibernate also supports the use of JPQL for entity-level queries and native SQL queries to perform specific operations
1. Hibernate analyzes the entity metamodel to understand how objects map to tables
2. The type of operation (CRUD) determines what SQL query to generate
3. The database dialect specifies the SQL syntax
4. Queries are built taking into account annotations (`@Lazy`, `@Eager`) and the API used (JPQL, Criteria or Native SQL)
5. Hibernate optimizes SQL queries based on relationships, lazy loading, and caching
"""
source_hash = "3f3b1f49b5b6a9c226214fe180b5e81cc47a40b3c0d750ac6994ffe2d876f801"

[[questions]]
id = 23
question = "What does the persistence context store, and how long are entities retained?"
answer = """
**Persistence Context** is a Hibernate mechanism that manages the state of entities within a Session. It tracks changes to entities and synchronizes them with the database. Persistence Context can be thought of as a first-level cache that exists for the life of the session.

The Persistence Context stores:
1. **Managed Entities**:
    - these are objects that were loaded in the current session (for example, using `session.get()`, `session.load()`, or through requests `HQL`, `Criteria API`)
    - Hibernate tracks changes to these objects and automatically syncs them to the database when a transaction is committed
2. **Entities added for saving**:
    - objects that were added to the Persistence Context using `session.save()`, `session.persist()`, or `session.update()`
3. **Entities marked for deletion**:
    - objects that were marked for deletion using `session.delete()`
4. **Snapshots**:
    - Hibernate saves snapshots of the state of entities at the time they are loaded. These snapshots are used to detect changes to objects and generate corresponding SQL queries when synchronizing with the database
5. **Entity IDs**:
    - Persistence Context stores the IDs of all managed entities to quickly find them in the cache

**How long is an object stored in the Psersistence Context?**
- Until the end of the session
- Before explicit removal (`evict` or `clear`)
- Before the object enters the `detached` state
"""
source_hash = "7cd6af509177cbf09ded1f0b19fc9265245cfbaa38e344608e8fa4de8133d163"

[[questions]]
id = 24
question = "Hibernate and Lombok"
answer = """
**`@Data` annotation problem in Hibernate**
`@Data` generates:  
 - getters and setters
 - `toString()`  
 - `equals()` and `hashCode()`

 **Problem `toString()`**
If an entity with `@Data` has `@OneToMany(fetch = FetchType.LAZY)`, then Hibernate will create a proxy object and Lombok will generate `toString()` with all fields involved, resulting in `LazyInitializationException`
```java
@Entity
@Data
public class User {
    @Id @GeneratedValue
    private Long id;
    private String name;

    @OneToMany(mappedBy = "user", fetch = FetchType.LAZY)
    private List<Order> orders;
}

User user = session.get(User.class, 1L);
System.out.println(user); // ❌ LazyInitializationException
```

**Solution:**  
Use `@ToString.Exclude`
```java
@Entity
@Data
public class User {
    @Id @GeneratedValue
    private Long id;
    private String name;

    @OneToMany(mappedBy = "user", fetch = FetchType.LAZY)
    @ToString.Exclude
    @EqualsAndHashCode.Exclude
    private List<Order> orders;
}
```

 **Problem with `equals()` and `hashCode()`**
Lombok generates these methods involving all fields, including `@OneToMany`, which can lead to infinite recursion

**Solution:** 
Use `@EqualsAndHashCode(onlyExplicitlyIncluded = true)` or `@EqualsAndHashCode.Exclude`
```java
@Entity
@Data
@EqualsAndHashCode(onlyExplicitlyIncluded = true)
public class User {
    @Id @GeneratedValue
    @EqualsAndHashCode.Include
    private Long id;

    private String name;

    @OneToMany(mappedBy = "user", fetch = FetchType.LAZY)
    @ToString.Exclude
    private List<Order> orders;
}
```"""
source_hash = "14dbbe11b2ba875f49a0226b389643e2672922bc7f70732b36a9268173791d31"

