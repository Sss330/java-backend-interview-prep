[[questions]]
id = 7
question = "What is a proxy, and what is it used for?"
answer = """
**Hibernate Proxy** is a proxy object that inherits from the target class and is used to lazily load entities. This means that Hibernate creates a proxy object instead of the real object from the database, and the real data is only loaded the first time it is accessed. This helps optimize performance by loading data only when it is actually needed

**Mechanism**
Hibernate creates a subclass of the requested class or interface implementation that overrides methods to ensure that data is loaded only when they are called.
```java
Session session = sessionFactory.openSession();
User user = session.get(User.class, 1); // Full object
User lazyUser = session.load(User.class, 2); // Proxy-object
```
- In the case of `session.get()`, the object is loaded immediately.
- When using `session.load()`, the object is replaced by a Proxy before the data is actually accessed.
"""
source_hash = "55d5b0eda64f95e3e96224b8e268c43628d3e4945b097407d59ad99e245331a0"

