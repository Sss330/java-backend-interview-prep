question = "What problems can arise when using JOIN FETCH?"
answer = """
**Problem**
Data duplication. When loading a main entity with its related entities, the results may contain duplicates

**Solution**
- Use DISTINCT to avoid duplicates
```sql
SELECT DISTINCT o FROM Order o JOIN FETCH o.items
```
- Use Set to store related elements
"""
