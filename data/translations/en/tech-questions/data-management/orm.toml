[[questions]]
id = 16
question = "Relationships between tables in ORM"
answer = """
1. OneToOne - one instance of an entity can be associated with at most one instance of another entity
2. OneToMany - one entity can refer to many entities
3. ManyToOne - multiple entities can refer to one entity
4. ManyToMany - many entities can refer to many entities. 
   - **Bidirectional** (using MappedBy) - a link to the relationship is established for all entities, i.e. in entity 1 there will be a link to entity 2 and vice versa. Entity 1 will be the owner of this relationship (important when cascading deletes) 
   - **Unidirectional** - the link to the connection is established only on one side

**How is OneToMany communication implemented?**
One object of one entity corresponds to many objects of another entity
```java
@Entity
public class Department {
    @Id @GeneratedValue
    private Long id;

    @OneToMany(mappedBy = "department", cascade = CascadeType.ALL)
    private List<Employee> employees;
}

@Entity
public class Employee {
    @Id @GeneratedValue
    private Long id;

    @ManyToOne
    private Department department;
}
```

**How is ManyToOne communication implemented?**
A set of objects of one entity corresponds to one object of another entity
```java
@Entity
public class Employee {
    @Id @GeneratedValue
    private Long id;

    @ManyToOne
    @JoinColumn(name = "department_id")
    private Department department;
}

@Entity
public class Department {
    @Id @GeneratedValue
    private Long id;
}
```

**How is ManyToMany communication implemented?**
To implement this type of connection, an intermediate table is created to store the identifiers of both entities

**Example**: Teachers can teach multiple subjects, each subject can be taught by multiple teachers
```java
@Entity
public class Student {
    @Id @GeneratedValue
    private Long id;

    @ManyToMany
    @JoinTable(
        name = "student_course",
        joinColumns = @JoinColumn(name = "student_id"),
        inverseJoinColumns = @JoinColumn(name = "course_id")
    )
    private List<Course> courses;
}

@Entity
public class Course {
    @Id @GeneratedValue
    private Long id;

    @ManyToMany(mappedBy = "courses")
    private List<Student> students;
}
```

|**Communication type**|**Essence**|**Relationship example**|**Features**|**Implementation in database**|
|---|---|---|---|---|
|OneToOne|One to one|Passport and owner|Every entity is connected to one other entity|One of the objects contains a foreign key|
|OneToMany|One to many|Department and employees|One entity is related to multiple entities of another entity|One foreign key on the “many” side|
|ManyToOne|Many to one|Employees and department|Inverse relation to `OneToMany`|Foreign key on the “many” side|
|ManyToMany|many to many|Students and courses|A set of objects of one entity corresponds to a set of another|Intermediate table|

**OneToMany: difference between List and Set**

|**Characteristics**|`List`|`Set`|
|---|---|---|
|Uniqueness|Allows duplicates|Guarantees the uniqueness of elements|
|Order|Preserves the order of adding|Doesn't guarantee order|
|Productivity|Slower when checking availability|Faster when checking availability|
|Implementation used|`ArrayList` or `LinkedList`|Usually `HashSet` or `TreeSet`|

**What is `Cascade`?**
`Cascade` in JPA defines what to do with dependent objects when the main object changes.

**Example:**
```java
@Entity
class Parent {
    @Id @GeneratedValue
    private Long id;

    @OneToMany(mappedBy = "parent", cascade = CascadeType.ALL)
    private List<Child> children;
}

@Entity
class Child {
    @Id @GeneratedValue
    private Long id;

    @ManyToOne
    @JoinColumn(name = "parent_id")
    private Parent parent;
}
```
If you delete `Parent`, then all `Child` objects will also be deleted.

|**Type**|**Description**|
|---|---|
|`ALL`|Applies all types of cascade (`PERSIST`, `REMOVE`, `MERGE`, `REFRESH`, `DETACH`)|
|`PERSIST`|Automatically saves dependent entities|
|`REMOVE`|Removes dependent entities|
|`MERGE`|Updates dependent entities|
|`REFRESH`|Overwrites dependent entities from the database|
|`DETACH`|Removes dependent entities from the context (but not from the database)|

**Pros:**
- Simplifies working with dependent objects
- Automates `save()` and `delete()`
- Reduces the number of `EntityManager` calls

**Cons:**
- May unexpectedly delete important data (`REMOVE` without checking)
- `ALL` may result in unexpected cascading operations
- Can overload the database if there are too many dependencies
"""
source_hash = "1f447a649e46117b66885747214d99267283e373997bec8cc01d8020e139a669"

[[questions]]
id = 17
question = "LazyInitializationException"
answer = """
This happens when an object was loaded with lazy loading, but its data tries to be used after the session is closed

```java
public void printAuthorBooks(Long authorId) {
    Session session = sessionFactory.openSession();
    Author author = session.get(Author.class, authorId);
    session.close();

    // Trying to access a lazy collection after the session is closed
    System.out.println(author.getBooks());  // May cause LazyInitializationException
}
```

How to solve?
- JOIN FETCH. This is a way to tell Hibernate to load related data along with the main data (like a regular JOIN)
- Use EntityGraph. We specify what data to load in specific requests without changing the entity (as is the case with greedy loading)
"""
