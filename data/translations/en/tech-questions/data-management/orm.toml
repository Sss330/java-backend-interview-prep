[[questions]]
id = 18
question = "What is SQL injection?"
answer = """
This is a type of vulnerability that allows attackers to modify database queries by inserting code into the query parameters that changes the behavior of the original SQL query.
```sql
SELECT * FROM users WHERE username = 'user' OR '1'='1';
```

Consequences of SQL injections
- Login without checking login and password
- Ability to delete important data from the database
- Ability to change data in the database
- Access to confidential information

How to avoid:
- Use PreparedStatement
- Use Hibernate
"""
