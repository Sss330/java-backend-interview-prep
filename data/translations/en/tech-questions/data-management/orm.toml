question = "How do Statement, PreparedStatement, and CallableStatement differ?"
answer = """
- Statement is an object that is used to form simple SQL queries. Vulnerable to SQL injections
- PreparedStatement - extends Statement, adds:
    - protection against SQL injections
    - possibility of dynamically inserting parameters
    - caching, which speeds up queries
- CallableStatement - extends PreparedStatement, needed to call stored procedures
"""
