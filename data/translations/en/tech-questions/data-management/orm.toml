[[questions]]
id = 1
question = "What are Hibernate, JPA, JDBC, and ORM?"
answer = """
 **ORM (Object-Relational Mapping)** - the concept of converting relational database entities into objects and back (in relation to object-oriented programming languages)
  **JPA (Java Persistence API)** - specification describing the concept of ORM for Java
  **Hibernate** is one of the JPA implementations
  **JDBC (Java DataBase Connectivity)** - standard for interaction between a Java application and a database
"""
source_hash = "8130274c28d73258bac8dc2862f46cb4aa3915548fcb71191397c71ddb7c9cd2"

[[questions]]
id = 2
question = "Pros and cons of ORM"
answer = """
**Pros:**
- **Speed up application development**
- **Ease of development:**
    - allows business methods to access Java classes rather than the database
    - Entities are based on business problems, not on the database structure
- **Portable** - ORM can work with various RDBMS, making it more portable than SQL
- **Transaction Management**

**Cons:**
- **Difficult to learn** - The ORM paradigm is non-trivial and may be counterintuitive for new developers with SQL experience
- **Potential Performance Loss** - Automatically generating SQL queries may be less optimal than writing queries manually
- **Does not handle complex queries well** - ORM does not handle very complex SQL queries well, such as complex aggregate functions or multi-level JOINs
"""
source_hash = "7defb8addf37a81e45f4705d9d53e2320e78b9539824b3c8566106c1a823e6c1"

[[questions]]
id = 3
question = "What is an entity, and how do you define one?"
answer = """
Entity is a class that represents a table in a relational database. To create it, the following conditions must be met:
- Class is not nested, interface, `enum`, or `final`
- Annotation `@Entity` above the class
- Constructor without parameters
- At least one field with annotation `@Id`
- The class must be a POJO (all fields are private + getters and setters to them)
*Note: Multiple @Id annotations in an Entity can only be used if a composite primary key is used*
"""
