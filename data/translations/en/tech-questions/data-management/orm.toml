question = "FetchType"
answer = """
`LAZY` - proxies will be inserted instead of such fields, and they themselves will be loaded the first time you access them
`EAGER` (greedy) - related entities are loaded immediately along with the main entity

`@OneToMany` `@ManyToMany` is used by default `FetchType.LAZY`
`@ManyToOne` `@OneToOne` `FetchType.EAGER` is used by default
"""
