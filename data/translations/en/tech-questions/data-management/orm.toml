[[questions]]
id = 26
question = "What inheritance mapping strategies does Hibernate support?"
answer = """
**`SINGLE_TABLE` (One table per hierarchy)**
One table for the entire hierarchy. All entities with all their descendants are recorded in one table, where an additional column is defined to identify the entity type. The main disadvantage is that all fields will be created in the table, which are unique for some entities and empty for others

```java
@Entity
@Inheritance(strategy = InheritanceType.SINGLE_TABLE)
@DiscriminatorColumn(name = "dtype", discriminatorType = DiscriminatorType.STRING)
public abstract class Vehicle {
    @Id @GeneratedValue
    private Long id;
    private String manufacturer;
    // getters/setters...
}

@Entity
@DiscriminatorValue("CAR")
public class Car extends Vehicle {
    private int seatingCapacity;
    // getters/setters...
}

@Entity
@DiscriminatorValue("TRUCK")
public class Truck extends Vehicle {
    private double payloadCapacity;
    // getters/setters...
}
```

**Pros**: 
- single table, simple query (without `JOIN`)
- high reading performance
**Cons**: 
- many nullable columns (for fields of all subclasses)
- the table grows “width”

**`TABLE_PER_CLASS` (Separate table for each class)**
Each entity class stores data in its own table, but only the unique fields and primary key, and all inherited fields are written to the tables of the ancestor class. 

```java
@Entity
@Inheritance(strategy = InheritanceType.TABLE_PER_CLASS)
public abstract class Vehicle {
    @Id @GeneratedValue
    private Long id;
    private String manufacturer;
}

@Entity
public class Car extends Vehicle {
    private int seatingCapacity;
}

@Entity
public class Truck extends Vehicle {
    private double payloadCapacity;
}
```

**Pros**: 
- no extra nullable fields, “pure” object-relational composition model
**Cons**: 
- `UNION` queries when selecting all `Vehicle`
- support for auto-increment is more difficult (not in all DBMSs)


**`JOINED` (According to tables with `JOIN`)**
The root class is stored in one table, each subclass is stored in its own, and the subclass table contains an FK field for the root
```java
@Entity
@Inheritance(strategy = InheritanceType.JOINED)
public abstract class Vehicle {
    @Id @GeneratedValue
    private Long id;
    private String manufacturer;
}

@Entity
@Table(name = "car")
public class Car extends Vehicle {
    private int seatingCapacity;
}

@Entity
@Table(name = "truck")
public class Truck extends Vehicle {
    private double payloadCapacity;
}
```

**Pros**: 
- there are no nullable fields, the structure is relationally “pure”, easy to expand and modify.
**Cons**: 
- poor support for polymorphism
- `JOIN`‑s when loading subclasses 
- slightly lower sampling performance


4. **`@MappedSuperclass` (Not a table-superclass)**
An annotated superclass is not an entity and does not receive its own table; its fields will inherit the subclass tables. It is used when common fields and methods need to be “distributed” to several entities, but the hierarchy itself is not stored.
```java
@MappedSuperclass
public abstract class BaseEntity {
    @Id @GeneratedValue
    private Long id;
    private LocalDateTime createdAt;
}

@Entity
public class User extends BaseEntity {
    private String username;
    private String email;
}

@Entity
public class Product extends BaseEntity {
    private String name;
    private BigDecimal price;
}
```

When to choose which strategy

| Strategy           | Suitable for…                                       | Key Benefits                      |
| ------------------- | --------------------------------------------------- | ------------------------------------------ |
| `SINGLE_TABLE`      | Fast read operations, small hierarchy         | No `JOIN`, simple queries              |
| `TABLE_PER_CLASS`   | Many different subclasses with unique fields        | Pure ORM model, no `null`              |
| `JOINED`            | Clear data normalization, frequent schema updates | No extra columns, flexibility               |
| `@MappedSuperclass` | Common fields for different entities without a super table   | Reusing code without affecting the DBMS |
