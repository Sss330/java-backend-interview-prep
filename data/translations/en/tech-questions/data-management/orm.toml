- basic methods of the `JpaRepository` interface (`save()`, `findAll()`, etc.)
- magic methods - generating queries by method name (`findAllByXOrderByZ`, etc.), `JpaReposiory` extends `QueryByExample`
- `@Query` with JPQL/HQL
- `@Query` with `native=true`"""
