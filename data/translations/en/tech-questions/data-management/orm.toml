question = "How can Hibernate SQL queries be logged?"
answer = """
Hibernate provides detailed logs through the `org.hibernate.SQL` category. This helps you track generated SQL queries, parameters, and transaction execution. Enabling logs can help debug performance or query issues, but can slow down execution when there are a large number of queries.

