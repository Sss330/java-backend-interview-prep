[[questions]]
id = 1
question = "What tools help diagnose application failures, memory leaks, and freezes (VisualVM, jmap, and profilers)?"
answer = """
When an application behaves abnormally (for example, it consumes too much memory, freezes, or crashes), it is important to understand the reason. Monitoring and debugging tools are used for this.

 **1. VisualVM**

- **What is it:** A JVM (Java Virtual Machine) monitoring tool included with the JDK.

 **2. JMap**

- **What is it:** A utility for working with memory state in the JVM.

 **3. Profilers**

- **What is it:** Specialized tools for analyzing application performance.
- **Examples:**
    - **YourKit**: Analysis of memory consumption, threads and method execution.
    - **JProfiler**: Profiling performance, memory, threads.
    - **Async Profiler**: Low-level tool for analyzing CPU and JVM load.
- **When to use:** If your application is slow, you can profile its execution and identify bottlenecks—methods or sections of code that are taking a long time.

"""
