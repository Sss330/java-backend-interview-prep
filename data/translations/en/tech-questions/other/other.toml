[[questions]]
id = 4
question = "How should methods be named to clearly describe operations such as sorted searches, cache invalidation, and saving calculation results?"
answer = """
The best way to give methods meaningful names is to follow the pattern **verb + object + additional qualifications**, and if necessary, sequentially list the main actions through the `And` connector.


**Basic principles**

1. **Verb at the beginning**
   — immediately shows what the method does:

   * `find`, `get`, `search` - read operations
   * `save`, `persist`, `update` - write operations
   * `clear`, `refresh` - cleaning/updating
   * `calculate`, `compute` - calculations

2. **Object after verb**
   — what the method does:

   * `findUsers`, `clearCache`, `calculateMetrics`

3. **Clarifications via `By`/`With`/`And`**
   — filtering criteria, sorting, additional steps:

   * `findUsersByStatus`
   * `findUsersSortedByRegistrationDate`
   * `calculateMetricsAndSave`
   * `clearCacheForUser`

4. **Return result in name (optional)**
   - if the method makes a record and returns a status or DTO, you can add a suffix:

   * `saveOrderAndReturnStatus`
   * `calculateReportAndGetSummary`

5. **Clear separation of commands and queries** (CQRS principle)

   * Query methods **do not change** state and usually return data:

     ```java
     List<User> findActiveUsersSortedByLastLogin();
     UserDto getUserProfile(int userId);
     ```
   * Command methods **change** state and can return status:

     ```java
     boolean clearUserCache(int userId);
     SaveResult calculateAndPersistMetrics(MetricsRequest request);
     ```



**Examples**

| Action                                  | Method name                                                  |
| ----------------------------------------- | ---------------------------------------------------------------- |
| Search for products sorted by price       | `List<Product> findProductsSortedByPriceDesc()`                  |
| Clearing the entire cache                        | `void clearCache()`                                              |
| Clearing a specific user's cache     | `boolean clearCacheForUser(int userId)`                          |
| Calculation and saving of a report with ID return | `Long calculateReportAndSave(ReportParams params)`               |
| Calculation and return of status                  | `OperationStatus calculateAndPersistMetrics(MetricsRequest req)` |



 🔑 **Key points**

* **Verb + object** is the basis of a readable name.
* **By/With/And** - for filters, sorting and sequential actions.
* **Query vs Command**: query methods do not change the state, command methods do (and return the status or result).
* The method name should be **self-documenting**: without comments, it is clear what it does and what it will return.

"""
