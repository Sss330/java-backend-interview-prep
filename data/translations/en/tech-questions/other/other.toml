[[questions]]
id = 6
question = "How do imperative and reactive programming differ?"
answer = """
1. **Imperative (regular) programming**

In imperative style, you describe **step by step** exactly how the program should achieve the result:

```java
// Example: reading a list of numbers, filtering, summing
List<Integer> numbers = Arrays.asList(1, 2, 3, 4, 5);
int sum = 0;
for (Integer n : numbers) {
    if (n % 2 == 0) {
        sum += n;
    }
}
System.out.println("Sum of evens = " + sum);
```

- **Sequence of steps**: `create → go through elements → check → accumulate results`.

- The code is **hard synchronous**: the thread of execution is blocked at each step.

- Easy to understand, but difficult to scale for asynchronous/event driven tasks.


2. **Reactive Programming**

Reactive Programming is focused on **event streams** and **asynchronous processing** - you describe **what** should happen when new data arrives:

```java
import reactor.core.publisher.Flux;

public class ReactiveExample {
    public static void main(String[] args) {
        Flux<Integer> numbers = Flux.just(1, 2, 3, 4, 5);
        numbers
            .filter(n -> n % 2 == 0)    // we skip only the even ones
            .reduce(Integer::sum)       // accumulate the amount
            .subscribe(sum ->            // when ready, display the result
                System.out.println("Sum of evens = " + sum)
            );
    }
}
```

Here we are:

1. **Create a stream** (`Flux.just(...)`).

2. **We write down the operators** (`filter`, `reduce`) - they are not executed immediately, but form a pipeline.

3. **We subscribe** (`subscribe`), and then the data “flows” through the pipeline **asynchronously** or **gradually**.


**Key Features of Reactive Style**

- **Push model**: data is “pushed” into the pipeline, and you describe what to do with each element.

- **Non-blocking**: Easily handle high loads, handle network responses, timers, etc.

- **Backpressure**: reactive libraries are able to regulate the flow rate so that the consumer does not drown in data.

- **Composition**: Operators (`map`, `flatMap`, `buffer`, `window`, etc.) allow you to construct complex asynchronous scripts declaratively.


3. **Example: HTTP requests**

**Imperative (RestTemplate)**

```java
RestTemplate rest = new RestTemplate();
String body = rest.getForObject("https://api.example.com/data", String.class);
System.out.println("Response: " + body);
```

This call **blocks** the current thread until a response is received.

**Reactive (WebClient)**

```java
WebClient client = WebClient.create("https://api.example.com");
client.get()
      .uri("/data")
      .retrieve()
      .bodyToMono(String.class)  // Mono<String> — single element stream
      .subscribe(body -> System.out.println("Response: " + body));
```

- `retrieve().bodyToMono(...)` returns `Mono<String>` without blocking the thread.

- Easily add timeouts, retry, combine multiple requests via `zip`, `flatMap`, etc.


4. **When to choose what**

|Approach|When it suits|Cons|
|---|---|---|
|**Imperative**|Simple scripts, synchronous logic, fast PoC|More difficult in asynchronous tasks, scaling|
|**Reactive**|High-load systems, I/O‑operations, event‑driven|Steeper barrier to entry, more difficult debugging|

**Key Points**

1. **Imperative style** describes _how_ to do step by step, is easy to read for simple tasks, but blocks the flow.

2. **Reactive style** describes _what_ should happen to data as it arrives, builds a pipeline of operators, and supports asynchrony.

3. **Push vs Pull**: Reactive code pushes events down the chain instead of pulling them through loops.

4. **Backpressure** allows you to control processing speed, ensuring stable operation under high load.

5. **Operator composition** provides expressive, declarative code, but requires some getting used to and new tools (Reactor, RxJava).
"""
