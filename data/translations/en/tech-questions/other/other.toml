[[questions]]
id = 5
question = "How do you identify and resolve performance bottlenecks in REST services and microservices under increased load?"
answer = """
| Stage/Category                              | Tool / Technique                                       | Description                                                     | Benefits                                              |
| --------------------------------------------- | -------------------------------------------------------- | ------------------------------------------------------------ | --------------------------------------------------------- |
| **1. Monitoring and detection**                 | APM (Datadog, NewRelic)                                  | Collection of CPU, memory, response time metrics                     | Quick overview of service status                          |
|                                               | Distributed tracing (Jaeger, Zipkin)            | HTTP/DB/MSG spans show “long” sections                | End-to-end call visibility                                |
|                                               | Profiling (YourKit, VisualVM)                       | CPU/Memory profiles, hot methods                              | Deep analysis of hot code                           |
|                                               | Load testing (JMeter, Gatling)               | Emulation of traffic growth, search for degradation points               | Allows you to plan scaling                     |
| **2. Local optimization**                  | Code optimization                                         | Elimination of hot loops, recomposition of algorithms           | Reduced CPU and latency consumption                       |
|                                               | Database optimization (EXPLAIN, indexes)                        | Fast SQL, correct indexes, breaking up heavy queries  | Significant acceleration of data access                 |
|                                               | Caching (HTTP, Redis, Caffeine)                      | Caching duplicate queries/computations                | Reducing the load on the database and business logic                   |
|                                               | Connection pooling (HikariCP, thread pool)               | Efficient reuse of connections and threads           | Fewer connection delays                   |
| **3. Architectural and scalable solutions** | Asynchrony and queues (Kafka, RabbitMQ, `@Async`)      | Separating heavy tasks into background processes                   | Stable operation under peaks, does not block HTTP streams    |
|                                               | CQRS                                                     | Separating read and write operations into different services/models | Optimization for different loads (write vs read)           |
|                                               | Resilience (Circuit Breaker, Bulkhead, Rate Limiter) | Protection against avalanche of errors and overload                         | Improving service resilience                           |
|                                               | Horizontal scaling (Kubernetes HPA, ELB)     | Autoscaling based on load metrics                            | Automatically adding resources                        |
|                                               | Database replication and sharding                                  | Read from replicas, write to primary; horizontal sharding   | Reduced load on one database, increased throughput |
|                                               | Separation of heavy subsystems into separate services          | Separate microservices for reports, ML, file downloads      | Independent scaling and deployment                      |

"""
