[[questions]]
id = 2
question = "How do you determine an algorithm's complexity?"
answer = """
**Algorithm complexity** is a measure of **how fast the algorithm runs** or **how many resources it uses** (mainly time and memory) based on the size of the input data.

They speak in two types:

1. **Time complexity** – how many steps the algorithm performs.
2. **Space complexity** – how much memory the algorithm uses.


🔹 **How difficulty is measured**

Count the **number of operations** depending on the size of the input `n`.

- If operations depend linearly on n → **O(n)**
- If the operations are quadratic → **O(n²)**
- If constant → **O(1)**


Examples from life:

1. **O(1) - constant**

    - Withdraw money from an ATM. No matter how many accounts you have, the transaction is always the same.

2. **O(n) - linear**

    - Check every letter in your mailbox. The more letters, the longer.

3. **O(n²) - quadratic**

    - Find all pairs of friends among n people. The number of checks grows as n × n.

4. **O(log n) - logarithmic**

    - Searching for a book in a sorted library using the halving method. The more books there are, the faster the algorithm finds the one you need.
"""
source_hash = "63e64a19c779b018cd919d90655d0595c2f997d4d3270816cb659ffbe80a8c85"

[[questions]]
id = 3
question = "What is Big O notation, and why is it useful?"
answer = """
**Big O** is a **notation** used to **describe the complexity of an algorithm**, that is, **how fast or slow** an algorithm runs based on the size of its input data. This notation helps you understand **how efficiently an algorithm works** and how it will behave as the amount of data increases.

 **✅ Algorithm complexity**

**The complexity of an algorithm** is measured by how the number of operations the algorithm performs changes as the amount of input data increases. Main types of difficulty:

1. **Time Complexity** - how long the algorithm takes to complete.
2. **Space Complexity** - how much memory the algorithm uses to execute.

 **📌 Main types of difficulty in Big O:**

- **O(1)** — **Constant Complexity**  
    Execution time does not depend on the size of the input data. The algorithm runs in constant time.
    
    - Example: accessing an array element by index.
- **O(log n)** — **Logarithmic complexity**  
    The algorithm performs work that decreases each iteration depending on the size of the input data.
    
    - Example: binary search in a sorted array.
- **O(n)** — **Linear complexity**  
    Execution time is proportional to the number of elements in the data.
    
    - Example: Finding the maximum element in an array.
- **O(n log n)** — **Linear-logarithmic complexity**  
    Commonly found in efficient sorting algorithms.
    
    - Example: merge sort algorithm or quick sort (QuickSort).
- **O(n^2)** — **Quadratic complexity**  
    Execution time is proportional to the square of the size of the input data. Often found in algorithms with two nested loops.
    
    - Example: bubble sort, selection sort.
- **O(2^n)** — **Exponential Complexity**  
    Execution time increases exponentially as data size increases. This is a very inefficient algorithm.
    
    - Example: solving the knapsack problem with exhaustive search.
- **O(n!)** — **Factorial complexity**  
    Execution time increases at a factorial rate. Usually found in problems of enumerating all possible options.
    
    - Example: traveling salesman problem.

 **✅ Why do you need a big O?**

1. **Performance assessment**  
    Big O helps you **evaluate how efficient an algorithm is**. For example, an algorithm with **O(n log n)** will run faster than **O(n^2)** when the amount of data increases.
    
2. **Comparison of algorithms**  
    Using Big O, we can compare different algorithms based on their complexity and choose the most efficient one for a particular problem.
    
3. **Behavior Prediction**  
    Big O allows you to **predict how an algorithm will behave** when given large amounts of data. This is especially important on systems with heavy loads (eg databases, web applications).
    

 **📌 Example: linear search vs binary search**

4. **Linear Search** (O(n)): In the worst case, we go through all the elements of the list.
    
    ```java
    public int linearSearch(int[] arr, int target) {
        for (int i = 0; i < arr.length; i++) {
            if (arr[i] == target) {
                return i;
            }
        }
        return -1; // element not found
    }
    ```
    
5. **Binary Search** (O(log n)): For a sorted array, binary search reduces the number of elements to be checked by half each iteration.
    
    ```java
    public int binarySearch(int[] arr, int target) {
        int left = 0, right = arr.length - 1;
        while (left <= right) {
            int mid = left + (right - left) / 2;
            if (arr[mid] == target) return mid;
            if (arr[mid] < target) left = mid + 1;
            else right = mid - 1;
        }
        return -1; // element not found
    }
    ```
    

**Why is binary search faster**?  
Binary search runs in **O(log n)**, and linear search in **O(n)**. This means that as the array size increases, binary search will be **significantly faster**.

 **📌 Bottom line**

✅ **Big O** is used to **describe the complexity of algorithms** and helps understand how an algorithm behaves as input data increases.  
✅ **Time complexity** and **space** allow you to evaluate how efficiently the algorithm works.  
✅ **Importance**: helps you choose the **most efficient algorithm** for a specific task and predict its behavior when faced with large amounts of data.
"""
