[[questions]]
id = 7
question = "What is reflection used for?"
answer = """
Reflection in Java is a powerful mechanism that allows you to “look” inside classes and objects during program execution, as well as dynamically create instances, call methods, and get/change field values without knowing their names at compile time.

**Why do you need Reflection**

1. **Frameworks and Libraries**  
   Many frameworks (Spring, Hibernate, JUnit) use Reflection to automatically scan classes, create beans, inject dependencies, call annotated methods, etc.

2. **Plugins and modules**  
   Allows you to load and use "plugins" (classes) that were not initially visible in your code. You can dynamically load JARs, find the necessary classes in them and call methods in them.

3. **Tools and Utilities**  
   Testing, serialization/deserialization tools (Jackson, Gson), mappers (MyBatis) use Reflection to automatically traverse object fields and map them to JSON, XML or SQL string.

4. **Diagnostics and debugging**  
   Allows you to read private fields or call private methods in debugging or logging mode to find out the state of an object or execute some hidden code.



**Use example**

```java
public class Person {
    private String name;
    private int age;

    private void greet(String prefix) {
        System.out.println(prefix + ", my name is " + name + ", me " + age + " years");
    }
}

// ------------------------

Class<?> clazz = Class.forName("com.example.Person");
Object person = clazz.getConstructor().newInstance();

// Setting the fields name and age
Field nameField = clazz.getDeclaredField("name");
nameField.setAccessible(true);
nameField.set(person, "Alexey");

Field ageField = clazz.getDeclaredField("age");
ageField.setAccessible(true);
ageField.set(person, 30);

// Calling a private method greet
Method greet = clazz.getDeclaredMethod("greet", String.class);
greet.setAccessible(true);
greet.invoke(person, "Hello");
```

In this example we:

1. Load the class `Person` by name.
2. We create an instance of it without directly calling the constructor.
3. We change the private fields `name` and `age`.
4. Call the private method `greet`.

"""
