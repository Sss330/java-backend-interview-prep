[[questions]]
id = 9
question = "What are the main testing annotations?"
answer = """
Basic JUnit 5 Annotations

| Abstract            | Purpose                                                                         |
| -------------------- | ---------------------------------------------------------------------------------- |
| `@Test`              | Designates a method as a test method                                                      |
| `@BeforeEach`        | The method is executed **before each** test                                          |
| `@AfterEach`         | The method is executed **after each** test                                          |
| `@BeforeAll`         | Executed **once before all tests** (must be `static`)                |
| `@AfterAll`          | Executed **once after all tests** (should be `static`)                  |
| `@DisplayName`       | Assigns a convenient name to the test and is displayed in reports                                |
| `@Disabled`          | Disables the test (temporarily skips)                                               |
| `@Nested`            | Allows you to group tests into nested classes                                   |
| `@Tag`               | Marks a test with a specific tag (convenient for filtering)                           |
| `@ParameterizedTest` | Used for **parameterized tests** (with different inputs)                  |
| `@Order`             | Order of execution of test methods                                                |
| `@TestMethodOrder`   | Strategy for determining the running sequence of test methods for the entire class |

```java
import org.junit.jupiter.api.*;
import org.junit.jupiter.params.ParameterizedTest;  
import org.junit.jupiter.params.provider.ValueSource;


@TestMethodOrder(MethodOrderer.OrderAnnotation.class)  
public class UserServiceTest {  
  
    @BeforeAll  
    static void initAll() {  
        System.out.println("Before all tests");  
    }  
  
    @BeforeEach  
    void init() {  
        System.out.println("Before each test");  
    }  
  
    @Order(3)  
    @Test  
    @DisplayName("Verifying user registration")  
    void testUserRegistration() {  
        Assertions.assertEquals(2, 1 + 1);  
    }  
  
    @Order(1)  
    @Test  
    @Disabled("Temporarily disabled")  
    void disabledTest() {  
        Assertions.fail("This test will fail");  
    }  
  
    @Order(2)  
    @ParameterizedTest  
    @ValueSource(strings = {"admin", "user", "guest"})  
    void testRoles(String role) {  
        Assertions.assertTrue(role.length() > 0);  
    }  
  
    @Nested  
    class NestedTestClass{  
        @Test  
        @Tag("any")  
        void nestedTest() {  
            Assertions.assertTrue("1" == "1");  
        }  
    }  
  
    @AfterEach  
    void tearDown() {  
        System.out.println("After each test");  
    }  
  
    @AfterAll  
    static void tearDownAll() {  
        System.out.println("After all tests");  
    }  
}
```

Display after startup:

{{< figure src="/java-backend-interview-prep/junit-test-run.png" title="" >}}
"""
