[[questions]]
id = 45
question = "How are dependencies managed in Spring Boot?"
answer = """
Spring Boot uses Maven or Gradle to automatically add, update and compatibility libraries
1. **Spring Boot Starter Dependencies** - groups of dependencies that include everything necessary to work with certain functionality
2. **Spring Boot Dependency Management:**
    - uses BOM (Bill of Materials) for dependency versioning
    - Dependency versions are defined in the parent POM (`spring-boot-dependencies`), which ensures they are compatible
    ```xml
    <parent>
        <groupId>org.springframework.boot</groupId>
        <artifactId>spring-boot-starter-parent</artifactId>
        <version>3.0.0</version>
    </parent>
    ```
\t- in Gradle the `io.spring.dependency-management` plugin is used for this
3. **Dependency Profiles** - you can include dependencies based on the runtime (e.g. dev, test, prod) using Maven profiles
4. **Explicitly specifying the dependency** - Spring Boot allows you to override the dependency version if a specific one is required
"""
source_hash = "d8dfa714dbcf9598027dc0413ee949d25673729d98c83caef0267cfbe369cd7e"

[[questions]]
id = 46
question = "How should user passwords be stored with Spring Security?"
answer = """
Hashing is used to store passwords - the original string is converted into a hash using cryptographic algorithms (recovering the original text is extremely difficult or impossible), and then stored in a database.

**How to store password in Spring Security?**
1. Hashing with BCrypt - Spring Security provides support for the BCrypt algorithm, which is suitable for hashing passwords
```java
    @Bean
    public PasswordEncoder passwordEncoder() {
        return new BCryptPasswordEncoder();
    }
```
When saving your password:
```java
    @Autowired
    private PasswordEncoder passwordEncoder;
    
    public void saveUser(String rawPassword) {
        String hashedPassword = passwordEncoder.encode(rawPassword);
        // Saving hashedPassword in the database
    }
```
    
2. **Password check** - during authentication, the entered password is compared with a hashed value in the database
    ```java
    boolean matches = passwordEncoder.matches(rawPassword, hashedPassword);
    ```

**Why BCrypt?**
- **Protection against attacks using “rainbow tables”** - BCrypt automatically adds a random “salt” to each password so that the same passwords have different hashes
- **Slowdown** - BCrypt has the ability to adjust the complexity (work factor), which increases the hash calculation time, making attacks more difficult

Comparison with other modern hashing algorithms

| Algorithm | CPU-hard | Memory-hard | GPU resistance | Popularity              |
| -------- | -------- | ----------- | -------------- | ------------------------- |
| BCrypt   | Yes       | No         | average        | very high             |
| PBKDF2   | Yes       | No         | weaker         | enterprise/FIPS           |
| Argon2   | Yes       | No         | high        | modern best practice |
"""
source_hash = "09b4b65658a8b13bd0fe9d7dc107047f6ace9ca0dec6a64baebb3af45c52f0e7"

[[questions]]
id = 47
question = "How do Spring profiles work?"
answer = """
Spring profiles allow you to load different settings and components depending on your environment (development, testing, production)

**How to install a profile?**
1. In `application.properties/yml`
```yaml
spring:
  profiles:
    active: dev
```
2. Via JVM arguments (`-Dspring.profiles.active=prod`)
You can transfer the profile at startup:
```bash
java -jar myapp.jar --spring.profiles.active=prod
```

**How to create different settings for profiles?**
1. Miscellaneous files `application-{profile}.properties`
\t- `application-dev.properties`
\t- `application-prod.properties`
\t- `application-test.properties`

2. Using `@Profile` in code
```java
@Component
@Profile("dev")
public class DevDataSource implements DataSourceConfig {
    @Override
    public void setup() {
        System.out.println("DEV database setup");
    }
}

@Component
@Profile("prod")
public class ProdDataSource implements DataSourceConfig {
    @Override
    public void setup() {
        System.out.println("PROD database setup");
    }
}
```
If the profile `dev` is active, then `DevDataSource` will be created; otherwise, `ProdDataSource` will be created. You can combine profiles using the operators `&, |, !,` (AND, OR, and NOT), for example:
```java
@Component
@Profile("prod & some-other-profile")
public class ProdDataSource implements DataSourceConfig {
\t...
}
```
`
*Note: There is also the `@IfProfileValue` annotation, however it only applies to test classes or test class methods. Allows you to enable/disable the execution of specific tests depending on the environment settings, i.e. not directly related to Spring* profiles
```java
@IfProfileValue(name = "java.vendor", value = "Oracle Corporation")
 public void testSomething() {
     // ...
 }
```
"""
source_hash = "59b0620cacde91ec0ec340b7849dd87198132c3d1a04b0bc0ce68e833b696354"

[[questions]]
id = 48
question = "What types of proxies does Spring use?"
answer = """

Spring uses dynamic proxying to create AOP wrappers around beans.

|**Proxy type**|**Description**|**How is it created?**|
|---|---|---|
|**JDK Dynamic Proxy**|Uses `java.lang.reflect.Proxy`|Creates a proxy that implements interfaces|
|**CGLIB Proxy**|Uses `org.springframework.cglib.proxy`|Creates a subclass of the target class|

AspectJ is not a separate type of proxy. This is a separate AOP mechanism that uses bytecode weaving.

**JDK Dynamic Proxy (`java.lang.reflect.Proxy`)**

- Used for objects that implement interfaces.
    
- Creates a proxy class that implements the target object's interfaces.
    

```java
public interface Service {
    void doWork();
}

public class ServiceImpl implements Service {
    public void doWork() {
        ...
    }
}
```

Creating a dynamic proxy manually:

```java
Service target = new ServiceImpl();

Service proxy = (Service) Proxy.newProxyInstance(
    Service.class.getClassLoader(),
    new Class[]{Service.class},
    (proxyObj, method, args) -> {
        System.out.println("Logging before calling a method...");
        return method.invoke(target, args);
    }
);

proxy.doWork();
```

**CGLIB Proxy (`org.springframework.cglib.proxy`)**

- Used to proxy classes.
    
- Creates a subclass of the original class.
    
- Can be used even if the class implements an interface, as long as class-based proxy is explicitly enabled.
    

```java
class UserService {}

class UserService$$SpringCGLIB extends UserService {}
```

Creating CGLIB-proxy manually:

```java
Enhancer enhancer = new Enhancer();
enhancer.setSuperclass(ServiceImpl.class);

enhancer.setCallback((MethodInterceptor) (obj, method, args, proxy) -> {
    System.out.println("Logging before calling a method...");
    return proxy.invokeSuper(obj, args);
});

ServiceImpl proxy = (ServiceImpl) enhancer.create();
proxy.doWork();
```

You cannot proxy:

- `final` classes
    
- `final` methods
    
- `private` methods
    

**CGLIB vs Dynamic Proxy**

|**Function**|**JDK Dynamic Proxy**|**CGLIB Proxy**|
|---|---|---|
|**Where does he work?**|Through interfaces|Through inheritance from a class|
|**How is it created?**|`java.lang.reflect.Proxy`|`org.springframework.cglib.proxy.Enhancer`|
|**Working principle**|Proxy implements interfaces|Proxy is a subclass of the target class|
|**Restrictions**|Calls are proxied through interfaces|You cannot proxy the `final` class, `final` and `private` methods|

The performance difference between JDK Dynamic Proxy and CGLIB is usually insignificant and is not the main selection criterion.

Hibernate and Mockito use Byte Buddy to generate and modify classes at runtime. Spring AOP uses JDK Dynamic Proxy and CGLIB.

**What is the default proxy in the Spring Framework?**

If the bean being proxied implements the interface, the default is JDK Dynamic Proxy. If there is no interface - CGLIB.

**When is CGLIB used?**

- If the class does not implement the interface
    
- If class-based proxy is explicitly enabled:
    
    - `@EnableAspectJAutoProxy(proxyTargetClass = true)`
        
    - `spring.aop.proxy-target-class=true`
        

Important: in Spring Boot, class-based proxy (CGLIB) is used by default for AOP, since `spring.aop.proxy-target-class=true`.
"""
source_hash = "23075b7e74316d12e06fd8c26b3c79828a0fbdc7a5060da534de9d5f0a2e273d"

[[questions]]
id = 49
question = "@Lookup"
answer = """
`@Lookup` is an annotation in Spring that allows a `singleton` bean to obtain a new instance of the `prototype` bean each time a method is called. Without `@Lookup`, when a `prototype` bean is injected into `singleton`, it is created only once.

**How it works**
1. Mark a method in a singleton class with the annotation `@Lookup`
2. Spring dynamically overrides this method (via CGLIB)
3. Each time a method is called, Spring requests a new `prototype` bean from the context.

```java
@Component
@Scope("prototype")
public class PrototypeBean {
    public void doSomething() {
        System.out.println("PrototypeBean: " + this);
    }
}

@Component
public abstract class SingletonBean {

    public void process() {
        // Every time we get a new copy PrototypeBean
        PrototypeBean prototypeBean = getPrototypeBean();
        prototypeBean.doSomething();
    }

    @Lookup
    protected abstract PrototypeBean getPrototypeBean();
}
```

**Why is it necessary?**
- When you need to frequently create `prototype` objects in a `singleton` bean
- To avoid using `ApplicationContext.getBean()` manually
- To avoid memory leaks (prototypes do not live forever inside a singleton)
"""
source_hash = "521908dbc783f0ff580d42679f718cc035de47b4e79ebcde0249c9c14be5c412"

[[questions]]
id = 50
question = "How does BeanPostProcessor work, and why are there callbacks before and after initialization?"
answer = """
In Spring, `BeanPostProcessor` is a special interface that allows you to “intercept” the beans created by Spring and modify them before and after its initialization.

```java
public interface BeanPostProcessor {

    // Called before any execution init-bean methods (@PostConstruct, InitializingBean.afterPropertiesSet, init-method)
    Object postProcessBeforeInitialization(Object bean, String beanName) throws BeansException;

    // Called after init-methods
    Object postProcessAfterInitialization(Object bean, String beanName) throws BeansException;
}
```

**Why two methods - before and after?**
1. `postProcessBeforeInitialization` allows you to prepare a bean before running its own initialization methods (`@PostConstruct`, `afterPropertiesSet`, `init-method`)
2. `postProcessAfterInitialization` is called after the bean is completely ready for use: all properties are set, init methods are executed. The most common use case is wrapping a bean in a proxy (for example, for `@Transactional`, `@Async`)

**Example of your own BeanPostProcessor**
```java
@Component
public class LoggingBeanPostProcessor implements BeanPostProcessor {

    @Override
    public Object postProcessBeforeInitialization(Object bean, String name) {
        System.out.println("Before init: " + name);
        return bean; // you can return a wrapper or another object
    }

    @Override
    public Object postProcessAfterInitialization(Object bean, String name) {
        System.out.println("After init: " + name);
        // If the bean has an annotation @MyTransactional — return proxy
        if (bean.getClass().isAnnotationPresent(MyTransactional.class)) {
            return ProxyFactory.getProxy(bean);
        }
        return bean;
    }
}
```

All registered `BeanPostProcessor` are executed in the order of their PriorityOrdered/Ordered or by default in the order of registration.

"""
source_hash = "b7f48ae085c22d6e862d9a93921b7a0c15d4b2bde866c23b0569580548fa464f"

[[questions]]
id = 51
question = "@Lazy"
answer = """
`@Lazy` is a Spring annotation that allows
- delay the creation of the bean until the first time it is used instead of loading it when the context starts
- delay dependency injection (see [[#19. Circular dependency]])

Can be applied:
- at the bean class declaration level
- at the `@Bean` method level
- at the injection point level

**How it works under the hood**
- With lazy initialization, Spring does not create the object itself, but a proxy.
- The proxy holds a reference to the bean factory and the first time any method is called, it **initializes a real object** and delegates the call to it.
- In the case of `@Lazy` above the injection point, the bean is initialized immediately, but the injection occurs later

You can apply `@Lazy` for the entire application at once, then all beans will be initialized lazily
```
spring.main.lazy-initialization=true
```
"""
source_hash = "99ea55ac121c49b51670e98162063302eb140acb15036c74e2c7f6509b5c160c"

[[questions]]
id = 52
question = "@ControllerAdvice"
answer = """
An annotation to outline common aspect logic that applies to all controllers.

**Main tasks**
- global error handling (`@ExceptionHandler`)
- general data for all controllers (`@ModelAttribute`)
- general binders (validation, conversion) via `@InitBinder`

Features
- works by default for all controllers, you can limit the area (`basePackages`, `assignableTypes`)
- For REST-API use `@RestControllerAdvice` (automatically adds `@ResponseBody`)
"""
source_hash = "5a7829768eec5a8cb5914f426edd260d3b62706720f28c1e03c988bf6d44400c"

[[questions]]
id = 53
question = "How does Spring Security work?"
answer = """
Framework for authentication and authorization. Works as a chain of filters (Servlet Filters) that intercepts every request.

**Main Components**
1. **SecurityFilterChain** - a set of filters through which each request passes. Examples of filters:
\t\t- `UsernamePasswordAuthenticationFilter` (login/password)
        - `BearerTokenAuthenticationFilter` (JWT token)
2. **Authentication** - an object representing the user after logging in:
        - `principal` (the user himself, more often `UserDetails`)
        - `credentials` (password or token)
        - `authorities` (roles/permissions)
3. **AuthenticationManager** - entry point for verifying login/password or token, delegates verification to **AuthenticationProvider**
4. **AuthenticationProvider** - specific verification logic (for example, checking a password with a database)
5. **UserDetailsService** - loads user data (by name/email), returns an object `UserDetails` with login, password and roles
6. **Authorization** - after logging in, the system checks roles/rights. Annotations used:
        - `@PreAuthorize("hasRole('ADMIN')")`
        - `@Secured("ROLE_USER")`


**Request Processing Flow**
1. The request comes to the application
2. Passes through **SecurityFilterChain**
3. A filter (for example, `UsernamePasswordAuthenticationFilter`) attempts to authenticate
4. `AuthenticationManager` calls `AuthenticationProvider`
5. `UserDetailsService` loads user, verifies password
6. If successful, `Authentication` is created and placed in **SecurityContext**
7. Next, authorization (rights/roles) is checked
8. The controller receives the request

**Configuration example (new style, Spring Security 5.7+)
```java
@Configuration
@EnableWebSecurity
public class SecurityConfig {

    @Bean
    public SecurityFilterChain filterChain(HttpSecurity http) throws Exception {
        http
            .authorizeHttpRequests(auth -> auth
                .requestMatchers("/admin/**").hasRole("ADMIN")
                .anyRequest().authenticated()
            )
            .formLogin(withDefaults())   // login/password form
            .httpBasic(withDefaults()); // basic authorization
        return http.build();
    }

    @Bean
    public UserDetailsService users() {
        UserDetails user = User.withUsername("user")
            .password("{noop}password") // {noop} = no encryption
            .roles("USER")
            .build();
        return new InMemoryUserDetailsManager(user);
    }
}
```"""
source_hash = "2c15eb9bfb40ee3320ea879c98252630b015dd0e2692a675948fd0ae796f0541"
