[[questions]]
id = 7
question = "@Qualifier vs @Primary"
answer = """
The @Primary annotation specifies the preferred bean that Spring will choose by default among multiple candidates of the same type.

The @Qualifier annotation allows you to explicitly specify which bean needs to be injected.

| **Annotation** | **Description**                                            | **When to use**                                              | **Point of reference**                                                                                   |
| ------------- | ------------------------------------------------------- | ------------------------------------------------------------------- | ---------------------------------------------------------------------------------------------------- |
| `@Primary`    | Specifies the default bean when selecting among several  | When you need a bean that is used most often                    | Where the bean is declared                                                                              |
| `@Qualifier`  | Explicitly indicates which bean to use among several | When you need to implement a specific bean, despite the presence of `@Primary` | At the location where the bean is introduced |
"""
