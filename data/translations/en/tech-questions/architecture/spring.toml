question = "What are Spring Boot starters, and what are their advantages and disadvantages?"
answer = """
Starters in Spring are ready-made sets of libraries (modules) that include all the necessary dependencies for working with specific technologies

**Pros**:
- simplified configuration
- dependency version consistency
- reduced development time
- modularity
- documentation and support
**Cons**:
- redundant dependencies
- less flexibility

**What are the differences between a starter and a library?**

| **Characteristics** | **Starter**                    | **Library**              |
| ------------------ | ------------------------------ | ------------------------ |
| **Composition**         | Includes a set of libraries       | Single library     |
| **Settings**      | Automatic                 | Requires manual configuration |
| **Example**         | `spring-boot-starter-data-jpa` | `hibernate-core`         |
"""
