[[questions]]
id = 8
question = "What is a Spring bean?"
answer = """
A Bean in Spring is an object managed by the Spring IoC container. This is the basic building block of the application that is registered and configured by the container

---

**@Bean annotation**

The `@Bean` annotation is used to specify a method that returns an object (bean) and these beans can later be injected into other components. Used to explicitly declare a bean in the Java configuration (in a class labeled `@Configuration`)

You can also use default methods to define beans. This allows you to create bean configurations by implementing interfaces with bean definitions
```java
public interface BaseConfig {
    @Bean
    default TransferServiceImpl transferService() {
        return new TransferServiceImpl();
    }
}
@Configuration
public class AppConfig implements BaseConfig {
}
```

---

 **What is BeanDefinition?**

BeanDefinition is metadata (bean description) indicating how a particular bean should be created, configured and managed
It contains:
- Bean class
- Its scope
- Dependencies
- Initialization and destruction methods

---

**How does Spring create beans?**

- **Read configuration** - Spring reads configuration from `@Configuration`, XML or annotations on classes
- **Create BeanDefinition** - based on the configuration, Spring generates a **BeanDefinition** for each bean
- **Bean initialization:**
    - a constructor or factory method is called
    - dependency injection is performed (via constructor, fields or setters)
- **Setting up a bean** - post-processing via `BeanPostProcessor` (for example, to work with `@PostConstruct`)
- **Adding to container** - the finished bean is placed in `ApplicationContext`

---

**How is the bean configured?**

1. Annotations (`@Bean`, `@Component`, `@Value`, `@Scope`)
2. XML configuration
3. Java code (in class with `@Configuration`)
4. Tools like `@PostConstruct` and `@PreDestroy` for life cycle management

---

**Can I insert a Bean into a static field?**

No, Spring does not directly support dependency injection on static fields. The solution is to use a setter or call the context via `ApplicationContext`

---

**How to lazily initialize a bean?**

Use annotation `@Lazy`
"""
source_hash = "176cfa78bc7056c9e81dc8b9e2b220a2ffd8b467b8e0da8e22652d44106e17b5"

[[questions]]
id = 9
question = "What bean scopes does Spring support, including web scopes?"
answer = """
- Singleton
    - For each bean, only one instance is created for the entire application context and reused wherever it is required
    - Used by default
    - The bean's life cycle begins when the context is loaded and ends when it terminates.
- Prototype
    - Each time a bean is requested, a new instance is created
    - Beans with scope `prototype` are not destroyed by Spring, since they leave its control immediately after creation
    - NOT STORED in the Spring context
- Web scope:
\t- request - one bean instance is created for each HTTP request
\t- session - one bean instance is created for each HTTP session
\t- application - one bean instance is created for the entire `ServletContext` (similar to a singleton, but for a web application)
\t- websocket - one bean instance is created for each WebSocket session


**How to create your own Scope**
1. Implement the Scope interface
```java
public class CustomScope implements Scope {
    private Map<String, Object> beans = new HashMap<>();

    @Override
    public Object get(String name, ObjectFactory<?> objectFactory) {
        return beans.computeIfAbsent(name, k -> objectFactory.getObject());
    }

    @Override
    public Object remove(String name) {
        return beans.remove(name);
    }
    // other methods...
}
```

2. Register it in context:
```java
@Bean
public static CustomScopeConfigurer customScopeConfigurer() {
    CustomScopeConfigurer configurer = new CustomScopeConfigurer();
    configurer.addScope("customScope", new CustomScope());
    return configurer;
}
```
"""
source_hash = "202a15aaf5324f2da63f0dd5f8f96a268b058b0a4187fa9a88c031befa38dbc1"

[[questions]]
id = 10
question = "How can a singleton bean obtain a new prototype bean instance on each call?"
answer = """
1. **Implementation of `ObjectProvider` (or `ObjectFactory`)**
```java
@Component
@Scope("singleton")
public class MySingletonService {

    private final ObjectProvider<MyPrototypeBean> prototypeProvider;

    public MySingletonService(ObjectProvider<MyPrototypeBean> prototypeProvider) {
        this.prototypeProvider = prototypeProvider;
    }

    public void doWork() {
        // every call is a new bean
        MyPrototypeBean prototype = prototypeProvider.getObject();
        prototype.action();
    }
}
```
Pros:
- simple, no need for AOP proxy  
Cons:
- depends on Spring API, harder to test out of context

2. **`@Lookup`-method (injection method)**
```java
@Component
@Scope("singleton")
public abstract class MySingletonService {

    public void doWork() {
        MyPrototypeBean prototype = createPrototype();
        prototype.action();
    }

    @Lookup
    protected abstract MyPrototypeBean createPrototype();
}

@Component
@Scope("prototype")
public class MyPrototypeBean {
    public void action() { … }
}
```
Spring generates a subclass that overrides `createPrototype()` and calls `getBean(...)`
Pros:
- no explicit providers in the code   
Cons:
- less obvious, relies on subclass generation

3. **Proxy bean (`proxyMode = TARGET_CLASS`)**
```java
@Component
@Scope(value = "prototype", proxyMode = ScopedProxyMode.TARGET_CLASS)
public class MyPrototypeBean { … }

@Component
@Scope("singleton")
public class MySingletonService {
    private final MyPrototypeBean prototype;  // this is a proxy

    public MySingletonService(MyPrototypeBean prototype) {
        this.prototype = prototype;
    }

    public void doWork() {
        prototype.action(); // each time the proxy is called, it will pick up a new instance
    }
}
```
Pros:
- automatic proxying, code remains simple  
Cons:
- proxy wrapper, possible problems with method navigation, `instanceof`, need to proxy the class

4. **Obtained from `ApplicationContext`**
```java
@Component
public class MySingletonService {

    @Autowired
    private ApplicationContext ctx;

    public void doWork() {
        MyPrototypeBean prototype = ctx.getBean(MyPrototypeBean.class);
        prototype.action();
    }
}
```
Pros:
- universal method for any beans  
Cons:
- direct dependence on context, less clean code

**Problems and nuances**
1. **Implicit layer mixing** - Injecting context or provider into business code can make testing difficult
2. **Multiple implementations** - if there are several `MyPrototypeBean` (for example, `FastPrototype`, `SlowPrototype`), you need to clarify:
```java
public MySingletonService(
        @Qualifier("fastPrototypeBean") ObjectProvider<MyPrototypeBean> fastProvider) { … }
```
3. **Destroying prototype beans** - the container itself does not call `@PreDestroy` on prototype beans. If they have resources, you will have to clear them manually
4. **Proxies and AOP** - when using `proxyMode`, methods marked `final` or `private` are not proxied. This may break logic
5. **Serialization** - if a singleton bean is serialized, proxying references to the prototype bean can cause problems during deserialization
"""
source_hash = "c312cfc2bd29a1b5426af6f01647f5f90f7b860eb192fc81f3dada0d6fa76d9f"

[[questions]]
id = 11
question = "Describe the Spring bean lifecycle and the classes involved."
answer = """
Spring manages the creation, initialization, and destruction of beans within the IoC container. This life cycle can be divided into several stages

{{< figure src="/java-backend-interview-prep/spring_bean_lifecycle.png" title="" >}}

1. **Parsing configurations, scanning annotations and creating BeanDefinition**
    Spring (BeanDefinitionReader) looks for classes that are marked with annotations indicating that they are (or contain) beans. These annotations include:
    `@Component`, `@Service`, `@Repository`, `@Controller`, `@Configuration`
    Spring scans for classes in packages specified with the `@ComponentScan` annotation, or in the package containing a class with the `@SpringBootApplication` annotation. The found classes are parsed and a BeanDefinition is created for them
    `BeanDefinition` is a special interface through which you can access the metadata of the future bean. Depending on the configuration, one or another configuration parsing mechanism will be used. All of them add up to `ConcurrentHashMap`, in which the key is the name of the bean, and the object itself is `BeanDefinition`. When the application starts, the IoC container will contain beans that have a Singleton scope, and the rest will be created when they are needed. First, all `@Configuration` are registered for further parsing

2. **Configuring created BeanDefinition** 
   It is possible to influence beans before they are created. For this, there is an interface `BeanFactoryPostProcessor`, by implementing which we get access to the created `BeanDefinition` and can change them using the `postProcessBeanFactory` method.

3. **Instantiating beans** 
   First, from the map with `BeanDefinition`s, the beans necessary to configure other beans are taken, and then the rest (recursive dependency resolution). The creation is carried out by `BeanFactory` (calls the constructors), but you can delegate this to a factory that implements the `FactoryBean` interface

4. **Dependency Injection (via fields and setters)**
5. **Setting up created beans** 
   The beans have already been created, they can be further configured. The `BeanPostProcessor` interface allows you to get involved in the process of setting up beans before they get into the container. The context automatically detects beans that implement this interface and marks them. There are two methods
    - `postProcessBeforeInitialization` is called before the init method
    - `postProcessAfterInitialization` - after
        
    First, the `postProcessBeforeInitialization()` method of all available `BeanPostProcessor`s will work. Then, if available, the `init` method will be called.
    In spring, if one of `BeanPostProcessor` changes something in the class (including adding proxying), he must do it at the stage after `init`. Therefore, `init` always works on the original method before proxying.
        At the end the beans will pass through `postProcessAfterInitialization()`.
        
        _Note: if the bean implements_ `InitializingBean`_, then Spring will call the_ `afterPropertiesSet()` _method before the init method. The interface is not recommended for use as it is outdated_
    
6. **Beans have been created** At this stage they can be obtained using the `ApplicationContext.getBean()` method
    
7. Closing the context** 
   When the context is closed, the bean is destroyed. If a bean has a `@PreDestroy` method, then it will be called before the bean is destroyed. If the destroyMethod method is defined in `@Bean`, then it will also be called
"""
source_hash = "3b512d496b203432ea473307d8a3eff1a251e8c8e01987cc8917b12c5690c551"

