[[questions]]
id = 23
question = "Spring Data JPA"
answer = """
Spring Data JPA is a Spring module that makes working with JPA (Java Persistence API) easy and provides convenient ways to access data. Thanks to autoconfiguration, it allows developers to focus on business logic without worrying about low-level data access details
"""
source_hash = "4f148c902404700b62151bf4a1bef486792d7b79020ab6b6335abedbc0ebc229"

[[questions]]
id = 24
question = "What is the default locking behavior in Spring?"
answer = """
Spring, by default, uses optimistic locking to manage concurrency on data access. This means that when updating entities, it is assumed that no conflicts will occur and changes are made to the database without locking
"""
source_hash = "12c5dae6ce4b84a64f6468bd6764e977048893779a57e6a2174594b109635ce7"

[[questions]]
id = 25
question = "How does @Transactional work?"
answer = """
`@Transactional` is an annotation that allows you to automatically manage transactions. When a method is annotated `@Transactional`, Spring takes over the start, commit, or rollback of the transaction

---
***What can be annotated with @Transactional?***

- Class. All his methods will become `@Transactional` 
- Method

---
***Default propagation***

Propagation.REQUIRED


---
***What methods of managing transactions in Spring do you know?***

- The annotation `@Transactional`
- TransactionManager
- TransactionTemplate

*TransactionManager* and *TransactionTemplate*

- When precise control over transactions is required (for example, managing multiple transactions in a single thread)

*@Transactional*

- When you need simple transaction management
- When a transaction does not require complex control logic

---
***@Transactional hang on private method?***

If you put the `@Transactional` annotation on the `private` method, then no transaction will be created or applied because Spring uses a proxy mechanism to manage transactions.

"""
source_hash = "de20b1869f6fcc85ee6079850eec195c091df93865cdfea48331c8b10d0a3586"

[[questions]]
id = 26
question = "What are the attributes of @Transactional?"
answer = """

| **Attribute**     | **Description**                                                                                 | **Default value** |
| --------------- | -------------------------------------------------------------------------------------------- | ------------------------- |
| `propagation`   | Determines whether to create a transaction (create a new one or use an existing one) | `REQUIRED`                |
| `isolation`     | Transaction isolation level (how to manage concurrency)                            | `DEFAULT`                 |
| `readOnly`      | Read-only (does not allow data to be modified)                                             | `false`                   |
| `timeout`       | Maximum execution time (in seconds)                                                   | -1 (infinite)           |
| `rollbackFor`   | Lists the exceptions under which rollback is made                                        | Empty                     |
| `noRollbackFor` | Exceptions under which rollback is not performed                                                 | Empty                     |
"""
source_hash = "a0325f1df993aee97ae7e09997f90ee56ed8ad6e625daf4fdda78abd6094067d"

[[questions]]
id = 27
question = "@Transactional propagation attribute"
answer = """
The `propagation` attribute determines whether to create a transaction (create a new one or use an already open one). Possible values:
- **REQUIRED** - applied by default. When entering the `@Transactional` method, an existing transaction will be used or a new one will be created, if there is no 
- **SUPPORTS** - the method will be executed within a transaction, if it exists. If it is not present, the method will be executed without a transaction
- **MANDATORY** - requires an external transaction, otherwise it throws an exception
- **REQUIRES_NEW** - a separate transaction is created for the internal method. While the internal method is executing, the external transaction is suspended. The result of executing the internal one will not affect the result of executing the external one.
- **NOT_SUPPORTED** - The method is always executed outside of a transaction, even if there is a current transaction. The current transaction is suspended
- **NEVER** - prohibits execution of a method in a transaction, throws an exception if a transaction exists
- **NESTED** - creates a subtransaction inside the main transaction. This subtransaction can be rolled back separately from the main transaction, but is dependent on the successful completion of the main transaction. If the main transaction rolls back, the subtransaction will also roll back, even if it completed successfully
"""
source_hash = "eff550d83323d77600d408b56932e962539deda86aac1ae0d4273b886853cd17"

[[questions]]
id = 28
question = "What happens when a method calls another @Transactional method in the same class?"
answer = """
If you call a method labeled `@Transactional` from another method of the same class, then the **transaction will not start or be honored** if the call is made directly. Because the call inside the class **does not go through the proxy** which is responsible for managing the transaction. Therefore, the annotation `@Transactional` will not be processed
```java
@Service
public class MyService {

    @Transactional
    public void transactionalMethod() {
        // The transaction is activated if the call is through a proxy
    }

    public void callTransactionalMethod() {
        transactionalMethod(); // Direct call, transaction is NOT activated
    }
}
```

**How to fix?**
1. **Use call through another bean**
If a transactional method is called from another bean, the call will go through the proxy and the transaction will be activated
```java
@Service
public class MyService {

    @Transactional
    public void transactionalMethod() {
        // Transaction is activated
    }
}

@Service
public class AnotherService {

    @Autowired
    private MyService myService;

    public void callMethod() {
        myService.transactionalMethod(); // Call through proxy, transaction is activated
    }
}
```

2. **Use self-injection**
A special case of the previous point is the implementation of a bean into itself
```java
@Service
public class MyService {

    @Autowired
    private MyService self;

    @Transactional
    public void transactionalMethod() {
        // Transaction is activated
    }

    public void callTransactionalMethod() {
        self.transactionalMethod(); // Call through proxy, transaction is activated
    }
}
```
_Note: Since version 2.6, Spring Boot prohibits creating circular dependencies. For the above code to work, you need to set the_ `spring.main.allow-circular-references=true` property
_In the case of implementation through a constructor, even this will not help. There are several alternative options for self-injection, one of them is receiving the bean through ApplicationContext_
```java
@Service
public class MyService implements ApplicationContextAware {
    private ApplicationContext context;

    @Override
    public void setApplicationContext(ApplicationContext context) throws BeansException {
        this.context = context;
    }

    @Transactional
    public void transactionalMethod() {
        // Transaction is activated
    }

    public void callTransactionalMethod() {
\t\t    // Call through proxy, transaction is activated
\t\t    context.getBean(MyService.class).transactionalMethod() 
    }
}
```
"""
source_hash = "017a531e281846fd1e6a6edd1c1b0a16568eb25bf4546a29112e63c15cc940cc"

[[questions]]
id = 29
question = "How are changes to entities loaded in a @Transactional method persisted?"
answer = """
- `@Transactional` on the service guarantees that all changes to managed entities will be automatically saved upon commit (dirty checking)
- There is no need to call `save()` for already loaded entities - only for new or detached ones (`merge()` under the hood)
- `flush()` allows you to merge changes into the database ahead of schedule if an intermediate result is required (generated value, early check constraints)
- To read, use `readOnly=true` - this speeds up execution
- Monitor the correctness of the `propagation` and `isolation` attributes to avoid unexpected rollbacks and blocking
"""
source_hash = "2391fffe864fa19e40ee43dd153d4554668ee4e39534e8a5fdb6ccd1e43d6922"

[[questions]]
id = 30
question = "How do exceptions affect @Transactional?"
answer = """

| Situation                                                                                                              | Will the transaction be rolled back?   | Reason                                              |
| --------------------------------------------------------------------------------------------------------------------- | ---------------------------- | ---------------------------------------------------- |
| Dropped by `RuntimeException`                                                                                          | Yes                           | Spring rollbacks by default                       |
| Dropped by `Error`                                                                                                     | Yes                           | Regarded as a critical error                 |
| Dropped `Checked Exception` (`Exception`, `IOException`, etc.)                                                      | No                          | Spring does NOT rollback checked exceptions by default |
| Checked exception + `rollbackFor=Exception.class`                                                                     | Yes                           | You clearly indicated which exceptions to rollback for.      |
| RuntimeException + noRollbackFor=RuntimeException.class                                                               | No                          | You have disabled rollback for this exception.          |
| Exception caught (try/catch) and not forwarded                                                                 | No                          | Spring sees that the method completed “successfully”         |
| Exception caught but `TransactionAspectSupport`<br>`.currentTransactionStatus()`<br>`.setRollbackOnly()` called | Yes                           | Manual rollback pointer                              |
| Method private / final / static                                                                                        | @Transactional won't work | Proxy can't wrap method                       |
| Calling a method inside the same class                                                                                    | @Transactional won't work | Self-invocation - no proxy is used             |
| Method called via spring bean                                                                                        | Yes                           | Proxy intercepts the call                           |
"""
source_hash = "1b9fd63f304b57480816d06ff87408fd89ce847f73d7b6845fd32afbca9aa81f"

[[questions]]
id = 31
question = "@Async"
answer = """
The `@Async` annotation is used in Spring to execute methods **asynchronously**, that is, in a separate thread, so as not to block the main thread of execution

**Features:**
- a method marked with the `@Async` annotation is executed in a separate thread
- the return type can be `void`, `Future`, or `CompletableFuture`
- works through a proxy, so calling such a method should occur in the bean, and not inside the class
- asynchronous calls use a thread pool. The default pool is `SimpleAsyncTaskExecutor`, but you can specify your own `Executor` or `TaskExecutor` through a single annotation parameter
"""
