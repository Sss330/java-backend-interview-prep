[[questions]]
id = 3
question = "Dependency Injection"
answer = """
Dependency Injection is a mechanism for providing an object with its dependencies from the outside (instead of the object creating them itself). DI simplifies dependency management and makes code more modular, testable, and easily extensible

**Dependency Injection vs dependency lookup**

| **Criterion**              | **Dependency Injection**                                         | **Dependency Lookup**                                     |
| ------------------------- | ---------------------------------------------------------------- | --------------------------------------------------------- |
| **Essence**                  | Dependencies are provided externally (by the container or framework)  | The object itself requests dependencies (usually from the context)    |
| **Easy to test** | Easier to test, dependencies can be replaced with mock objects     | Requires mocking context or factory for tests      |
| **Level of control**      | The container manages dependencies, the object does not create them          | The object decides how to obtain dependencies               |
| **Example**                | Spring injects dependency via annotations or XML configuration | Manually calling the method<br>`ApplicationContext.getBean(...)` |

The @Lookup annotation above a method allows you to use Dependency Lookup
```java
@Lookup
public WeatherService getWeatherServiceBean() {
\treturn null;
}
```

Under the hood spring does
```java
@Lookup
public WeatherService getWeatherServiceBean(){
\treturn applicationbContext.getBean(WeatherService.class);
}
```

**When is the setter injection method useful?**
- Optional dependencies - a dependency is not required for the object to function and is only used in some scenarios
- Dynamic dependency changing - when you need to change a dependency during program execution
- Libraries or legacy code - for integration with code where the object creation process cannot be controlled
"""
source_hash = "872632befd9b7a9953809df81cf03b86faa211dfde9e129df4c7f74cfa507626"

[[questions]]
id = 4
question = "What forms of dependency injection are available?"
answer = """
- Through the constructor
- Via setter
- Through the field

| **Method**             | **Description**                                                               | **Pros**                                                                                     | **Cons**                                                                                                                                                   | **Usage Examples**                                    |
| ---------------------- | -------------------------------------------------------------------------- | --------------------------------------------------------------------------------------------- | ------------------------------------------------------------------------------------------------------------------------------------------------------------ | ------------------------------------------------------------ |
| **Through the constructor**  | Dependencies are passed when an object is created                                | - Immutability Guarantee - Mandatory dependencies are clearly visible - Highly testable | - Inconvenient for a large number of dependencies <br>- Not suitable for optional dependencies                                                                  | When dependencies are required and do not change after creation |
| **Via setter**       | Dependencies are installed using a method after the object is created        | - Suitable for optional dependencies <br>- Dependencies can be changed at runtime          | - It is possible that an object is used without a dependency installed (NPE) <br>- Less explicit                                                        | When dependencies are optional or subject to change           |
| **Through the fields** | Dependencies are injected directly into object fields, usually using annotations | - Minimum code - Easy to use frameworks (Spring, CDI)                        | - It is possible that an object is used without an installed dependency (NPE) <br>- More difficult to test <br>- Violation of the principle of explicit dependencies | Quick implementation in Spring via `@Autowired`                |
"""
source_hash = "eb72d8d2f2363b6d7a8ae9a081cb8972d2816fa3289193d0feb4e4975f1a73a0"

[[questions]]
id = 5
question = "Why is constructor injection usually preferred?"
answer = """
- Immutability - dependencies are set once when the object is created, and cannot be changed (via final fields)
- Mandatory dependencies - establishes a clear requirement that the object cannot exist without the passed dependencies
- Testability - it’s easier to create mock objects for tests
- Explicitness - it is clear what dependencies are required for the operation of the object
"""
source_hash = "322ee4d3a7aa350fef85833535427030268526ad78abb90251d6bbbc0f2aa8d0"

