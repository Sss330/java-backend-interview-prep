[[questions]]
id = 13
question = "@Conditional in Spring"
answer = """
The `@Conditional` annotation in Spring is used to enable beans to be connected or configurations performed only when certain conditions are met. It allows you to flexibly control the behavior of the application, including or excluding certain components


**@ConditionalOnBean**
The `@ConditionalOnBean` annotation specifies that a bean or configuration should be registered in a context only if the specific bean already exists
```java
@Configuration
public class MyConfig {

    @Bean
    public MyService myService() {
        return new MyService();
    }

    @Bean
    @ConditionalOnBean(MyService.class)
    public DependentService dependentService() {
        return new DependentService();
    }
```

**@ConditionalOnProperty**
The annotation `@ConditionalOnProperty` specifies that a bean or configuration should be registered in a context only if a certain property in the configuration file has the desired value
```
# application.properties
feature.enabled=true
```
```java
@Configuration
public class MyConfig {

    @Bean
    @ConditionalOnProperty(prefix = "feature", name = "enabled", havingValue = "true", matchIfMissing = false)
    public FeatureService featureService() {
        return new FeatureService();
    }
}
```
"""
source_hash = "f709383cfc60d43b185fb523c29105dc9265472a4f1fed2797e2197290b1d5de"

[[questions]]
id = 14
question = "@Service, @Repository, @Component"
answer = """

| **Annotation**     | **Description**                                                                                    | Application                        | **Semantics**                                                                                                                                                                        |
| ----------------- | ----------------------------------------------------------------------------------------------- | --------------------------------- | ------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------ |
| **`@Component`**  | General annotation to indicate a bean that will be managed by a Spring container        | For regular beans                 | Can be used for any types of components. Typically used when there is no more precise type                                                                               |
| **`@Service`**    | Specialization `@Component` indicating that the bean is a service layer              | For services                      | Used for classes that implement business logic. Essentially, this is a more semantic designation than `@Component`                                                                  |
| **`@Repository`** | Specialization `@Component` indicating that the bean is a data access layer (DAO) | For classes that work with data | Used for classes that encapsulate data access logic (for example, via JDBC or JPA). The annotation can also enable DAO-specific exception handling |

**Singleton anti-pattern. If we put @Service on a class, will it be a Singleton?**
Yes. However, this is not an anti-pattern, since Spring manages lifecycle and dependency injection, which solves many of the problems inherent in a regular Singleton

**@Bean vs @Component**

| **Annotation** | Place of application                  | Application                                   |
| ------------- | --------------------------------- | -------------------------------------------- |
| `@Bean`       | Above the method in the configuration class | If necessary, configure the bean programmatically |
| `@Component`  | Above class                       | For automatic scanning             |
"""
source_hash = "48c69b0ddd5f6051468dcf0bc3a5936c0af3833692a30804367923fa5ddbe9df"

