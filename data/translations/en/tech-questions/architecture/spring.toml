[[questions]]
id = 19
question = "What is a circular dependency?"
answer = """
A circular dependency is a dependency in which two beans depend on each other and therefore Spring cannot initialize them. Solution:
- annotation `@Lazy` for one of the beans
- dependency injection via a setter on one of the beans
\tSince version 2.6, Spring prohibits cyclic dependencies (and therefore such an implementation will not work without @Lazy), but this prohibition can be removed via
\t`spring.main.allow-circular-references=true`
- refactoring

For example, there are 2 services
```java
@Service
@RequiredArgsConstructor
public class OrderService {    
\tprivate final PaymentService paymentService;
...

}

@Service
@RequiredArgsConstructor
public class PaymentService {    
\tprivate final OrderService orderService;
...
}
```

To eliminate cyclic dependency, we design an intermediary service - CheckoutService
```java
@Service
@RequiredArgsConstructor
public class CheckoutService {

    private final OrderService orderService;
    private final PaymentService paymentService;

    public CheckoutService(
            OrderService orderService,
            PaymentService paymentService) {

        this.orderService = orderService;
        this.paymentService = paymentService;
    }

    public void checkout() {
        orderService.createOrder();
        paymentService.processPayment();
    }
}

@Service
@RequiredArgsConstructor
public class OrderService {    
\tpublic void createOrder() {...}
}

@Service
@RequiredArgsConstructor
public class PaymentService {    
\tpublic void processPayment() {...}
}
```"""
source_hash = "31277d00eecf8deeb541b01531800c89745e094d00c804dca72a26ea15c58461"

[[questions]]
id = 20
question = "What is Spring Boot?"
answer = """
*Spring Boot* is a Spring-based framework that makes it faster and easier to create production-ready applications. Key benefits:

- Starters are ready-made sets of libraries (modules) that include all the necessary dependencies for working with specific technologies
- Built-in server - In Spring Boot, the server is **built right into the application**. For example, when you add the `spring-boot-starter-web` starter, Spring Boot automatically includes Tomcat or Jetty
- Automatic Configuration - Spring Boot uses an **automatic configuration** mechanism that analyzes what libraries are in your project and automatically configures the necessary components.
- Simplified build - In regular Spring, to deploy an application, you need to build a WAR file and deploy it to the server. In Spring Boot, the application is compiled into an **executable JAR file**, which contains all the dependencies and the server.

---
***How Spring Boot works under the hood***

1. **Auto Configuration**:
    
    - Spring Boot analyzes the classes and dependencies in your project and tries to configure the application so that it works out of the box.
    - For example, if a project has a dependency on `spring-boot-starter-web`, then Spring Boot automatically configures `DispatcherServlet`, which handles HTTP requests.
2. **Component Scan**:
    
    - When the application starts, Spring Boot scans packages for annotated classes (for example, with annotations `@Component`, `@Service`, `@Repository`, `@Controller`, etc.) to register the beans.
    - This scan starts with a class annotated `@SpringBootApplication`, which is usually located at the root of the project. Packages and subpackages below this class will be scanned for components.
3. **Built-in server**:
    
    - Spring Boot can use built-in servers such as Tomcat, Jetty or Undertow, allowing the application to run as a self-contained executable JAR or WAR file.
4. **Initialization process**:
    
    - When the application starts, Spring Boot automatically launches and configures all the necessary components and dependencies. The entire initialization process is centralized and automated.
5. **Main class with `@SpringBootApplication`**:
    
    - This class is the entry point to the application. It performs several tasks:
        - Enables automatic configuration using `@EnableAutoConfiguration`.
        - Allows scanning of components using `@ComponentScan`.
        - Enables setting up Spring configuration using `@Configuration`.

---
***Where does Spring Boot look for beans?***

1. **Main class with `@SpringBootApplication`**:
    
    - Spring Boot starts scanning packages from the class location annotated `@SpringBootApplication`.
    - All classes in this package and its subpackages will be automatically processed for annotations to create beans (for example, `@Component`, `@Service`, `@Repository`, etc.).
2. **Package with `@SpringBootApplication`**:
    
    - By default, Spring Boot scans only the current package and its subpackages. **It is therefore important** that the main class with the `@SpringBootApplication` annotation be at the root of the package to ensure that all components are found.
3. **Additional scanning settings**:
    
    - You can explicitly specify which packages to scan using the `@ComponentScan` annotation:
 
```java
@SpringBootApplication
@ComponentScan(basePackages = "com.example.myapp")
public class MyApplication {
    public static void main(String[] args) {
        SpringApplication.run(MyApplication.class, args);
    }
}
```
        
This is useful if the components are in a different package or if you want to limit the scan area.

4. **Using profiles**:
    
    - If a project uses different profiles (for example, for different environments), Spring Boot will also look for components that match the active profile, provided they are annotated as `@Profile`."""
source_hash = "9d6fc4d4fd327b2201079d8a2c625b96653d0aac99abb7c4c6f91660882f16b0"

[[questions]]
id = 21
question = "Spring Boot vs Spring"
answer = """
- **Spring** is a core framework with full configuration and flexibility.
- **Spring Boot** is an extension to Spring that makes development easier by automating configuration and allowing you to get your application up and running quickly with minimal configuration.

|**Criterion**|**Spring**|**Spring Boot**|
|---|---|---|
|**Goal**|A powerful framework for creating Java applications.|Simplify development using Spring. Automation of configuration.|
|**Configuration**|Requires manual XML or Java configuration.|Auto-configuration, minimal settings to start a project.|
|**Launch**|You need to manually configure the web server (for example, Tomcat).|Built-in servers (Tomcat, Jetty, Undertow) for easy launch.|
|**Flexibility**|Great flexibility, full customization of each component.|Less flexibility, but much faster and easier to start a project.|
|**Difficulty**|Higher complexity of setup and configuration.|Simplified setup and configuration.|
|**Usage**|Used when full customization and control is needed.|Used for quick start and ease of development.|
|**Configuration files**|Uses XML or Java configuration to configure beans.|Uses application.properties or application.yml for configuration.|

"""
source_hash = "197314b3704d2ccbb06faf3920bb3efa363b960af640e9f4a03522da61c1f6f9"

