[[questions]]
id = 33
question = "How is the Criteria API used with Spring?"
answer = """
The Spring Criteria API (part of Jakarta Persistence/JPA) provides a flexible way to build database queries. Allows you to compose queries using Java classes

**Key Features of the Criteria API**
1. **Dynamic query construction** - convenient for situations where the query structure can change at runtime depending on conditions
2. **Type safety** - errors in query syntax are detected at compilation stage
3. **Lazy** - the query is executed only when accessing the results
4. **Support for complex queries** - subqueries, groupings, sorting, filtering and aggregate functions

**Use example**
```java
@Entity
public class Employee {
    @Id
    @GeneratedValue(strategy = GenerationType.IDENTITY)
    private Long id;
    private String name;
    private double salary;

    // getters and setters
}

@Repository
public class EmployeeRepository {

    @PersistenceContext
    private EntityManager entityManager;

    public List<Employee> findEmployeesWithSalaryGreaterThan(double minSalary) {
        // We get CriteriaBuilder
        CriteriaBuilder criteriaBuilder = entityManager.getCriteriaBuilder();

        // We create CriteriaQuery
        CriteriaQuery<Employee> criteriaQuery = criteriaBuilder.createQuery(Employee.class);

        // Root object (FROM Employee)
        Root<Employee> root = criteriaQuery.from(Employee.class);

        // Condition (WHERE salary > :minSalary)
        criteriaQuery.select(root)
                     .where(criteriaBuilder.gt(root.get("salary"), minSalary));

        // Execute the request
        return entityManager.createQuery(criteriaQuery).getResultList();
    }
}
```
"""
source_hash = "e2c2f09c98332729226ed3403bafda2701d05bbcc2d053398640885a4142b6e0"

