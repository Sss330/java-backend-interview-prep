[[questions]]
id = 35
question = "How do controllers and servlets differ in Java?"
answer = """
The concepts of servlet and controller belong to different concepts, although both are used to handle HTTP requests in Java web applications.

**Servlet** is a Java class that processes HTTP requests (HTTP GET, POST, etc.) and returns HTTP responses. It is the basis for creating server-side applications in Java

**Controller** is a part of MVC (Model-View-Controller) architecture. In a Java context, this is usually a class, annotated for example with `@Controller` in Spring MVC, that handles HTTP requests and manages their routing

The controller **abstracts the developer from low-level details** (such as dealing with HTTP requests and responses), allowing the developer to focus on business logic

**Main differences between Servlet and Controller**

| **Criterion**           | **Servlet**                                                                 | **Controller**                                             |
| ---------------------- | --------------------------------------------------------------------------- | ---------------------------------------------------------- |
| **Scope of application** | Low-level processing of HTTP requests                                      | High-level component of MVC architecture                  |
| **Handmade**      | Requires more manual work to route and process data         | Routing and processing of requests are automated        |
| **Tools**        | Uses a servlet container (e.g. Tomcat)                           | Uses web frameworks (such as Spring MVC)           |
| **Flexibility**           | Full control over HTTP requests and responses                               | Focuses on business logic, delegating details to the framework |
| **Level of Abstraction** | Low: work directly with `HttpServletRequest` and <br>`HttpServletResponse` | High: Annotations and abstraction of low-level logic |
| **Example**             | `HttpServlet`, `GenericServlet`                                             | `@Controller` in Spring, `@RestController`                  |
"""
source_hash = "20827eabf0b265a7fa44a0058330581cf13b12785daf0b7fe0f3df030b3e6119"

[[questions]]
id = 36
question = "What is a servlet Filter, and when is it invoked?"
answer = """
`Filter` is an interface from the Java Servlet API that allows you to intercept and modify HTTP requests and responses. Filters are often used for tasks that need to be performed before or after a request is processed in a servlet (or controller in the case of Spring), for example:
- Authentication and Authorization
- Logging requests
- Response compression
- Caching
- Add or change request and response headers

**When is the filter called?**
HTTP Request -> Filter chain -> DispatcherServlet -> Controller -> ... ->Response -> Filters

Filters are called **before** the HTTP request hits the DispatcherServlet (and especially the controller) and **after** the response is returned from it
- Before the controller - process the incoming HTTP request
- After - can change the HTTP response before sending it to the client

Most often, the `OncePerRequestFilter` class extension is used for custom filters
"""
source_hash = "f2b875d86c206a9e79772566e7d959b5a0f24c29393beef60a5b38528679a76d"

[[questions]]
id = 37
question = "What is ApplicationContext, and how does it work internally?"
answer = """
**`ApplicationContext`** is the central interface of the Spring container that manages the lifecycle of beans, their dependencies, and provides additional capabilities for application development. This is an extension of the **`BeanFactory`** interface that adds many additional features such as event handling, internationalization support, and AOP integration.

 **Main Features of ApplicationContext**

1. **Manage bean components:**
    - Automatic creation, linking and destruction of beans.
2. **Dependency Injection:**
    - Supports Dependency Injection (DI) mechanisms.
3. **Event Handling:**
    - Supports publishing and listening to events (eg ContextRefreshedEvent).
4. **Internationalization:**
    - Provides mechanisms for working with messages and locales.
5. **AOP integration:**
    - Allows you to embed aspects into your application.


```java
import org.springframework.context.ApplicationContext;
import org.springframework.context.annotation.AnnotationConfigApplicationContext;

public class MyApp {
    public static void main(String[] args) {
        ApplicationContext context = new AnnotationConfigApplicationContext(AppConfig.class);
        MyBean myBean = context.getBean(MyBean.class);
        myBean.doSomething();
    }
}

```

``` text
reads the configuration
↓
registers BeanDefinition
↓
creates and configures beans
↓
wraps in proxy
↓
controls their lives
```

---
***Tell me about the difference between ApplicationContext and BeanFactory***

**`BeanFactory`** is the base Spring container for managing objects (beans).  
It is responsible for initializing, binding, and providing beans upon request.  
However, **`BeanFactory`** is less functional than **`ApplicationContext`**, as it only provides basic bean management capabilities.

```java
import org.springframework.beans.factory.xml.XmlBeanFactory;
import org.springframework.core.io.ClassPathResource;

public class MyApp {
    public static void main(String[] args) {
        BeanFactory factory = new XmlBeanFactory(new ClassPathResource("beans.xml"));
        MyBean myBean = (MyBean) factory.getBean("myBean");
        myBean.doSomething();
    }
}

```

- **ApplicationContext** is a more powerful and functional container suitable for full-fledged applications.
- **BeanFactory** is a lightweight container, used rarely and mainly in limited tasks or to optimize resources.

 **Differences between ApplicationContext and BeanFactory**

| Criterion                            | ApplicationContext                                                                  | BeanFactory                                               |
| ----------------------------------- | ----------------------------------------------------------------------------------- | --------------------------------------------------------- |
| **Scope of application**              | A complete container for developing modern applications.                        | Basic container for managing beans.                  |
| **Loading beans**                  | Loads all beans when the context is initialized (eager loading).                     | Loads beans on request (lazy loading).                 |
| **Event support**               | Supports publishing and processing events (ApplicationEvent).                     | Does not support events.                                  |
| **Internationalization**             | Built-in internationalization support (I18N).                                    | Absent.                                              |
| **AOP integration**                | AOP support for aspect injection.                                               | Limited integration with AOP.                            |
| **Performance Benefit** | Less productive with a large number of beans (loading all beans at startup). | It is productive because it loads beans only upon request. |
| **Annotation support**             | Full annotation support (eg `@Component`, `@Autowired`).                  | Limited support.                                   |
| **Advanced Features**         | Supports profiles, auto-configuration, REST and other features.                        | Only basic work with beans.                           |


 **When to use**

| Situation                                     | ApplicationContext     | BeanFactory |
| -------------------------------------------- | ---------------------- | ----------- |
| Full application                       | Yes                     | No         |
| Requires working with events                 | Yes                     | No         |
| Memory saving with a large number of beans | No                    | Yes          |
| Test applications                          | Possible, but redundant | Yes          |

---

***Can I raise several contexts?***

Yes, you can create multiple contexts in Spring. This can be useful for separating configuration, areas of responsibility, or working with nested contexts.

 **Examples of using multiple contexts**

 **1. Nested contexts**

You can create a main (parent) and child (child) contexts. The main context can provide beans that are accessible to child contexts, but not vice versa.

**Example:**

```java
ApplicationContext parentContext = new AnnotationConfigApplicationContext(ParentConfig.class);
AnnotationConfigApplicationContext childContext = new AnnotationConfigApplicationContext();
childContext.setParent(parentContext);
childContext.register(ChildConfig.class);
childContext.refresh();
```

 **2. Multiple independent contexts**

If contexts are not related to each other, they do not share beans and settings.

**Example:**

```java
ApplicationContext context1 = new AnnotationConfigApplicationContext(AppConfig1.class);
ApplicationContext context2 = new AnnotationConfigApplicationContext(AppConfig2.class);
```

 **Benefits of using multiple contexts**

- Sharing configuration between application modules.
- Isolation of modules for testing.
- Improved modularity and readability of code.

 **Disadvantages**

- Increased control complexity.
- Possible bean conflicts between contexts.

"""
source_hash = "6f846e3bd87cce2f68cbc6d5317cdb24eed7e81650c827129fa2ee7a4af9a77d"

[[questions]]
id = 38
question = "What are @RequestParam and @PathVariable used for?"
answer = """
These annotations are used in Spring MVC to extract parameters from HTTP requests. They are used in controller methods

`@RequestParam(name)` allows you to extract a parameter named `name` from a request
```java
@GetMapping("/api/users")
public String getUser(@RequestParam String name, @RequestParam(defaultValue = "0") int page) {
    return "Name: " + name + ", Page: " + page;
}
```

`@PathVariable` extracts the path parameter specified in the mapping into a method parameter
```java
@GetMapping("/api/users/{id}")
public String getUserById(@PathVariable int id) {
    return "User ID: " + id;
}
```
"""
source_hash = "d0d6ac20d373b5d03bd40792696143e8ec3b628720161953cf929da5daafe723"

[[questions]]
id = 39
question = "How does @ConfigurationProperties differ from @Value?"
answer = """
`@ConfigurationProperties` allows you to extract properties from configurations like `application.properties`, `application.yaml` into class fields. Particularly useful for mapping multi-level properties
- Binds properties by prefix to class fields
- Convenient for working with groups of related settings
- Requires annotation `@EnableConfigurationProperties` or components of type `@Component`

```yaml
app:
  name: MyApp
  version: 1.0
```

```java
@Component
@ConfigurationProperties(prefix = "app")
public class AppProperties {
    private String name;
    private String version;

    // Getters and setters
}

@Component
public class MyService {
    private final AppProperties appProperties;

    public MyService(AppProperties appProperties) {
        this.appProperties = appProperties;
    }

    public void printConfig() {
        System.out.println("App Name: " + appProperties.getName());
        System.out.println("Version: " + appProperties.getVersion());
    }
}
```

**Comparison of @ConfigurationProperties and @Value**

| Criterion                     | `@ConfigurationProperties`                                        | `@Value`                            |
| ---------------------------- | ----------------------------------------------------------------- | ----------------------------------- |
| **Binding property groups**   | Convenient for groups of related <br>settings (with a prefix)             | Suitable for single properties      |
| **Type casting**         | Automatically supports <br>complex types (such as lists)    | Supports basic types only    |
| **Working with YAML files**    | Fully supported, <br>including complex structures           | Less convenient for complex structures   |
| **Flexibility**                 | Convenient for large configurations.                                  | Faster for small adjustments         |
| **Use example**     | `@ConfigurationProperties(prefix = "app")`                        | `@Value("${app.name}")`             |
| **Annotations**                | Requires <br>`@EnableConfigurationProperties` <br>or `@Component` | Does not require additional annotations |
| **Testing and Validation** | Supports validation via `@Validated`                         | Does not support validation           |

**When to use?**

| Situation                             | `@ConfigurationProperties` | `@Value` |
| ------------------------------------ | -------------------------- | -------- |
| Large number of related properties | Yes                         | No      |
| Single property                   | No                        | Yes       |
| Complex structures (lists, objects)  | Yes                         | No      |
| Simple, static values        | No                        | Yes       |
"""
source_hash = "68d1880d139b5d2100ec5fdcb1c7133e0b1ee221434c21c3dc6b7ddf20ba5032"

[[questions]]
id = 40
question = "What does @Value do?"
answer = """
`@Value` is a Spring annotation that allows you to inject values from configuration files (`application.properties`, `application.yaml`), system variables, or other external sources into fields, methods, or class constructors. Under the hood, it creates a scalar bean (i.e. a bean containing a constant), the value of which is injected

```yaml
app:
  name: MyApp
  version: 1.0
```

```java
@Component
public class AppConfig {

    @Value("${app.name}")
    private String appName;

    @Value("${app.version}")
    private String appVersion;

    @Value("${app.description:Default Description}") // Default value
    private String appDescription;

    public void printConfig() {
        System.out.println("Name: " + appName);
        System.out.println("Version: " + appVersion);
        System.out.println("Description: " + appDescription);
    }
}
```
"""
source_hash = "399b353b4b26934ec53986d46e30042a52e1224e4ea073c2035c29188261f89e"

[[questions]]
id = 41
question = "How does DispatcherServlet work?"
answer = """
**DispatcherServlet** is the core Spring MVC component that processes incoming HTTP requests, routes them to the appropriate controllers, processes the responses, and returns them to the client. This is the **central** HTTP request handler in Spring MVC

**Main cycle of DispatcherServlet**  

**Stage 1**. **Receiving an HTTP request** - `DispatcherServlet` processes all requests coming into the application (if configured as a front controller in `web.xml`, via Java Config or auto-configuration)
  
**Stages 2-3**. **Detecting a Suitable Controller** - Uses `HandlerMapping` to find the controller that should handle the request based on the URL and HTTP method. Using controller annotations (`@RequestMapping`, `@GetMapping`, `@PostMapping`, etc.) it is determined which method should be called  

**Stages 4-5**. **Request processing** - `DispatcherServlet` calls the controller through `HandlerAdapter`, the controller executes the business logic and returns `ModelAndView` or an object in JSON/XML format (for example, with `@ResponseBody`)  

**Steps 6-7**. **Response processing** - the result is passed to the `ViewResolver` component, which determines which view (HTML, JSP, JSON, etc.) needs to be rendered  

**Steps 8-9**. **View Rendering**  

**Stage 10**. **Return to client** - the finished HTTP response is sent back to the client  

{{< figure src="/java-backend-interview-prep/dispatcher_servlet.png" title="" >}}"""
source_hash = "a7a1d39db479a6a23f81be23284d843aec70ea86184d481194c781f41a2fe39a"

[[questions]]
id = 42
question = "How can exceptions be handled in Spring?"
answer = """
**1. Methods with annotation `@ExceptionHandler` in the controller**
- used to handle exceptions at the controller level
- allow you to bind the handling of specific exceptions to a specific method in the controller
```java
@RestController
public class MyController {
                ...

    @ExceptionHandler(IllegalArgumentException.class)
    public ResponseEntity<String> handleIllegalArgument(IllegalArgumentException e) {
        return ResponseEntity.badRequest().body("Error: " + e.getMessage());
    }
}
```

**2. Methods with annotation `@ExceptionHandler` in `@ControllerAdvice`** for centralized global exception handling
```java
@ControllerAdvice
public class GlobalExceptionHandler {

    @ExceptionHandler(IllegalArgumentException.class)
    public ResponseEntity<String> handleIllegalArgument(IllegalArgumentException e) {
        return ResponseEntity.badRequest().body("Global Error: " + e.getMessage());
    }
}
```

**3. ResponseStatusException** allows you to throw exceptions indicating the HTTP status and message
```java
@GetMapping("/error")
public void error() {
    throw new ResponseStatusException(HttpStatus.NOT_FOUND, "Resource not found");
}
```

**4. @ResponseStatus on exception class**
```java
@ResponseStatus(HttpStatus.NOT_FOUND)
public class ResourceNotFoundException extends RuntimeException {
    public ResourceNotFoundException(String message) {
        super(message);
    }
}

@GetMapping("/resource")
public void getResource() {
    throw new ResourceNotFoundException("Resource not found");
}
```

**5. HandlerExceptionResolver**
- low-level approach for complete control over exception handling.
- requires implementation of interface `HandlerExceptionResolver`
```java
@Component
public class CustomExceptionResolver implements HandlerExceptionResolver {

    @Override
    public ModelAndView resolveException(HttpServletRequest request, HttpServletResponse response, Object handler, Exception ex) {
        try {
            response.sendError(HttpServletResponse.SC_BAD_REQUEST, ex.getMessage());
        } catch (IOException e) {
            e.printStackTrace();
        }
        return new ModelAndView();
    }
}
```

**6. RestTemplate and WebClient**
To handle errors when executing REST requests, you can use custom error handlers, such as `ResponseErrorHandler` for `RestTemplate`
```java
RestTemplate restTemplate = new RestTemplate();
restTemplate.setErrorHandler(new DefaultResponseErrorHandler() {
    @Override
    public void handleError(ClientHttpResponse response) throws IOException {
        // Error handling
    }
});
```

---
***How does transaction logic handle exceptions?***


Spring uses a transaction manager to handle transactions. Exceptions in transactional logic affect the commit or rollback of a transaction.

 **Basic principles of exception handling in transactions:**

1. **Rollback for `RuntimeException` and `Error`:**
    
    - By default, Spring rolls back a transaction when `RuntimeException` or `Error` occurs.
    - Exceptions of type `Checked Exception` (for example, `SQLException`) **do not rollback the transaction** unless explicitly specified.
2. **Setting rollback:** You can specify which exceptions should trigger a rollback.
    

**Example:**

```java
@Transactional(rollbackFor = Exception.class)
public void performTransaction() throws Exception {
    // If thrown Exception, the transaction is rolled back
    throw new Exception("Transaction failed");
}
```

3. **Save state after exception:** If a transaction is rolled back, the changes made to the database as part of the transaction are not saved.
    
4. **Working with `@Transactional`:**
    
    - If the transaction fails, the Spring container calls the `rollback` method on the transaction manager being used.
    - For `private` methods or calls within the same class, transaction processing may fail.

**Example:**

```java
@Transactional
public void process() {
    try {
        performAction();
    } catch (Exception e) {
        // Exception handled, transaction rolled back
        throw e;
    }
}

private void performAction() {
    // Actions that throw an exception
    throw new RuntimeException("Error in action");
}
```

 **Main problems and solutions:**

|Problem|Solution|
|---|---|
|Internal method call with `@Transactional`.|Use a proxy or call a method through another bean.|
|The `Checked Exception` exception does not result in a rollback.|Specify `rollbackFor` in the annotation `@Transactional`.|
|Reusing a transaction.|Specify the `propagation` parameter, for example, `Propagation.REQUIRES_NEW` to open a new transaction.|

"""
source_hash = "82df6f983d6fa47c7e08af3448ebb2a388b8ba169e1ed3c0988d0256a1582b8e"

[[questions]]
id = 43
question = "Is @Configuration a component, and what additional behavior does it provide?"
answer = """
The annotation `@Configuration` is a specialized Spring component. It indicates that the class is used for application configuration, including the creation of beans. Processes similarly to `@Component` annotation

**Additional logic implemented by @Configuration**
**1. Defining beans (@Bean)** - classes with `@Configuration` allow you to define methods marked `@Bean` that return beans
```java
@Configuration
public class AppConfig {

    @Bean
    public MyService myService() {
        return new MyService();
    }
}
```

**2. Proxy support (proxyBeanMethods = true)** - By default, Spring wraps a class with `@Configuration` in a proxy to ensure dependencies are created and managed correctly. This allows the same bean instance to be referenced
```java
@Configuration
public class AppConfig {

    @Bean
    public ServiceA serviceA() {
        return new ServiceA(serviceB());
    }

    @Bean
    public ServiceB serviceB() {
        return new ServiceB();
    }
}
```
When calling `serviceB()` inside the `serviceA()` method, the Spring container returns the same instance of `ServiceB`

**3. Logic for importing configuration** - class with `@Configuration` can import other configuration classes via `@Import`
```java
@Configuration
@Import(AnotherConfig.class)
public class AppConfig {}
```

** 4. Support for additional annotations** - in classes with `@Configuration` you can use annotations such as `@ComponentScan`, `@PropertySource`, and others

**`@Configuration` vs `@Component`**
The `@Configuration` and `@Component` annotations in Spring are used to register beans in a container, but they have different purposes and behavior

|**Criterion**|`@Configuration`|`@Component`|
|---|---|---|
|**Purpose**|Used to create configuration classes and beans|Used to denote a regular Spring bean|
|**Creating beans**|Defines beans through methods with annotation `@Bean`|Beans are created automatically (via class scanning)|
|**Proxy (proxyBeanMethods)**|Default is `true`, which provides singleton for beans|No proxy used|
|**Semantics**|Indicates that the class contains settings for the application|Describes the logical component of an application|
|**Import configurations**|Supports `@Import` for connecting other configurations|Does not support|
|**Use with @Bean**|Methods with `@Bean` guarantee the creation of one instance (singleton)|Methods with `@Bean` are called directly in the standard way|
|**Where to use**|In configuration classes to define settings and beans|In utility classes, services, repositories, etc.|
"""
source_hash = "86ff0bcce27d16f17d007f4dc8b3b801c0c9877d658164ff3813feb9918029a1"

[[questions]]
id = 44
question = "@PostConstruct"
answer = """
A method marked with the annotation `@PostConstruct` is defined by Spring as the `init` method on a bean, which must be executed after the bean has been completely created and its dependencies have been injected. This method is called once for each bean instance

**How many `@PostConstruct` can be declared in a bean?**
According to the specification, there should be only one method in one class, labeled `@PostConstruct`. However, one bean can have several `@PostConstruct` methods if they are declared in different classes of the inheritance hierarchy. Spring will call such methods when the bean is initialized.

"""
