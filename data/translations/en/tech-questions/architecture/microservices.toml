[[questions]]
id = 7
question = "HTTP vs. Kafka: how should microservices communicate, and why?"
answer = """

|**Criterion**|**HTTP**|**Kafka**|
|---|---|---|
|**Type of interaction**|Synchronous (request-response)|Asynchronous (publish and subscribe to events)|
|**Data transmission reliability**|No built-in request re-delivery mechanism|Messages are persisted and delivered even when consumer failures occur|
|**Performance**|Limited by the number of simultaneous requests and service availability|High performance when processing large volumes of messages|
|**Difficulty of implementation**|Easy to implement using standard libraries and protocols|Additional configuration of brokers, topics and clients is required|
|**Delays**|Minimal, since the response comes immediately after the request|There may be delays due to asynchronous message processing|
|**Independence of services**|Services (sender and receiver) depend on each other's availability|Complete independence of services: the sender does not know about the state of the recipient|
|**Scalability**|Limited by synchronous interaction and increasing number of clients|Scales well to handle high loads|
|**Event support**|Not suitable for event-driven architecture|Designed to work with events (processing, storage, relaying)|
|**Compatibility**|Supported by almost all programming languages and libraries|Requires support for Kafka clients for various languages|
|**Crash Resistant**|If one service is unavailable, the request cannot be processed|Messages are kept in a queue until they are processed|

**Use HTTP** if:
- immediate confirmation of the result is needed (for example, authorization, command execution)
- the system is simple and does not require complex message processing

**Use Kafka** if:
- high performance and scalability required
- services must be independent and work asynchronously
- Reliability of data transmission and minimization of the impact of failures are important

The ideal approach is a hybrid use:
- use HTTP for real-time interaction
- for the event model and processing large amounts of data - Kafka

"""
source_hash = "53301012d0ce75bddafb4eb96cf49ea284782ba5f1d0879b1feb340bfa0f85a1"

[[questions]]
id = 8
question = "What design patterns are used in microservice architectures?"
answer = """

| Pattern               | Category            | Brief description                                                                                          | When to use                                              |
| --------------------- | -------------------- | --------------------------------------------------------------------------------------------------------- | ------------------------------------------------------------ |
| **API Gateway**       | Integration           | Single entry point, routing requests to microservices                                                | When to hide internal URLs and merge contracts     |
| **Service Discovery** | Infrastructure       | Automatic registration and search for services in the cluster                                                    | With dynamic scaling and frequent restarts       |
| **Circuit Breaker**   | Reliability           | Stops calls to an unavailable service and allows it to recover                                      | For fragile remote dependencies with variable availability |
| **Retry**             | Reliability           | Retrying Failed Queries                                                           | In case of short-term network or infrastructure failures       |
| **Bulkhead**          | Reliability           | Isolation of resources (thread pools, connections) for each service                                          | So that the failure of one functionality does not “flood” the entire service       |
| **Saga**              | Transactions           | Managing distributed transactions through a sequence of local operations and compensation         | When you need data in several services with rollback of changes |
| **CQRS**              | Data Modeling | Separation of commands (write) and requests (read) into different models and services                                    | For high read performance requirements          |
| **Strangler Fig**     | Deployment        | Gradual transfer of functionality of the old system to microservices                                        | Migrate monolith to microservices step by step               |
| **Sidecar**           | Infrastructure       | A neighboring process next to a service, providing cross-functional capabilities (logging, proxying) | For consistent routing, security, telemetry    |
| **Ambassador**        | Infrastructure       | Proxy/agent acting as an “ambassador” of the service, carrying out external integration                             | When you need to move external dependencies outside the service boundaries   |
"""
source_hash = "248811947195bad46d5ab6dcff8f70c4e5fcbc8d112022b89c5f9e91f2483f54"

[[questions]]
id = 9
question = "What is the Transactional Outbox pattern?"
answer = """
Transactional Outbox is a pattern that provides reliable delivery of events between services. It consists in the fact that business data and an event are written in one transaction to the database, and then a separate process publishes the event to the broker. This way we avoid desynchronization between the database and the queue.

**The problem it solves**
```java
@Transactional
public void placeOrder(Order order) {
    orderRepository.save(order); // 1 Saved the order in the database
    eventBus.publish(new OrderCreatedEvent(order)); // 2 Sent event to Kafka
}
```
If a failure occurs between 1 and 2 (for example, the network is down, the broker is unavailable, the application is dead) - the order will be saved, but the event will not go away, and other services (for example, `payment-service`) will never know about it
If, on the contrary, the message is gone and the transaction ends with a rollback, then the recipient will learn about an order that is not in the database.

**Solution through pattern:**
```java
// we save the event in one transaction with the entity
@Transactional  
public void createOrder() {  
  
\torderRepository.save(order);   
\toutboxRepository.save(
\t\tnew OutboxEvent("OrderCreated",json(order))
\t);  
}

// in the scheduler we read events with the required status and send them to the broker
@Scheduled(fixedDelay = 1000)
public void publish() {
    var events = outboxRepository.findUnprocessed();
    for (var event : events) {
    
        kafka.send(
            event.type(),
            event.payload()
        );

        event.markProcessed();
        outboxRepository.save(event);
    }
}
```
An important nuance - if after sending to the broker the new status is not installed in the database (`outboxRepository.save(event)` does not work), then the next call will resend the same event, which means message deduplication must be carried out on the consumer (idempotency)

**Advantages of the pattern**
- **Atomicity** - data and event are recorded by one transaction
- **Reliability** - you won’t lose events even if there’s a failure
- **Simplicity** - everything is stored in one database
- **Compatible with any broker** - Kafka, RabbitMQ, SQS, etc 
- **Easy to debug** - you can see the outbox table

**Disadvantages**
- Table `outbox` is growing - needs to be cleaned
- Events are not published instantly (you need to plan for a delay)
- Need to watch out for idempotency on the consumer side

*Enterprise systems often use ready-made CDC (Change Data Capture) systems, for example Debezium, which reads not a table in Postgresql, but a WAL log before sending it to Kafka.*"""
source_hash = "60575c2db92ad3668a0594c5774150256941f34e47ea7212e0d6dc9942bede75"
