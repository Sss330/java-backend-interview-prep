[[questions]]
id = 5
question = "REST vs RPC. How to choose which is best?"
answer = """
REST is usually used to work with data.
To work with actions and operations (logout, login, signin), RPC will look better.

RPC describes everything in verbs, while REST describes everything in nouns
"""
