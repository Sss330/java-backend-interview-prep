[[questions]]
id = 6
question = "What are the six architectural constraints of REST?"
answer = """
- **Client-server architecture** - client and server work independently of each other. The client sends requests to the server, the server accepts them and returns responses. This allows the client and server to develop independently of each other
- **Stateless** - the server does not save information about the client's state between requests. Information about the current session should be entirely stored by the client
- **Caching** - in the REST API, the server can remember the results of frequent requests in order to return their result faster and not waste resources on repeated calculations
- **Consistency of the interface** - the API uses standard HTTP methods to make interaction simple and predictable
    - **`GET`** - retrieves a resource or collection of resources
    - **`POST`** - creates a new resource or sends data for processing
    - **`PUT`** - completely updates an existing resource, replacing it with new data
    - **`PATCH`** - partially updates the resource
    - **`DELETE`** - deletes a resource
- **Layers** - the system can be divided into several layers, each of which performs its own task
- **Code on Demand** - sometimes the server can send the client code (such as scripts) that the client can use to perform tasks

[Good article about REST principles](https://appmaster.io/ru/blog/shest-pravil-otdykha-apis)
"""
source_hash = "49e84571c57c5831995c1cec4eff3ed2ff32c51e1a594df244d83c52e2435d30"

[[questions]]
id = 7
question = "What makes an HTTP method idempotent?"
answer = """
Idempotency is the property of an HTTP request that, when executed again, produces the same result as the first time (without additional side effects)

| **Method**   | **Description**                                | **Idempotent?**                     |
| ----------- | ------------------------------------------- | ------------------------------------- |
| **GET**     | Getting a resource                           | Yes                                    |
| **POST**    | Creating a resource                            | No                                   |
| **PUT**     | Resource update (replacement)                 | Yes                                    |
| **PATCH**   | Partial update                        | No                                   |
| **DELETE**  | Deleting a resource                            | Yes (if the server is implemented correctly) |
| **HEAD**    | Retrieving meta information (without response body) | Yes                                    |
| **OPTIONS** | Query available methods for a resource        | Yes                                    |

**Example `PUT` (idempotent)**
```
PUT /users/1
{
    "name": "Alice",
    "email": "alice@example.com"
}
```
If you do it 100 times, the state will not change - the entry will simply be overwritten

**Example `POST` (NOT idempotent)**
```
POST /users
{
    "name": "Alice",
    "email": "alice@example.com"
}
```
If executed 100 times, 100 users will be created.
"""
source_hash = "c37e9d1955d4cca65ef0775818705aa7d0ce0b8f73c7e7c32b9917a798531a09"

