[[questions]]
id = 10
question = "GET vs POST"
answer = """

|**Criterion**|**GET**|**POST**|
|---|---|---|
|**Purpose**|Receiving data|Create or change data|
|**Data transfer**|The data is passed in the URL (in the query string)|Data is transmitted in the body of the HTTP request|
|**Security**|Less secure (data visible in URL and server logs)|More secure (data not visible in URL)|
|**Idempotency**|Idempotent|Not idempotent|
|**Caching**|Supported by browsers and proxy servers|Caching is not supported by default|
|**Length limit**|URL string length restrictions vary by browser|There are usually no restrictions on the length of the request body|
|**Use example**|Data search, page display|Submitting forms, creating resources, changing data|

**Why it is recommended to use POST rather than GET requests for sensitive data**
1. **Security** - in a GET request, the data is transmitted in a URL, which can be visible in the browser history, server and proxy logs; in a POST request, the data is transmitted in the body of the request, which reduces the risk of accidental leakage
2. **Length Limits** - GET URL length is limited by browsers or servers, so large amounts of data (such as sensitive forms) may not get through
3. **Caching** - GET requests may be cached by proxy servers or browsers, which is undesirable for sensitive information

**Can we always use only POST and not work with GET?**
In theory, yes, but it violates REST principles and web application architecture:
1. **REST principles** - GET is for receiving data, POST is for creating. Using POST for all operations makes the API difficult to understand and support
2. **Optimization and caching** - GET requests can be cached, which speeds up work. POST requests are not cached by default
3. **Search Engines and SEO** - GET is used to index pages. If you use POST only, the pages will not appear in search results

**Can we create a resource using GET? Are there technical limitations?**
1. **Technical limitations** - from the point of view of the HTTP protocol, GET should not create resources. But technically the server can process GET requests so that they change data (for example, create a resource)
2. **Practice** - creating or modifying resources via GET breaks idempotency and can cause problems with caching and repeated requests

**Why did you decide to remove the body from the GET method?**
1. **Undefined behavior** - GET semantics only mean receiving data. The request body is not a required part of this semantics, so servers can ignore it
2. **Compatibility** - Many proxies, frameworks and libraries do not support body in GET, which could lead to compatibility issues.
3. **Simplicity and Idempotency** - GET requests are considered idempotent and safe. Having a body could change this concept, creating more confusion
"""
source_hash = "1511c00801baf7a51bff6f7466411c2c6f3ca3d70c90d63cfef0ab36f0923951"

