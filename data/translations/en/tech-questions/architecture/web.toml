[[questions]]
id = 13
question = "What authorization methods exist for the HTTP protocol?"
answer = """

| **Method**                 | **Description**                                                                                                           | **Features**                                                                                |
| ------------------------- | ---------------------------------------------------------------------------------------------------------------------- | ---------------------------------------------------------------------------------------------- |
| **Basic Authentication**  | The client sends the username and password encoded in Base64 in the header<br>`Authorization: Basic <encoded_credentials>` | Vulnerable to interception without using HTTPS. Recommended for use in combination with SSL/TLS |
| **Bearer Token**          | The client sends the token in the header<br>`Authorization: Bearer <token>`                                                 | Used with OAuth2 and JWT. Convenient for working with API                                           |
| **Digest Authentication** | The server sends the client a nonce (one-time token), which the client uses to hash its credentials    | Outdated method, difficult to implement, less popular                                         |
| **OAuth 2.0**             | Authorization mechanism through third-party services. The client receives an access token from the authorization server.                    | Extensible, allows use of third party applications (eg Google, Facebook)          |
| **API Key**               | The client sends the API key in the header, URL, or request parameter                                                      | Simple, but less secure. Requires secure transmission (HTTPS)                                 |
| **Session-based**         | The client stores the session ID in a cookie, and the server checks the session against the database                               | Widely used in web applications, requires server session management                    |
| **Custom Authentication** | Using custom tokens or authorization mechanisms                                                             | Flexible, but requires more effort to implement and ensure security                   |
| **Mutual TLS**            | Two-way authentication using TLS certificates                                                          | High level of security, difficult to configure                                               |
"""
source_hash = "ad35d9ec61ea56eddb0fed80b5c271a0286005142de62eaf7fe0881fd787f79d"

[[questions]]
id = 14
question = "What does a JSON Web Token consist of?"
answer = """
JWT (JSON Web Token) is a standard way of transporting information in a compact format (JSON) with a signature to ensure its integrity and authenticity. Used for authorization, data transfer between client and server

**What does JWT consist of?**
The JWT consists of three parts, separated by dots (`.`):
```
<Header>.<Payload>.<Signature>
```

1. **Header** - contains meta information about the token:
    - Signature algorithm (eg HMAC SHA256, RSA).
    - Token type (`JWT`)
    Example:
    ```json
    {
      "alg": "HS256",
      "typ": "JWT"
    }
    ```
2. **Payload** - contains data (usually about the user) - marks that need to be transferred. May include:
    - **reserved marks:** - standard fields such as `iss` (publisher), `exp` (expiration time), `sub` (subject) and some others
    - **user brands** - any data, such as user role, identifier, etc.
    Example:
    ```json
    {
      "sub": "1234567890",
      "name": "John Doe",
      "admin": true
    }
    ```
3. **Signature** - needed to sign the token so that its authenticity can be verified. Formed using a header, payload and secret key (or private key in the case of an asymmetric signature algorithm)
    Example formula:
    ```
    HMACSHA256(
      base64UrlEncode(header) + "." + base64UrlEncode(payload),
      secret
    )
    
    ```

JWT example:
```
eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIxMjM0NTY3ODkwIiwibmFtZSI6IkpvaG4gRG9lIiwiYWRtaW4iOnRydWV9.SflKxwRJSMeKKF2QT4fwpMeJf36POk6yJV_adQssw5c

```
1. Header - `eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9`
2. Payload - `eyJzdWIiOiIxMjM0NTY3ODkwIiwibmFtZSI6IkpvaG4gRG9lIiwiYWRtaW4iOnRydWV9`
3. Signature - `SflKxwRJSMeKKF2QT4fwpMeJf36POk6yJV_adQssw5c`
"""
source_hash = "c8845cdc5e2e0ae5e14578eb0f3479e9974a539522af18047a4c47e938e848c3"

[[questions]]
id = 15
question = "What are application layer protocols?"
answer = """
Application layer protocols are the 7th layer of the OSI model, which is responsible for the interaction of applications over the network

**Basic protocols:**
- **HTTP, HTTPS** - data transfer on the web
- **FTP, SFTP** - file transfer
- **SMTP, POP3, IMAP** - mail protocols
- **WebSockets** - real-time two-way communication
- **DNS** - domain to IP conversion
- **MQTT** - IoT messaging
- **gRPC** is a binary protocol for microservices

**Usage Examples**
- Browser (Chrome, Firefox) - HTTP/HTTPS
- Mail client (Outlook, Gmail) - IMAP/SMTP
- FTP client (FileZilla) - FTP/SFTP
"""
source_hash = "1634a0a24e7b26be63b8c9120490a7cb61719f0f66933552edba947ebd5c7642"

[[questions]]
id = 16
question = "What is HTTP?"
answer = """
HTTP (HyperText Transfer Protocol) is a hypertext transfer protocol (text + hyperlinks) that is used to communicate between browsers and servers

**HTTP Key Features:**
- **client-server model** (browser - client, server - website)
- **stateless** (without saving state)
- **text protocol** (easy to read)
- **runs over TCP** (usually port 80 for HTTP, 443 for HTTPS)
"""
source_hash = "df3569b7e7de7727ca95bfb3debd85d76d1c7360d5b3699f9a9a57cef5f2c1b4"

[[questions]]
id = 17
question = "What are cookies used for?"
answer = """
A cookie is a small data file that a browser stores on behalf of a website. They are transmitted between the client and server via HTTP headers.

**Main purposes of Cookies**
- **Authentication** - storing user session (`JSESSIONID`, `session_token`)
- **Personalization** - remembering settings (language, site theme)
- **Tracking and analytics** - collection of user data (Google Analytics)
- **Saving cart** - storing goods in the online store

**How does Cookie work?**
1. The server sends a Cookie to the client (browser)
```
Set-Cookie: session_id=abc123; HttpOnly; Secure; Max-Age=3600
```
2. The client stores Cookies and sends them on every request
```
Cookie: session_id=abc123
```
3. The server checks the Cookie and makes a decision (for example, authorization)


**Types of Cookies**

|**Cookie Type**|**Description**|
|---|---|
|**Session Cookie**|Deleted after closing the browser|
|**Persistent Cookie**|Stored for a certain time (`Max-Age`, `Expires`)|
|**HttpOnly Cookie**|Available only to the server (JS cannot read)|
|**Secure Cookie**|Sent via HTTPS only|
|**SameSite Cookie**|CSRF protection (transmission can be limited)|

**Set-Cookie example with attributes**
```
Set-Cookie: user=Alice; Expires=Wed, 21 Oct 2025 07:28:00 GMT; Secure; HttpOnly; SameSite=Strict
```
"""
source_hash = "6d0afe890dd18e139221839a570924e3ba029a2c6e045de86958a744a81e3d5e"

[[questions]]
id = 18
question = "How do POST, PUT, and PATCH differ?"
answer = """
|**Method**|**Purpose**|**Idempotency**|**Request body**|**Use example**|
|---|---|---|---|---|
|**POST**|Creating a new resource or performing some operation|❌ Non-idempotent|Complete creation data|`POST /users` (create a new user)|
|**PUT**|Complete replacement of the resource (or creation if does not exist)|✅ Idempotent|Complete data for the resource|`PUT /users/123` (replace user with ID=123)|
|**PATCH**|Partial resource update|❌ Non-idempotent (by standard)|Data with editable fields|`PATCH /users/123` (update user email only)|

 **Additional explanations:**

1. **POST**:
    
    - Used to **create** or run **operations** that can change state on the server.
    - Repeatedly calling `POST` may result in **duplication** of resources (non-idempotency).
2. **PUT**:
    
    - Typically implies a **full** update of the resource at the specified URI.
    - **Idempotency**: calling again with the same request body will not change the result (if the resource already exists).
3. **PATCH**:
    
    - Allows you to **partially update** a resource (we transfer only changeable fields).
    - **Often** is not considered idempotent, since reapplying `PATCH` may result in other changes, but much is implementation dependent.

Thus, **POST** is most often used for **creation**, **PUT** for **full replacement** (or creation if the resource is missing), and **PATCH** for **partial update**."""
source_hash = "b849d1028895223842632c981eedb4c711c1a115f17b84b5498233f5cf68d03f"
