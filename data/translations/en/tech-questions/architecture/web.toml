[[questions]]
id = 2
question = "RESTful and RESTless"
answer = "RESTful strictly follows the principles of REST, using standard HTTP methods and clearly structured URLs, while RESTless breaks these principles by making the experience less standard and more flexible."
source_hash = "66a4b032137e83fbe2b99eead91c99a050c2c94c5ffc3982e418f3a7342c0c90"

[[questions]]
id = 3
question = "REST vs SOAP"
answer = """
SOAP and REST are two different approaches to API development. The SOAP approach is highly structured and uses the XML data format. REST is more flexible and allows applications to exchange data in multiple formats

_Note: SOAP is currently considered an outdated approach, used only in legacy projects_
"""
