[[questions]]
id = 12
question = "What does an HTTP request consist of?"
answer = """

| **Part**                       | **Description**                                                                                                                         |
| ------------------------------- | ------------------------------------------------------------------------------------------------------------------------------------ |
| Request Line | Contains the request method, URL, and HTTP protocol version.<br>Example: `GET /index.html HTTP/1.1`                                     |
| Headers             | Metadata about the request: content type, length, authorization information and more.<br>Example: `Content-Type: application/json` |
| Empty string                   | Separates request headers and body                                                                                                   |
| Request body (Body)             | Directly the data that is transferred to the server (for example, JSON, XML, file). Not always present                               |
"""
